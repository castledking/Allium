    success:
      - "{prefix} &aMensaje eliminado."
      - "[sound] item.book.page_turn 1.0"
    multiple:
      - "{prefix} &aMensajes eliminados."
      - "[sound] item.book.page_turn 1.0"
    not-found:
      - "{prefix} &cMensaje no encontrado."
    amount:
      - "{prefix} &cLa cantidad debe estar entre 1 y 200."

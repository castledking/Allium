name: Curios
main: codes.castled.curios.CuriosPlugin
version: '1.0.2'
api-version: '1.20'
depend: [Allium]
softdepend: [packetevents]
allium-api: '^1.1'
allium-addon-dir: true
allium-pack: curios-pack.zip
folia-supported: true
commands:
  curios:
    aliases: [relics, reliques, tradingcards, cards]
    description: Equip, level, merge, import and trade curios
    permission: curios.use
  frame:
    description: View, choose, apply, or author item and hover frames
    permission: curios.use
permissions:
  curios.use:
    default: true
  curios.admin:
    default: op
  allium.frame.admin:
    default: op

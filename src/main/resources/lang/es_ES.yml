# Allium language: text lines plus optional "[sound] id [pitch] [volume]".
# Volume omitted below: use the configured server default.

prefix: "&7[&dAllium&7]"
core:
  reload-success:
    - "{prefix} &aConfiguracion recargada."
    - "[sound] block.note_block.chime 1.35"
  reload-failed:
    - "{prefix} &cFallo al recargar. Revisa la consola."
    - "[sound] block.note_block.bass 0.75"
  version:
    - "{prefix} &fEjecutando Allium &dv{version}&f."
    - "[sound] ui.button.click 1.25"
  import:
    lang-no-source:
      - "{prefix} &cNo hay un archivo de idioma anterior en &f{file}&c."
      - "[sound] block.note_block.bass 0.8"
    lang-report:
      - "{prefix} &7{mode}: &f{write} &7por escribir, &f{same} &7ya importados, &f{kept} &7conservados (personalizados), &f{unmapped} &7aun no portables. Los detalles estan en la consola."
      - "[sound] item.book.page_turn 1.0"
    lang-applied:
      - "{prefix} &aImportados &f{write} &amensaje(s) en &f{file}&a; el archivo anterior se guardo como &f{backup}&a."
      - "[sound] entity.player.levelup 1.35"
    lang-nothing:
      - "{prefix} &aNada que importar; &f{file} &aesta al dia."
      - "[sound] block.note_block.hat 1.15"
    lang-failed:
      - "{prefix} &cLa importacion del idioma fallo: &f{reason}"
      - "[sound] block.note_block.bass 0.75"
  adopt-window:
    opened:
      - "{prefix} &eLas herramientas privilegiadas anteriores al recode se adoptan al primer uso durante los proximos &f{duration}&e. Cada adopcion queda registrada. Cierralo antes con &f/allium adopt-window off&e."
      - "[sound] block.beacon.activate 1.25"
    closed:
      - "{prefix} &aLa ventana de adopcion esta cerrada."
      - "[sound] block.beacon.deactivate 1.0"
    status:
      - "{prefix} &7La ventana de adopcion esta &f{state}&7."
      - "[sound] ui.button.click 1.1"
error:
  no-permission:
    - "{prefix} &cNo tienes permiso para hacer eso."
    - "[sound] entity.villager.no 1.0"
  player-only:
    - "{prefix} &cEste comando solo puede ser usado por jugadores."
  console-only:
    - "{prefix} &cEste comando solo puede ser usado desde la consola."
    - "[sound] entity.villager.no 0.95"
  invalid-args:
    - "{prefix} &cUso: &f{usage}"
    - "[sound] ui.button.click 0.75"
  player-not-found:
    - "{prefix} &cJugador &f{player} &cno encontrado."
    - "[sound] block.note_block.bass 0.8"
  number-invalid:
    - "{prefix} &c'{input}' no es un numero valido."
    - "[sound] block.note_block.bass 0.8"
  world-not-found:
    - "{prefix} &cMundo &f{world} &cno encontrado."
    - "[sound] block.note_block.bass 0.8"
  cooldown-active:
    - "{prefix} &cEspera &f{time} &cantes de usar esto de nuevo."
    - "[sound] block.note_block.hat 0.85"
  module-disabled:
    - "{prefix} &cEsta funcion esta desactivada."
    - "[sound] entity.villager.no 0.9"
teleport:
  selection:
    - "{prefix} &e{message}"
  offline-success:
    - "{prefix} &aTeletransportado a la última ubicación guardada de &f{target}&a."
    - "[sound] entity.enderman.teleport 1.2"
  offline-unavailable:
    - "{prefix} &cNo hay una ubicación guardada disponible para ese jugador."
    - "[sound] block.note_block.bass 0.8"
  success:
    - "{prefix} &aTeletransportado a &f{target}&a."
    - "[sound] entity.enderman.teleport 1.15"
  request-sent:
    - "{prefix} &aSolicitud de teletransporte enviada a &f{player}&a."
    - "[sound] block.note_block.pling 1.35"
  request-received:
    - "{prefix} &f{player} &aquiere teletransportarse a ti. &f/tpaccept &ao &f/tpdeny"
    - "[sound] block.note_block.bell 1.25"
  accepted:
    - "{prefix} &aSolicitud de teletransporte aceptada."
    - "[sound] block.note_block.pling 1.5"
  denied:
    - "{prefix} &cSolicitud de teletransporte denegada."
    - "[sound] block.note_block.bass 0.8"
  cancelled:
    - "{prefix} &cSolicitud de teletransporte expirada."
    - "[sound] block.note_block.bass 0.75"
  back:
    - "{prefix} &aRegresaste a tu ubicacion anterior."
    - "[sound] entity.enderman.teleport 0.95"
  no-back:
    - "{prefix} &cNo hay ubicacion anterior."
    - "[sound] block.note_block.bass 0.8"
  no-pending:
    - "{prefix} &cNo tienes solicitudes pendientes."
    - "[sound] block.note_block.bass 0.85"
  here-received:
    - "{prefix} &f{player} &aquiere que te teletransportes hacia el. &f/tpaccept &ao &f/tpdeny"
    - "[sound] block.note_block.bell 1.15"
  request-cancelled:
    - "{prefix} &cSolicitud de teletransporte cancelada."
    - "[sound] block.note_block.hat 0.8"
  warmup:
    - "{prefix} &eTeletransportando en {time}s. Quedate quieto y evita dano."
    - "[sound] block.note_block.chime 1.0"
  interrupted:
    - "{prefix} &cTeletransporte cancelado: {reason}."
    - "[sound] item.shield.break 1.15"
  refused:
    - "{prefix} &c{player} no puede recibir teletransportes ahora mismo."
    - "[sound] entity.villager.no 1.0"
  loading:
    - "{prefix} &cTus datos de teletransporte aun se estan cargando. Intentalo de nuevo en un momento."
    - "[sound] block.note_block.hat 0.9"
  storage-failed:
    - "{prefix} &cNo se pudieron guardar los datos de teletransporte. Intentalo de nuevo en un momento."
    - "[sound] block.note_block.bass 0.7"
  unsafe:
    - "{prefix} &cNo se encontro un destino seguro. No se teletransporto nada."
    - "[sound] item.shield.break 0.95"
  busy:
    - "{prefix} &cYa hay un teletransporte pendiente. Intentalo de nuevo en un momento."
    - "[sound] block.note_block.hat 0.85"
  self:
    - "{prefix} &cNo puedes enviarte una solicitud de teletransporte a ti mismo."
    - "[sound] block.note_block.bass 0.8"
  toggle-on:
    - "{prefix} &a{player} ahora acepta solicitudes de teletransporte."
    - "[sound] block.note_block.pling 1.4"
  toggle-off:
    - "{prefix} &c{player} ya no acepta solicitudes de teletransporte. Solicitudes entrantes canceladas."
    - "[sound] block.note_block.bass 0.85"
travel:
  loading:
    - "{prefix} &cLos datos de viaje se estan cargando. Intentalo de nuevo en un momento."
    - "[sound] block.note_block.hat 0.9"
  busy:
    - "{prefix} &cEl almacenamiento de viajes esta ocupado. Intentalo de nuevo en un momento."
    - "[sound] block.note_block.hat 0.85"
  storage-failed:
    - "{prefix} &cNo se pudieron guardar los datos de viaje. Intentalo de nuevo en un momento."
    - "[sound] block.note_block.bass 0.7"
  name-invalid:
    - "{prefix} &cUsa de 1 a 32 letras, digitos, guiones bajos o guiones para el nombre."
    - "[sound] block.note_block.bass 0.8"
  confirm:
    - "{prefix} &eEste nombre ya existe. Ejecuta &f{command} &epara confirmar la ubicacion capturada."
    - "[sound] block.note_block.bell 1.1"
  confirm-expired:
    - "{prefix} &cNo hay ninguna confirmacion de sobrescritura activa. Ejecuta de nuevo el comando para establecer."
    - "[sound] block.note_block.bass 0.75"
  changed:
    - "{prefix} &cEste destino cambio. Ejecuta el comando de nuevo."
    - "[sound] block.note_block.bass 0.8"
  limit:
    - "{prefix} &cHas alcanzado tu limite de hogares ({limit})."
    - "[sound] entity.villager.no 0.95"
home:
  set:
    - "{prefix} &aHogar &f{name} &aestablecido."
    - "[sound] block.note_block.chime 1.3"
  deleted:
    - "{prefix} &aHogar &f{name} &aeliminado."
    - "[sound] item.book.page_turn 0.9"
  not-found:
    - "{prefix} &cHogar &f{name} &cno encontrado."
    - "[sound] block.note_block.bass 0.8"
  limit-reached:
    - "{prefix} &cHas alcanzado el limite de hogares (&f{limit}&c)."
    - "[sound] entity.villager.no 0.95"
  list:
    - "{prefix} &fHogares: &d{homes}"
    - "[sound] item.book.page_turn 1.1"
  none:
    - "{prefix} &cNo tienes hogares establecidos."
    - "[sound] block.note_block.hat 0.9"
warp:
  set:
    - "{prefix} &aWarp &f{name} &aestablecido."
    - "[sound] block.enchantment_table.use 1.25"
  deleted:
    - "{prefix} &aWarp &f{name} &aeliminado."
    - "[sound] item.book.page_turn 0.9"
  not-found:
    - "{prefix} &cWarp &f{name} &cno encontrado."
    - "[sound] block.note_block.bass 0.8"
  list:
    - "{prefix} &fWarps: &d{warps}"
    - "[sound] item.book.page_turn 1.1"
  none:
    - "{prefix} &cNo hay warps disponibles."
    - "[sound] block.note_block.hat 0.9"
spawn:
  set:
    - "{prefix} &aPunto de aparicion establecido."
    - "[sound] block.beacon.activate 1.2"
  teleport:
    - "{prefix} &aTeletransportado al spawn."
    - "[sound] entity.enderman.teleport 1.25"
  not-set:
    - "{prefix} &cEl spawn no ha sido establecido."
    - "[sound] block.note_block.bass 0.8"
kit:
  received:
    - "{prefix} &aKit &f{name} &arecibido."
    - "[sound] entity.player.levelup 1.4"
  given:
    - "{prefix} &aKit &f{name} &aentregado a &f{player}&a."
    - "[sound] entity.item.pickup 1.2"
  not-found:
    - "{prefix} &cKit &f{name} &cno encontrado."
    - "[sound] block.note_block.bass 0.8"
  no-permission:
    - "{prefix} &cNo tienes permiso para reclamar el kit &f{name}&c."
    - "[sound] entity.villager.no 1.0"
  list:
    - "{prefix} &fKits: &d{kits}"
    - "[sound] item.book.page_turn 1.1"
  none:
    - "{prefix} &cNo hay kits disponibles."
    - "[sound] block.note_block.hat 0.9"
  cooldown:
    - "{prefix} &cKit &f{name} &cen espera. Espera &f{time}&c."
    - "[sound] block.note_block.hat 0.85"
  one-time-claimed:
    - "{prefix} &cYa reclamaste el kit de un solo uso &f{name}&c."
    - "[sound] entity.villager.no 0.95"
  paid-denied:
    - "{prefix} &cEl kit de pago &f{name} &crequiere reclamo propio y una economia disponible."
    - "[sound] entity.villager.no 0.9"
  cost-refused:
    - "{prefix} &cNo puedes pagar por ese kit."
    - "[sound] entity.villager.no 0.9"
  full:
    - "{prefix} &cTu inventario no tiene espacio para todos los objetos del kit &f{name}&c; no se entrego nada."
    - "[sound] item.shield.break 0.95"
  busy:
    - "{prefix} &cYa hay una operacion de kit o inventario en curso. Intentalo de nuevo en un momento."
    - "[sound] block.note_block.hat 0.85"
  failed:
    - "{prefix} &cLa entrega de kits no esta disponible ahora; no se entrego ni consumio nada."
    - "[sound] block.note_block.bass 0.7"
  invalid:
    - "{prefix} &cEl kit &f{name} &ctiene una definicion de objeto invalida: &f{reason}"
    - "[sound] block.note_block.bass 0.75"
  created:
    - "{prefix} &aKit &f{name} &acreado con &f{items} &apila(s) de objetos."
    - "[sound] block.anvil.use 1.25"
  deleted:
    - "{prefix} &aKit &f{name} &aeliminado."
    - "[sound] item.book.page_turn 0.85"
  already-exists:
    - "{prefix} &cEl kit &f{name} &cya existe. Eliminalo primero con &f/delkit {name}&c."
    - "[sound] block.note_block.bass 0.85"
  create-empty:
    - "{prefix} &cColoca al menos un objeto en tu inventario antes de usar &f/createkit&c."
    - "[sound] block.note_block.bass 0.8"
  name-invalid:
    - "{prefix} &cUsa de 1 a 32 letras minusculas, digitos, guiones bajos o guiones para el nombre del kit."
    - "[sound] block.note_block.bass 0.8"
  capture-privileged:
    - "{prefix} &cNo se puede capturar la ranura &f{slot} &c(&f{item}&c / &f{behavior}&c): capturar objetos privilegiados requiere &f{permission}&c."
    - "[sound] entity.villager.no 0.95"
  capture-unsupported:
    - "{prefix} &cNo se puede crear el kit: la ranura &f{slot} &ccontiene datos de objeto no soportados (&f{reason}&c). Quita o reemplaza el objeto para no degradar el kit."
    - "[sound] block.note_block.bass 0.75"
economy:
  balance:
    - "{prefix} &fSaldo: &a{amount}"
    - "[sound] ui.button.click 1.3"
  balance-other:
    - "{prefix} &fSaldo de &f{player}&f: &a{amount}"
    - "[sound] ui.button.click 1.3"
  pay-sent:
    - "{prefix} &aEnviaste &f{amount} &aa &f{player}&a."
    - "[sound] entity.experience_orb.pickup 0.95"
  pay-received:
    - "{prefix} &aRecibiste &f{amount} &ade &f{player}&a."
    - "[sound] entity.experience_orb.pickup 1.35"
  insufficient:
    - "{prefix} &cFondos insuficientes."
    - "[sound] block.note_block.bass 0.8"
  invalid-amount:
    - "{prefix} &cLa cantidad debe ser mayor que cero."
    - "[sound] block.note_block.bass 0.8"
chat:

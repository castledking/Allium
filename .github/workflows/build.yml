name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      - name: Install vendored Relique and AbyssalLib
        run: |
          mvn -B -q install:install-file \
            -Dfile=libs/Relique-2.1.3-mc.26.1.2-alpha.1.jar \
            -DgroupId=com.github.darksoulq \
            -DartifactId=Relique \
            -Dversion=2.1.3-mc.26.1.2-alpha.1 \
            -Dpackaging=jar
          mvn -B -q install:install-file \
            -Dfile=libs/AbyssalLib-2.4.0-mc.26.2-alpha.4.jar \
            -DgroupId=com.github.darksoulq \
            -DartifactId=AbyssalLib \
            -Dversion=2.4.0-mc.26.2-alpha.4 \
            -Dpackaging=jar

      - name: Build with Maven
        run: mvn install -DskipTests -B

      - name: Upload Allium.jar
        uses: actions/upload-artifact@v4
        with:
          name: Allium
          path: target/Allium.jar

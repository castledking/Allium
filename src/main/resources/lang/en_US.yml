# ==========================================
#     Allium Language File - English (US)
# ==========================================

prefix: "&7[&dAllium&7]"

core:
  reload-success:
    text: "{prefix} &aConfiguration reloaded."
    sound: minecraft:block.note_block.chime
    volume: 0.55
    pitch: 1.35
  reload-failed:
    text: "{prefix} &cReload failed. Check console for details."
    sound: minecraft:block.note_block.bass
    volume: 0.6
    pitch: 0.75
  version:
    text: "{prefix} &fRunning Allium &dv{version}&f."
    sound: minecraft:ui.button.click
    volume: 0.4
    pitch: 1.25
  import:
    lang-no-source:
      text: "{prefix} &cNo pre-recode lang file at &f{file}&c."
      sound: minecraft:block.note_block.bass
      volume: 0.55
      pitch: 0.8
    lang-report:
      text: "{prefix} &7{mode}: &f{write} &7to write, &f{same} &7already imported, &f{kept} &7kept (customized), &f{unmapped} &7not portable yet. Details are in the console."
      sound: minecraft:item.book.page_turn
      volume: 0.6
      pitch: 1.0
    lang-applied:
      text: "{prefix} &aImported &f{write} &amessage(s) into &f{file}&a; the old file is backed up as &f{backup}&a."
      sound: minecraft:entity.player.levelup
      volume: 0.5
      pitch: 1.35
    lang-nothing:
      text: "{prefix} &aNothing to import; &f{file} &ais up to date."
      sound: minecraft:block.note_block.hat
      volume: 0.45
      pitch: 1.15
    lang-failed:
      text: "{prefix} &cThe lang import failed: &f{reason}"
      sound: minecraft:block.note_block.bass
      volume: 0.6
      pitch: 0.75
  adopt-window:
    opened:
      text: "{prefix} &ePre-recode privileged tools are adopted on first use for the next &f{duration}&e. Every adoption is logged. Close it early with &f/allium adopt-window off&e."
      sound: minecraft:block.beacon.activate
      volume: 0.45
      pitch: 1.25
    closed:
      text: "{prefix} &aThe adoption window is closed."
      sound: minecraft:block.beacon.deactivate
      volume: 0.45
      pitch: 1.0
    status:
      text: "{prefix} &7The adoption window is &f{state}&7."
      sound: minecraft:ui.button.click
      volume: 0.4
      pitch: 1.1

error:
  no-permission:
    text: "{prefix} &cYou don't have permission to do that."
    sound: minecraft:entity.villager.no
    volume: 0.55
    pitch: 1.0
  player-only: "{prefix} &cThis command can only be used by players."
  console-only:
    text: "{prefix} &cThis command can only be used from the console."
    sound: minecraft:entity.villager.no
    volume: 0.55
    pitch: 0.95
  invalid-args:
    text: "{prefix} &cUsage: &f{usage}"
    sound: minecraft:ui.button.click
    volume: 0.4
    pitch: 0.75
  player-not-found:
    text: "{prefix} &cPlayer &f{player} &cnot found."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  number-invalid:
    text: "{prefix} &c'{input}' is not a valid number."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  world-not-found:
    text: "{prefix} &cWorld &f{world} &cnot found."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  cooldown-active:
    text: "{prefix} &cPlease wait &f{time} &cbefore using this again."
    sound: minecraft:block.note_block.hat
    volume: 0.5
    pitch: 0.85
  module-disabled:
    text: "{prefix} &cThis feature is currently disabled."
    sound: minecraft:entity.villager.no
    volume: 0.5
    pitch: 0.9

teleport:
  success:
    text: "{prefix} &aTeleported to &f{target}&a."
    sound: minecraft:entity.enderman.teleport
    volume: 0.5
    pitch: 1.15
  request-sent:
    text: "{prefix} &aTeleport request sent to &f{player}&a."
    sound: minecraft:block.note_block.pling
    volume: 0.45
    pitch: 1.35
  request-received:
    text: "{prefix} &f{player} &awants to teleport to you. &f/tpaccept &aor &f/tpdeny"
    sound: minecraft:block.note_block.bell
    volume: 0.6
    pitch: 1.25
  accepted:
    text: "{prefix} &aTeleport request accepted."
    sound: minecraft:block.note_block.pling
    volume: 0.5
    pitch: 1.5
  denied:
    text: "{prefix} &cTeleport request denied."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  cancelled:
    text: "{prefix} &cTeleport request expired."
    sound: minecraft:block.note_block.bass
    volume: 0.45
    pitch: 0.75
  back:
    text: "{prefix} &aReturned to your previous location."
    sound: minecraft:entity.enderman.teleport
    volume: 0.5
    pitch: 0.95
  no-back:
    text: "{prefix} &cNo previous location to return to."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  no-pending:
    text: "{prefix} &cYou have no pending teleport requests."
    sound: minecraft:block.note_block.bass
    volume: 0.5
    pitch: 0.85
  here-received:
    text: "{prefix} &f{player} &awants you to teleport to them. &f/tpaccept &aor &f/tpdeny"
    sound: minecraft:block.note_block.bell
    volume: 0.6
    pitch: 1.15
  request-cancelled:
    text: "{prefix} &cTeleport request cancelled."
    sound: minecraft:block.note_block.hat
    volume: 0.45
    pitch: 0.8
  warmup:
    text: "{prefix} &eTeleporting in {time}s. Stay still and avoid damage."
    sound: minecraft:block.note_block.chime
    volume: 0.45
    pitch: 1.0
  interrupted:
    text: "{prefix} &cTeleport cancelled: {reason}."
    sound: minecraft:item.shield.break
    volume: 0.45
    pitch: 1.15
  refused:
    text: "{prefix} &c{player} can't receive teleports right now."
    sound: minecraft:entity.villager.no
    volume: 0.5
    pitch: 1.0
  loading:
    text: "{prefix} &cYour teleport data is still loading. Try again shortly."
    sound: minecraft:block.note_block.hat
    volume: 0.45
    pitch: 0.9
  storage-failed:
    text: "{prefix} &cTeleport data could not be saved. Try again shortly."
    sound: minecraft:block.note_block.bass
    volume: 0.6
    pitch: 0.7
  unsafe:
    text: "{prefix} &cNo safe destination was found. Nothing was teleported."
    sound: minecraft:item.shield.break
    volume: 0.5
    pitch: 0.95
  busy:
    text: "{prefix} &cA teleport is already pending. Try again shortly."
    sound: minecraft:block.note_block.hat
    volume: 0.45
    pitch: 0.85
  self:
    text: "{prefix} &cYou can't request a teleport to yourself."
    sound: minecraft:block.note_block.bass
    volume: 0.5
    pitch: 0.8
  toggle-on:
    text: "{prefix} &a{player} now accepts teleport requests."
    sound: minecraft:block.note_block.pling
    volume: 0.45
    pitch: 1.4
  toggle-off:
    text: "{prefix} &c{player} no longer accepts teleport requests. Incoming requests cancelled."
    sound: minecraft:block.note_block.bass
    volume: 0.45
    pitch: 0.85

travel:
  loading:
    text: "{prefix} &cTravel data is loading. Try again shortly."
    sound: minecraft:block.note_block.hat
    volume: 0.45
    pitch: 0.9
  busy:
    text: "{prefix} &cTravel storage is busy. Try again shortly."
    sound: minecraft:block.note_block.hat
    volume: 0.45
    pitch: 0.85
  storage-failed:
    text: "{prefix} &cTravel data could not be saved. Try again shortly."
    sound: minecraft:block.note_block.bass
    volume: 0.6
    pitch: 0.7
  name-invalid:
    text: "{prefix} &cUse 1-32 letters, digits, underscores or hyphens for the name."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  confirm:
    text: "{prefix} &eThis name already exists. Run &f{command} &eto confirm the captured location."
    sound: minecraft:block.note_block.bell
    volume: 0.55
    pitch: 1.1
  confirm-expired:
    text: "{prefix} &cNo current overwrite confirmation. Run the set command again."
    sound: minecraft:block.note_block.bass
    volume: 0.5
    pitch: 0.75
  changed:
    text: "{prefix} &cThis destination changed. Run the command again."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  limit:
    text: "{prefix} &cYou have reached your home limit ({limit})."
    sound: minecraft:entity.villager.no
    volume: 0.55
    pitch: 0.95

home:
  set:
    text: "{prefix} &aHome &f{name} &aset."
    sound: minecraft:block.note_block.chime
    volume: 0.55
    pitch: 1.3
  deleted:
    text: "{prefix} &aHome &f{name} &adeleted."
    sound: minecraft:item.book.page_turn
    volume: 0.55
    pitch: 0.9
  not-found:
    text: "{prefix} &cHome &f{name} &cnot found."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  limit-reached:
    text: "{prefix} &cYou have reached your home limit (&f{limit}&c)."
    sound: minecraft:entity.villager.no
    volume: 0.55
    pitch: 0.95
  list:
    text: "{prefix} &fHomes: &d{homes}"
    sound: minecraft:item.book.page_turn
    volume: 0.55
    pitch: 1.1
  none:
    text: "{prefix} &cYou have no homes set."
    sound: minecraft:block.note_block.hat
    volume: 0.4
    pitch: 0.9

warp:
  set:
    text: "{prefix} &aWarp &f{name} &aset."
    sound: minecraft:block.enchantment_table.use
    volume: 0.5
    pitch: 1.25
  deleted:
    text: "{prefix} &aWarp &f{name} &adeleted."
    sound: minecraft:item.book.page_turn
    volume: 0.55
    pitch: 0.9
  not-found:
    text: "{prefix} &cWarp &f{name} &cnot found."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  list:
    text: "{prefix} &fWarps: &d{warps}"
    sound: minecraft:item.book.page_turn
    volume: 0.55
    pitch: 1.1
  none:
    text: "{prefix} &cNo warps available."
    sound: minecraft:block.note_block.hat
    volume: 0.4
    pitch: 0.9

spawn:
  set:
    text: "{prefix} &aSpawn point set."
    sound: minecraft:block.beacon.activate
    volume: 0.5
    pitch: 1.2
  teleport:
    text: "{prefix} &aTeleported to spawn."
    sound: minecraft:entity.enderman.teleport
    volume: 0.5
    pitch: 1.25
  not-set:
    text: "{prefix} &cSpawn has not been set."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8

kit:
  received:
    text: "{prefix} &aReceived kit &f{name}&a."
    sound: minecraft:entity.player.levelup
    volume: 0.5
    pitch: 1.4
  given:
    text: "{prefix} &aGave kit &f{name} &ato &f{player}&a."
    sound: minecraft:entity.item.pickup
    volume: 0.55
    pitch: 1.2
  not-found:
    text: "{prefix} &cKit &f{name} &cnot found."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  no-permission:
    text: "{prefix} &cYou don't have permission to claim kit &f{name}&c."
    sound: minecraft:entity.villager.no
    volume: 0.55
    pitch: 1.0
  list:
    text: "{prefix} &fKits: &d{kits}"
    sound: minecraft:item.book.page_turn
    volume: 0.55
    pitch: 1.1
  none:
    text: "{prefix} &cNo kits available."
    sound: minecraft:block.note_block.hat
    volume: 0.4
    pitch: 0.9
  cooldown:
    text: "{prefix} &cKit &f{name} &con cooldown. Wait &f{time}&c."
    sound: minecraft:block.note_block.hat
    volume: 0.5
    pitch: 0.85
  one-time-claimed:
    text: "{prefix} &cYou have already claimed one-time kit &f{name}&c."
    sound: minecraft:entity.villager.no
    volume: 0.55
    pitch: 0.95
  paid-denied:
    text: "{prefix} &cKit &f{name} &chas a cost and paid kits are disabled until economy reservations exist."
    sound: minecraft:entity.villager.no
    volume: 0.55
    pitch: 0.9
  cost-refused:
    text: "{prefix} &cYou cannot pay for that kit."
    sound: minecraft:entity.villager.no
    volume: 0.55
    pitch: 0.9
  full:
    text: "{prefix} &cYour inventory cannot hold all items from kit &f{name}&c; nothing was given."
    sound: minecraft:item.shield.break
    volume: 0.45
    pitch: 0.95
  busy:
    text: "{prefix} &cA kit or inventory operation is already in progress. Try again shortly."
    sound: minecraft:block.note_block.hat
    volume: 0.45
    pitch: 0.85
  failed:
    text: "{prefix} &cKit delivery is unavailable right now; nothing was given or consumed."
    sound: minecraft:block.note_block.bass
    volume: 0.6
    pitch: 0.7
  invalid:
    text: "{prefix} &cKit &f{name} &chas an invalid item definition: &f{reason}"
    sound: minecraft:block.note_block.bass
    volume: 0.6
    pitch: 0.75
  created:
    text: "{prefix} &aCreated kit &f{name} &awith &f{items} &aitem stack(s)."
    sound: minecraft:block.anvil.use
    volume: 0.5
    pitch: 1.25
  deleted:
    text: "{prefix} &aDeleted kit &f{name}&a."
    sound: minecraft:item.book.page_turn
    volume: 0.55
    pitch: 0.85
  already-exists:
    text: "{prefix} &cKit &f{name} &calready exists. Delete it first with &f/delkit {name}&c."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.85
  create-empty:
    text: "{prefix} &cPut at least one item in your storage inventory before running &f/createkit&c."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  name-invalid:
    text: "{prefix} &cUse 1-32 lowercase letters, digits, underscores or hyphens for the kit name."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  capture-privileged:
    text: "{prefix} &cCannot capture slot &f{slot} &c(&f{item}&c / &f{behavior}&c): capturing privileged items requires &f{permission}&c."
    sound: minecraft:entity.villager.no
    volume: 0.55
    pitch: 0.95
  capture-unsupported:
    text: "{prefix} &cCannot create kit: slot &f{slot} &ccontains unsupported item data (&f{reason}&c). Remove or replace the item so the kit is not degraded."
    sound: minecraft:block.note_block.bass
    volume: 0.6
    pitch: 0.75

economy:
  balance:
    text: "{prefix} &fBalance: &a{amount}"
    sound: minecraft:ui.button.click
    volume: 0.4
    pitch: 1.3
  balance-other:
    text: "{prefix} &f{player}&f's balance: &a{amount}"
    sound: minecraft:ui.button.click
    volume: 0.4
    pitch: 1.3
  pay-sent:
    text: "{prefix} &aSent &f{amount} &ato &f{player}&a."
    sound: minecraft:entity.experience_orb.pickup
    volume: 0.5
    pitch: 0.95
  pay-received:
    text: "{prefix} &aReceived &f{amount} &afrom &f{player}&a."
    sound: minecraft:entity.experience_orb.pickup
    volume: 0.6
    pitch: 1.35
  insufficient:
    text: "{prefix} &cInsufficient funds."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  invalid-amount:
    text: "{prefix} &cAmount must be greater than zero."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8

chat:
  msg-format: "&7[&f{sender} &7-> &f{receiver}&7] &f{message}"
  no-reply:
    text: "{prefix} &cNo one to reply to."
    sound: minecraft:block.note_block.bass
    volume: 0.5
    pitch: 0.85
  socialspy-toggle:
    text: "{prefix} &fSocialSpy {state}&f."
    sound: minecraft:ui.button.click
    volume: 0.4
    pitch: 1.15
  broadcast:
    text: "&4[Broadcast] &c{message}"
    sound: minecraft:block.note_block.bell
    volume: 0.55
    pitch: 1.05

moderation:
  discipline:
    usage:
      text: "{prefix} &cUsage: {usage}"
      sound: minecraft:ui.button.click
      volume: 0.4
      pitch: 0.75
    unavailable:
      text: "{prefix} &cModeration data is unavailable. Try again shortly."
      sound: minecraft:block.note_block.bass
      volume: 0.6
      pitch: 0.7
    busy:
      text: "{prefix} &cA moderation action is already pending or rate limited. Try again shortly."
      sound: minecraft:block.note_block.hat
      volume: 0.45
      pitch: 0.85
    exempt:
      text: "{prefix} &cYou cannot act on this player under the moderation hierarchy."
      sound: minecraft:entity.villager.no
      volume: 0.55
      pitch: 0.9
    success:
      text: "{prefix} &a{action}: {player}."
      sound: minecraft:block.note_block.pling
      volume: 0.5
      pitch: 1.25
    not-active:
      text: "{prefix} &cNo matching active record for {player}."
      sound: minecraft:block.note_block.bass
      volume: 0.5
      pitch: 0.85
    ip-disabled:
      text: "{prefix} &cIP bans are disabled in configuration."
      sound: minecraft:entity.villager.no
      volume: 0.5
      pitch: 0.9
    jail-not-found:
      text: "{prefix} &cJail {jail} was not found."
      sound: minecraft:block.note_block.bass
      volume: 0.55
      pitch: 0.8
    unsafe-location:
      text: "{prefix} &cThe jail or return location is unavailable or unsafe."
      sound: minecraft:item.shield.break
      volume: 0.5
      pitch: 0.95
    ban-denied: "You are banned: {message}"
    login-unavailable: "Moderation data is unavailable. Please try again shortly."
    kick-notice: "You were kicked: {message}"
    warning-notice:
      text: "{prefix} &eWarning: {message}"
      sound: minecraft:block.note_block.bell
      volume: 0.6
      pitch: 0.9
    list-header:
      text: "{prefix} &fModeration records ({count}):"
      sound: minecraft:item.book.page_turn
      volume: 0.55
      pitch: 1.0
    list-entry: "&7- {player} by {actor}: {message}"
    list-empty:
      text: "{prefix} &7No moderation records found."
      sound: minecraft:block.note_block.hat
      volume: 0.4
      pitch: 0.95
  inspect:
    self:
      text: "{prefix} &cYou cannot use /invsee on yourself."
      sound: minecraft:block.note_block.bass
      volume: 0.5
      pitch: 0.8
    busy:
      text: "{prefix} &cThat inventory is busy right now. Try again shortly."
      sound: minecraft:block.note_block.hat
      volume: 0.45
      pitch: 0.85
    offline-required:
      text: "{prefix} &cOffline inspection requires &f{permission}&c."
      sound: minecraft:entity.villager.no
      volume: 0.55
      pitch: 0.95
    offline-unavailable:
      text: "{prefix} &cOffline data for &f{player} &cis unavailable right now."
      sound: minecraft:block.note_block.bass
      volume: 0.55
      pitch: 0.75
    offline-corrupt:
      text: "{prefix} &cOffline data for &f{player} &ccould not be read safely; nothing was modified."
      sound: minecraft:item.shield.break
      volume: 0.55
      pitch: 0.85
    offline-newer-version:
      text: "{prefix} &cOffline data for &f{player} &cwas saved by a newer Minecraft version; nothing was modified."
      sound: minecraft:item.shield.break
      volume: 0.55
      pitch: 0.9
    offline-version-rewrite:
      text: "{prefix} &cOffline data for &f{player} &cuses a different Minecraft DataVersion; offline editing is refused so nothing is rewritten."
      sound: minecraft:item.shield.break
      volume: 0.55
      pitch: 0.9
    offline-hold:
      text: "{prefix} &cOffline editing for &f{player} &cis refused while a pending workflow hold exists."
      sound: minecraft:entity.villager.no
      volume: 0.55
      pitch: 0.9
    offline-edit-disabled:
      text: "{prefix} &cOffline playerdata editing is disabled due to a codec self-test failure."
      sound: minecraft:block.anvil.break
      volume: 0.45
      pitch: 0.9
    conflict:
      text: "{prefix} &cOffline data for &f{player} &cchanged externally; inspection closed without saving."
      sound: minecraft:item.shield.break
      volume: 0.55
      pitch: 0.95
    target-online:
      text: "{prefix} &e{player} &ejoined the server; offline inspection closed."
      sound: minecraft:block.chest.close
      volume: 0.5
      pitch: 1.15
    target-offline:
      text: "{prefix} &e{player} &ewent offline; live inspection closed."
      sound: minecraft:block.chest.close
      volume: 0.5
      pitch: 0.9
    target-died:
      text: "{prefix} &e{player} &edied; live inventory inspection closed."
      sound: minecraft:block.chest.close
      volume: 0.5
      pitch: 0.8
    unavailable:
      text: "{prefix} &cInspection is unavailable right now. Try again shortly."
      sound: minecraft:block.note_block.bass
      volume: 0.55
      pitch: 0.75
  ban:
    text: "{prefix} &f{player} &chas been banned. Reason: &f{reason}"
    sound: minecraft:block.anvil.use
    volume: 0.55
    pitch: 0.85
  tempban:
    text: "{prefix} &f{player} &cbanned for &f{duration}&c. Reason: &f{reason}"
    sound: minecraft:block.anvil.use
    volume: 0.55
    pitch: 0.95
  kick:

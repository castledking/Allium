      allium.banlist: true
      allium.ipban: true
      allium.freeze: true
      allium.setjail: true
      allium.jail: true
      allium.unjail: true
      allium.warn: true
      allium.notes: true
      allium.invsee: true
      allium.enderchest: true
      allium.enderchest.others: true

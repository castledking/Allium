name: Allium
version: '${version}'
main: codes.castled.allium.PluginStart
api-version: '1.20'
description: A modern essentials suite
authors: [castledking]
softdepend: [Vault, PlaceholderAPI, Nexo, CraftEngine, Oraxen, ResourcePackManager, DiscordSRV, packetevents, InteractiveChat, GriefPrevention, GriefPrevention3D]

commands:
  nick:
    description: Change a persistent nickname
    aliases: [nickname]
    permission: allium.nick
  channel:
    description: Chat channel selection and messages
    aliases: [g, global, l, local, a, staffchat]
    permission: allium.channel
  delmsg:
    description: Delete a retained logical chat message
    aliases: [deletemsg]
  repair:
    description: Self-service or inventory-wide repair
    usage: /<command> [hand|all]
    permission: allium.repair
  disposal:
    description: Self-service disposal
    usage: /<command>
    aliases: [trash, dispose]
    permission: allium.disposal
  workbench:
    description: Self-service workbench
    usage: /<command>
    aliases: [craft]
    permission: allium.workbench
  anvil:
    description: Self-service anvil
    usage: /<command>
    permission: allium.anvil
  info:
    description: Self-service info
    usage: /<command>
    permission: allium.info
  speed:
    description: Change walk or fly speed
    usage: /<command> [walk|fly] <0..10|reset> [player]
    permission: allium.speed
  ping:
    description: Check ping
    usage: /<command> [player]
    permission: allium.ping
  ext:
    description: Extinguish fire on a player
    usage: /<command> [player]
    aliases: [extinguish]
    permission: allium.ext
  burn:
    description: Set a player on fire
    usage: /<command> <player> [seconds]
    permission: allium.burn
  smite:
    description: Strike a player with visual lightning
    usage: /<command> <player>
    aliases: [lightning, strike]
    permission: allium.smite
  nv:
    description: Toggle night vision
    usage: /<command> [on|off] [player]
    aliases: [nightvision]
    permission: allium.nv
  clearinventory:
    description: Clear inventory items
    usage: /<command> [player] [material] [maxCount]
    aliases: [clear, ci]
    permission: allium.clearinventory
  more:
    description: Refill held item stack
    usage: /<command> [amount] [player]
    permission: allium.more
  hat:
    description: Wear the held item on your head
    usage: /<command>
    permission: allium.hat
  skull:
    description: Give a player skull
    usage: /<command> [owner] [player]
    aliases: [head, playerhead]
    permission: allium.skull
  itemdb:
    description: Inspect held item metadata
    usage: /<command> [player]
    aliases: [iteminfo]
    permission: allium.itemdb
  gc:
    description: Show runtime memory, disk, TPS, and world counts
    usage: /<command>
    aliases: [uptime, lag, tps]
    permission: allium.gc
  time:
    description: View, set, add, or pause world time
    usage: /<command> [set|add|pause] [value] [world|*]
    permission: allium.time
  day:
    description: Set world time to day
    usage: /<command> [world|*]
    permission: allium.time.set
  night:
    description: Set world time to night
    usage: /<command> [world|*]
    permission: allium.time.set
  weather:
    description: Change world weather
    usage: /<command> <clear|sun|rain|storm|thunder> [duration] [world|*]
    permission: allium.weather
  enchant:
    description: Apply or remove enchantments
    usage: /<command> <enchantment> <level> [player]
    permission: allium.enchant
  heal:
    description: Heal yourself or another player
    usage: /<command> [player]
    permission: allium.heal
  feed:
    description: Feed yourself or another player
    usage: /<command> [player]
    permission: allium.feed
  fly:
    description: Toggle flight mode
    usage: /<command> [player]
    permission: allium.fly
  god:
    description: Toggle god mode
    usage: /<command> [player]
    permission: allium.god
  gamemode:
    description: Change your gamemode
    usage: /<command> <mode> [player]
    aliases: [gm, gmc, gma, gms, gmsp, creative, survival, spectator, adventure]
    permission: allium.gamemode
  msg:
    description: Send a private message
    usage: /<command> <player> <message>
    aliases: [tell, w, whisper, m, t]
    permission: allium.msg
  reply:
    description: Reply to your last private message
    usage: /<command> <message>
    aliases: [r]
    permission: allium.reply
  ignore:
    description: Ignore a player's private messages, or list who you ignore
    usage: /<command> [player]
    permission: allium.ignore
  unignore:
    description: Stop ignoring a player
    usage: /<command> <player>
    permission: allium.ignore
  msgtoggle:
    description: Turn receiving private messages on or off
    usage: /<command> [on|off] [player]
    permission: allium.msgtoggle
  mail:
    description: Send and read mail, and gifts of items
    usage: /<command> <read|send|gift|claim|delete|clear>
    permission: allium.mail
  socialspy:
    description: Observe delivered private messages between other players
    usage: /<command> [on|off]
    permission: allium.socialspy
  messagesounds:
    description: Your private-message sound volume
    usage: /<command> [volume <0-1>|toggle|reset]
    aliases: [msounds, mfx]
    permission: allium.messagesounds
  allium:
    description: Allium administration
    usage: /<command> <reload|version|import lang [apply]|adopt-window [<duration>|off]>
  give:
    description: Give items (M1 item-library harness)
    usage: /<command> <player> <item[,item...]> [amount] [key:value...] [-e] [--overflow=drop|refuse|partial]
    permission: allium.give

  tpa:
    description: Allium safe teleport command
    permission: allium.tpa
  tpahere:
    description: Allium safe teleport command
    permission: allium.tpahere
  tpaccept:
    description: Allium safe teleport command
    permission: allium.tpaccept
  tpdeny:
    description: Allium safe teleport command
    permission: allium.tpdeny
  tpacancel:
    description: Allium safe teleport command
    permission: allium.tpacancel
  tptoggle:
    description: Allium safe teleport command
    permission: allium.tptoggle
  back:
    description: Allium safe teleport command
    permission: allium.back
  spawn:
    description: Allium safe teleport command
    permission: allium.spawn
  setspawn:
    description: Allium safe teleport command
    permission: allium.setspawn
  tp:
    description: Allium safe teleport command
    permission: allium.tp
  tphere:
    description: Allium safe teleport command
    permission: allium.tphere

  sethome:
    description: Allium sethome
    usage: /sethome

  home:
    description: Allium home
    usage: /home

  delhome:
    description: Allium delhome
    usage: /delhome

  homes:
    description: Allium homes
    usage: /homes

  setwarp:
    description: Allium setwarp
    usage: /setwarp

  warp:
    description: Allium warp
    usage: /warp

  delwarp:
    description: Allium delwarp
    usage: /delwarp

  warps:
    description: Allium warps
    usage: /warps

  kit:
    description: Claim a kit or list available kits
    usage: /<command> [name] [player]
    permission: allium.kit
  kits:
    description: List available kits
    usage: /<command>
    permission: allium.kits
  createkit:
    description: Create a kit from your inventory
    usage: /<command> <name> [cooldown] [once]
    permission: allium.createkit
  delkit:
    description: Delete a kit definition
    usage: /<command> <name>
    permission: allium.delkit

  vanish:
    description: Toggle vanish mode for yourself or another player
    usage: /<command> [on|off] [player]
    aliases: [v]
    permission: allium.vanish
  mute:
    description: Mute a player with an optional duration and reason
    usage: /<command> <player> [duration] [reason]
    permission: allium.mute
  unmute:
    description: Unmute a muted player
    usage: /<command> <player> [reason]
    permission: allium.unmute
  mutes:
    description: List currently active mutes
    usage: /<command>
    aliases: [mutelist]
    permission: allium.mute

  i:
    description: Give items to yourself
    usage: /<command> <item[,item...]> [amount] [key:value...] [-e] [--overflow=drop|refuse|partial]
    aliases: [item]
    permission: allium.give
  list:
    description: List online players
    usage: /<command>
    aliases: [online]
    permission: allium.list
  seen:
    description: Show when a player was last seen and first joined
    usage: /<command> <player>
    permission: allium.seen
  whois:
    description: Inspect player UUID, name history, and staff-only location
    usage: /<command> <player>
    permission: allium.whois
  near:
    description: List nearby visible players
    usage: /<command> [radius]
    permission: allium.near
  afk:
    description: Toggle AFK status with an optional message
    usage: /<command> [message]
    aliases: [away]
    permission: allium.afk

  kick:
    description: Allium audited kick
    usage: /<command> <player> [reason]
    permission: allium.kick

  ban:
    description: Allium audited ban
    usage: /<command> <player> [reason]
    permission: allium.ban

  tempban:
    description: Allium audited tempban
    usage: /<command> <player> <duration> [reason]
    permission: allium.tempban

  unban:
    description: Allium audited unban
    usage: /<command> <player>
    permission: allium.unban
    aliases: [pardon]

  banlist:
    description: Allium audited banlist
    usage: /<command>
    permission: allium.banlist

  ipban:
    description: Allium audited ipban
    usage: /<command> <player> [reason]
    permission: allium.ipban

  freeze:
    description: Allium audited freeze
    usage: /<command> <player> [on|off] [reason]
    permission: allium.freeze

  setjail:
    description: Allium audited setjail
    usage: /<command> <name>
    permission: allium.setjail

  jail:
    description: Allium audited jail
    usage: /<command> <player> <jail> [reason]
    permission: allium.jail

  unjail:
    description: Allium audited unjail
    usage: /<command> <player>
    permission: allium.unjail

  warn:
    description: Allium audited warn
    usage: /<command> <player> [reason]
    permission: allium.warn

  notes:
    description: Allium audited notes
    usage: /<command> <player> [add <note>]
    permission: allium.notes

  invsee:
    description: Inspect (and optionally edit) another player's inventory
    usage: /<command> <player>
    permission: allium.invsee

  enderchest:
    description: Open your own or inspect another player's ender chest
    usage: /<command> [player]
    aliases: [echest, ec]
    permission: allium.enderchest

  balance:
    description: Read an economy balance
    aliases: [bal]
    permission: allium.balance
  pay:
    description: Transfer exact money
    permission: allium.pay
  paytoggle:
    description: Toggle accepting payments
    permission: allium.paytoggle
  eco:
    description: Administer economy accounts
    permission: allium.eco
  baltop:
    description: Show ten largest account balances
    permission: allium.baltop

permissions:
  allium.*:
    description: All Allium permissions
    default: op
    children:
      allium.heal: true
      allium.heal.others: true
      allium.feed: true
      allium.feed.others: true
      allium.fly: true

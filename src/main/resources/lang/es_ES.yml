    unavailable:
      - "{prefix} &cLos datos de moderacion no estan disponibles. Intentalo de nuevo en un momento."
      - "[sound] block.note_block.bass 0.7"
    busy:
      - "{prefix} &cYa hay una accion de moderacion pendiente o limitada por frecuencia. Intentalo de nuevo en un momento."
      - "[sound] block.note_block.hat 0.85"
    exempt:
      - "{prefix} &cNo puedes actuar sobre este jugador segun la jerarquia de moderacion."
      - "[sound] entity.villager.no 0.9"
    success:
      - "{prefix} &a{action}: {player}."
      - "[sound] block.note_block.pling 1.25"
    not-active:
      - "{prefix} &cNo hay ningun registro activo coincidente para {player}."
      - "[sound] block.note_block.bass 0.85"
    ip-disabled:
      - "{prefix} &cLos baneos de IP estan desactivados en la configuracion."

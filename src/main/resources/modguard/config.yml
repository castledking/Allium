# ModGuard - Client Mod Detection
# Runtime path: plugins/Allium/modguard/config.yml
#
# Two independent detection layers:
#  1. banned-mods / allowed-mods : mod ids + brand strings revealed by the client
#     over plugin channels (minecraft:brand, FML handshake). Catches Fabric/Forge
#     mods that announce themselves (baritone, meteor-client, liquidbounce, wurst,
#     autism-client, IPN, ...).
#  2. translation-probe : ghost-sign translation/keybind probing (MC-265322).
#     Catches clients that do NOT announce themselves (Wurst, Freecam, KillAura,
#     XRay, ChestESP, LiquidBounce, BleachHack, Aristois, Coffee, ...) by the
#     translation keys and keybinds they register.

# Enable mod detection
enabled: true

# Detection mode: 'blacklist' (ban specific mods) or 'whitelist' (allow only specific mods)
mode: blacklist

# Check the client's brand and plugin channels for unwanted mods
check-brand: true
check-channels: true
check-fml-handshake: true

# Check for mods when player joins (delayed by check-delay-ticks)
check-on-join: true

# Kick players when banned mods are detected
kick-on-detection: true

# Delay after join before checking (ticks). Allows all mod channels to register.
check-delay-ticks: 40

# --- Layer 1: banned mod ids / brands ------------------------------------
# Matched case-insensitively (substring or exact, see regex-matching) against the
# mod ids / names a client reports. Covers every client in hackops plus the
# Fabric/Forge mods in the CheckHacks detection list.
banned-mods:

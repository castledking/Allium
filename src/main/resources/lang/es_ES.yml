# Allium language: text lines plus optional "[sound] id [pitch] [volume]".
# Volume omitted below: use the configured server default.

prefix: "&7[&dAllium&7]"
core:
  reload-success:
    - "{prefix} &aConfiguracion recargada."
    - "[sound] block.note_block.chime 1.35"
  reload-failed:
    - "{prefix} &cFallo al recargar. Revisa la consola."
    - "[sound] block.note_block.bass 0.75"
  version:
    - "{prefix} &fEjecutando Allium &dv{version}&f."
    - "[sound] ui.button.click 1.25"
  modguard:
    reloaded:
      - "{prefix} &aConfiguracion de ModGuard recargada."
      - "[sound] block.note_block.chime 1.35"
    reload-failed:
      - "{prefix} &cFallo al recargar ModGuard. Revisa la consola."
      - "[sound] block.note_block.bass 0.75"
    alerts-on:
      - "{prefix} &aAlertas de ModGuard activadas."
      - "[sound] block.note_block.chime 1.2"
    alerts-off:
      - "{prefix} &cAlertas de ModGuard silenciadas."
      - "[sound] block.note_block.bass 0.9"
  addon:
    unknown:
      - "{prefix} &cAddon desconocido '&f{addon}&c'. Usa &f/allium addon list&c."
      - "[sound] block.note_block.bass 0.8"
    list-header:
      - "{prefix} &dAddons de Allium &7(plugins/Allium/addons/):"
    list-entry:
      - " &8- &f{addon} &8(&7{key}&8): {status} &8- &7{description}"
    already-installed:
      - "{prefix} &e{addon} &7ya esta instalado (&f{file}&7)."
      - "[sound] block.note_block.bass 0.9"
    already-installed-disabled:
      - "{prefix} &e{addon} &7ya esta instalado en &faddons/&7 pero desactivado. Usa &f/allium addon enable {key} &7y reinicia el servidor."
      - "[sound] block.note_block.bass 0.9"
    download-in-progress:
      - "{prefix} &e{addon} &7ya se esta descargando."
    download-started:
      - "{prefix} &7Descargando &f{addon} &7(v{version}) desde GitHub Releases..."
    download-complete:
      - "{prefix} &aSe descargo &f{addon} &7(&f{file}&7) y se activo &faddons.enabled.{key}: true &aen config.yml. &eReinicia el servidor para cargarlo."
      - "[sound] block.note_block.chime 1.35"
    download-failed:
      - "{prefix} &cError al descargar &f{addon}&c: &f{reason}"
      - "[sound] block.note_block.bass 0.75"
    already-enabled:
      - "{prefix} &e{addon} &7ya esta activado en config.yml."
    already-disabled:
      - "{prefix} &e{addon} &7ya esta desactivado en config.yml."
    enabled-restart:
      - "{prefix} &aActivado &f{addon} &7(&faddons.enabled.{key}: true&7). &eReinicia el servidor para iniciarlo."
      - "[sound] block.note_block.chime 1.25"
    enabled-not-installed:
      - "{prefix} &aActivado &f{addon} &7en config.yml, pero su jar aun no esta en &faddons/&7. Usa &f/allium addon download {key} &7o activa &faddons.auto-download &7y reinicia."
      - "[sound] block.note_block.chime 1.1"
    disabled-restart:
      - "{prefix} &cDesactivado &f{addon} &7(&faddons.enabled.{key}: false&7). Su jar permanece en &faddons/&7; &ereinicia el servidor para aplicar el cambio."
      - "[sound] block.note_block.bass 0.9"
    config-save-failed:
      - "{prefix} &cNo se pudo guardar config.yml al actualizar &f{addon}&c. Revisa la consola."
      - "[sound] block.note_block.bass 0.75"
  import:
    lang-no-source:
      - "{prefix} &cNo hay un archivo de idioma anterior en &f{file}&c."
      - "[sound] block.note_block.bass 0.8"
    lang-report:
      - "{prefix} &7{mode}: &f{write} &7por escribir, &f{same} &7ya importados, &f{kept} &7conservados (personalizados), &f{unmapped} &7aun no portables. Los detalles estan en la consola."
      - "[sound] item.book.page_turn 1.0"
    lang-applied:
      - "{prefix} &aImportados &f{write} &amensaje(s) en &f{file}&a; el archivo anterior se guardo como &f{backup}&a."
      - "[sound] entity.player.levelup 1.35"
    lang-nothing:
      - "{prefix} &aNada que importar; &f{file} &aesta al dia."
      - "[sound] block.note_block.hat 1.15"
    lang-failed:
      - "{prefix} &cLa importacion del idioma fallo: &f{reason}"
      - "[sound] block.note_block.bass 0.75"
    vouchers-no-source:
      - "{prefix} &cNo hay archivo de vales antiguo en &f{file}&c."
      - "[sound] block.note_block.bass 0.8"
    vouchers-report:
      - "{prefix} &7{mode}: &f{write} &7herramienta(s) por escribir, &f{same} &7ya importadas, &f{kept} &7conservadas (otra herramienta tiene el nombre), &f{blocked} &7bloqueadas. Detalles en la consola."
      - "[sound] item.book.page_turn 1.0"
    vouchers-applied:
      - "{prefix} &aSe escribieron &f{write} &aherramienta(s) en &ftools/ &ay se cargaron; da una con &f/pt give <player> <tool>&a."
      - "[sound] entity.player.levelup 1.35"
    vouchers-nothing:
      - "{prefix} &aNada que importar; cada vale ya tiene su herramienta."
      - "[sound] block.note_block.hat 1.15"
    vouchers-failed:
      - "{prefix} &cLa importacion de vales fallo: &f{reason}"
      - "[sound] block.note_block.bass 0.75"
    legacy-started:
      - "{prefix} &7Leyendo la base de datos antigua de Allium para {mode}..."
      - "[sound] block.note_block.hat 1.15"
    legacy-dry-run:
      - "{prefix} &aPrueba &f{run}&a. Hogares: &f{homes}&a. Warps: &f{warps}&a. Posiciones de salida: &f{logouts}&a. Revisa &f{summary}&a y luego usa &f/allium import legacy apply {run}&a."
      - "[sound] item.book.page_turn 1.0"
    legacy-applied:
      - "{prefix} &aImportado &f{run}&a. Hogares: &f{homes}&a. Warps: &f{warps}&a. Posiciones de salida: &f{logouts}&a. Los detalles estan en &f{summary}&a."
      - "[sound] entity.player.levelup 1.35"
    legacy-refused:
      - "{prefix} &cImportacion rechazada: &f{reason}"
      - "[sound] block.note_block.bass 0.8"
    legacy-failed:
      - "{prefix} &cLa importacion antigua fallo: &f{reason}"
      - "[sound] block.note_block.bass 0.75"
    legacy-fence:
      - "&cEl servidor esta importando datos antiguos. Intentalo en un minuto."
    essentials-started:
      - "{prefix} &7Leyendo datos de Essentials para {mode}..."
    essentials-dry-run:
      - "{prefix} &aSimulacion de Essentials &f{run}&a: &f{import} &apor importar, &f{present} &apresentes, &f{conflicts} &aconflictos, &f{blocked} &abloqueados. Revisa &f{summary}&a y ejecuta &f/allium import essentials apply {run}&a."
      - "[sound] item.book.page_turn 1.0"
    essentials-applied:
      - "{prefix} &aImportacion de Essentials &f{run} &aaplicada: &f{applied} &aaplicados, &f{adopted} &aadoptados, &f{conflicts} &aconflictos. Detalles: &f{summary}&a."
      - "[sound] entity.player.levelup 1.35"
    essentials-refused:
      - "{prefix} &cImportacion de Essentials rechazada: &f{reason}"
      - "[sound] block.note_block.bass 0.8"
    essentials-failed:
      - "{prefix} &cFallo la importacion de Essentials: &f{reason}"
      - "[sound] block.note_block.bass 0.75"
  adopt-window:
    opened:
      - "{prefix} &eLas herramientas privilegiadas anteriores al recode se adoptan al primer uso durante los proximos &f{duration}&e. Cada adopcion queda registrada. Cierralo antes con &f/allium adopt-window off&e."
      - "[sound] block.beacon.activate 1.25"
    closed:
      - "{prefix} &aLa ventana de adopcion esta cerrada."
      - "[sound] block.beacon.deactivate 1.0"
    status:
      - "{prefix} &7La ventana de adopcion esta &f{state}&7."
      - "[sound] ui.button.click 1.1"
error:
  no-permission:
    - "{prefix} &cNo tienes permiso para hacer eso."
    - "[sound] entity.villager.no 1.0"
  player-only:
    - "{prefix} &cEste comando solo puede ser usado por jugadores."
  console-only:
    - "{prefix} &cEste comando solo puede ser usado desde la consola."
    - "[sound] entity.villager.no 0.95"
  invalid-args:
    - "{prefix} &cUso: &f{usage}"
    - "[sound] ui.button.click 0.75"
  player-not-found:
    - "{prefix} &cJugador &f{player} &cno encontrado."
    - "[sound] block.note_block.bass 0.8"
  number-invalid:
    - "{prefix} &c'{input}' no es un numero valido."
    - "[sound] block.note_block.bass 0.8"
  world-not-found:
    - "{prefix} &cMundo &f{world} &cno encontrado."
    - "[sound] block.note_block.bass 0.8"
  cooldown-active:
    - "{prefix} &cEspera &f{time} &cantes de usar esto de nuevo."
    - "[sound] block.note_block.hat 0.85"
  module-disabled:
    - "{prefix} &cEsta funcion esta desactivada."
    - "[sound] entity.villager.no 0.9"
teleport:
  selection:
    - "{prefix} &e{message}"
  offline-success:
    - "{prefix} &aTeletransportado a la última ubicación guardada de &f{target}&a."
    - "[sound] entity.enderman.teleport 1.2"
  offline-unavailable:
    - "{prefix} &cNo hay una ubicación guardada disponible para ese jugador."
    - "[sound] block.note_block.bass 0.8"
  ungenerated:
    - "{prefix} &cEse destino esta en un terreno que este mundo nunca genero."
    - "[sound] block.note_block.bass 0.8"
  success:
    - "{prefix} &aTeletransportado a &f{target}&a."
    - "[sound] entity.enderman.teleport 1.15"
  position-success:
    - "{prefix} &aTeletransportado a &f{x}, {y}, {z}&a en &f{world}&a."
    - "[sound] entity.enderman.teleport 1.15"
  request-sent:
    - "{prefix} &aSolicitud de teletransporte enviada a &f{player}&a."
    - "[sound] block.note_block.pling 1.35"
  request-received:
    - "{prefix} &f{player} &aquiere teletransportarse a ti. &f/tpaccept &ao &f/tpdeny"
    - "[sound] block.note_block.bell 1.25"
  accepted:
    - "{prefix} &aSolicitud de teletransporte aceptada."
    - "[sound] block.note_block.pling 1.5"
  denied:
    - "{prefix} &cSolicitud de teletransporte denegada."
    - "[sound] block.note_block.bass 0.8"
  cancelled:
    - "{prefix} &cSolicitud de teletransporte expirada."
    - "[sound] block.note_block.bass 0.75"
  back:
    - "{prefix} &aRegresaste a tu ubicacion anterior."
    - "[sound] entity.enderman.teleport 0.95"
  back-death:
    - "{prefix} &aRegresaste a tu ubicacion de muerte."
    - "[sound] entity.enderman.teleport 0.95"
  back-on-death:
    - "{prefix} &eUsa &f/back &epara regresar a tu ubicacion de muerte."
    - "[sound] block.note_block.bell 1.0"
  no-back:
    - "{prefix} &cNo hay ubicacion anterior."
    - "[sound] block.note_block.bass 0.8"
  no-pending:
    - "{prefix} &cNo tienes solicitudes pendientes."
    - "[sound] block.note_block.bass 0.85"
  here-received:
    - "{prefix} &f{player} &aquiere que te teletransportes hacia el. &f/tpaccept &ao &f/tpdeny"
    - "[sound] block.note_block.bell 1.15"
  request-cancelled:
    - "{prefix} &cSolicitud de teletransporte cancelada."
    - "[sound] block.note_block.hat 0.8"
  warmup:
    - "[actionbar] &eTeletransportando en &f{warmup}s&e. Quedate quieto y evita dano."
    - "[sound] block.note_block.chime 1.0"
  interrupted:
    - "{prefix} &cTeletransporte cancelado: {reason}."
    - "[sound] item.shield.break 1.15"
  refused:
    - "{prefix} &c{player} no puede recibir teletransportes ahora mismo."
    - "[sound] entity.villager.no 1.0"
  world-denied:
    - "{prefix} &cNo tienes permiso para entrar al mundo &f{world}&c."
    - "[sound] entity.villager.no 0.9"
  loading:
    - "{prefix} &cTus datos de teletransporte aun se estan cargando. Intentalo de nuevo en un momento."
    - "[sound] block.note_block.hat 0.9"
  storage-failed:
    - "{prefix} &cNo se pudieron guardar los datos de teletransporte. Intentalo de nuevo en un momento."
    - "[sound] block.note_block.bass 0.7"
  unsafe:
    - "{prefix} &cNo se encontro un destino seguro. No se teletransporto nada."
    - "[sound] item.shield.break 0.95"
  top-none:
    - "{prefix} &cNo hay un lugar seguro donde pararse encima de ti."
    - "[sound] block.note_block.bass 0.8"
  bottom-none:
    - "{prefix} &cNo hay un lugar seguro donde pararse debajo de ti."
    - "[sound] block.note_block.bass 0.8"
  busy:
    - "{prefix} &cYa hay un teletransporte pendiente. Intentalo de nuevo en un momento."
    - "[sound] block.note_block.hat 0.85"
  self:
    - "{prefix} &cNo puedes enviarte una solicitud de teletransporte a ti mismo."
    - "[sound] block.note_block.bass 0.8"
  toggle-on:
    - "{prefix} &a{player} ahora acepta solicitudes de teletransporte."
    - "[sound] block.note_block.pling 1.4"
  toggle-off:
    - "{prefix} &c{player} ya no acepta solicitudes de teletransporte. Solicitudes entrantes canceladas."
    - "[sound] block.note_block.bass 0.85"
  tpaall-sent:
    - "{prefix} &aSolicitudes de teletransporte hacia &f{target} &aenviadas a &f{count} &ajugador(es)."
    - "[sound] block.note_block.pling 1.3"
  tpaall-none:
    - "{prefix} &7No se encontraron jugadores conectados elegibles para solicitudes de teletransporte."
    - "[sound] block.note_block.hat 0.9"
  auto-on:
    - "{prefix} &aAceptacion automatica de teletransportes activada para &f{player}&a."
    - "[sound] block.note_block.pling 1.4"
  auto-off:
    - "{prefix} &7Aceptacion automatica de teletransportes desactivada para &f{player}&7."
    - "[sound] block.note_block.bass 0.85"
  auto-accepted:
    - "{prefix} &aSolicitud de teletransporte de &f{player} &aaceptada automaticamente."
    - "[sound] block.note_block.pling 1.5"
  jump-none:
    - "{prefix} &cNo hay ningun bloque a la vista al cual saltar."
    - "[sound] block.note_block.bass 0.8"
  all:
    - "{prefix} &aTeletransportados &f{count} &ajugador(es) hacia &f{player}&a."
    - "[sound] entity.enderman.teleport 1.1"
  all-none:
    - "{prefix} &7No hay otros jugadores conectados para teletransportar."
    - "[sound] block.note_block.bass 0.85"
  entity-limit-exceeded:
    - "{prefix} &cLa seleccion coincidio con &f{count} &centidades, lo cual supera el limite maximo de &f{limit}&c."
    - "[sound] block.note_block.bass 0.75"
  selector-confirm:
    - "{prefix} &eSeleccionadas &f{count} &e{label}. Ejecuta &f{command} &ede nuevo en &f{seconds}s &epara confirmar el teletransporte."
    - "[sound] block.note_block.bell 1.0"
  entities-moved:
    - "{prefix} &aTeletransportadas &f{count} &a{label}."
    - "[sound] entity.enderman.teleport 1.05"
  arrival-pvp-target:
    - "{prefix} &c{player} &eesta protegido brevemente del PvP tras teletransportarse."
    - "[sound] item.shield.block 1.1"
  arrival-pvp-self:
    - "{prefix} &eEstas protegido brevemente del PvP tras teletransportarte."
    - "[sound] item.shield.block 1.1"
spawnmob:
  list:
    - "{prefix} &6Mobs disponibles: &f{mobs}"
    - "[sound] ui.button.click 1.2"
  spawned:
    - "{prefix} &aGenerados &f{count} &a{mob}&a."
    - "[sound] entity.experience_orb.pickup 1.1"
  limit:
    - "{prefix} &eCantidad reducida al limite del servidor (&f{limit}&e)."
    - "[sound] block.note_block.hat 0.9"
  invalid-mob:
    - "{prefix} &cMob desconocido o no generable: &f{mob}&c."
    - "[sound] block.note_block.bass 0.75"
  no-perm-mob:
    - "{prefix} &cNo tienes permiso para generar &f{mob}&c."
    - "[sound] entity.villager.no 0.9"
  no-stack:
    - "{prefix} &cNo tienes permiso para apilar mobs."
    - "[sound] entity.villager.no 0.9"
  invalid-amount:
    - "{prefix} &cLa cantidad debe ser un numero entero positivo."
    - "[sound] block.note_block.bass 0.75"
  unable:
    - "{prefix} &cNo se pudo generar ese mob aqui."
    - "[sound] block.note_block.bass 0.75"
  data-list:
    - "{prefix} &7Datos disponibles para &f{mob}&7: &f{data}"
    - "[sound] ui.button.click 1.2"
travel:
  loading:
    - "{prefix} &cLos datos de viaje se estan cargando. Intentalo de nuevo en un momento."
    - "[sound] block.note_block.hat 0.9"
  busy:
    - "{prefix} &cEl almacenamiento de viajes esta ocupado. Intentalo de nuevo en un momento."
    - "[sound] block.note_block.hat 0.85"
  storage-failed:
    - "{prefix} &cNo se pudieron guardar los datos de viaje. Intentalo de nuevo en un momento."
    - "[sound] block.note_block.bass 0.7"
  name-invalid:
    - "{prefix} &cUsa de 1 a 32 letras, digitos, guiones bajos o guiones para el nombre."
    - "[sound] block.note_block.bass 0.8"
  confirm:
    - "{prefix} &eEste nombre ya existe. Ejecuta &f{command} &epara confirmar la ubicacion capturada."
    - "[sound] block.note_block.bell 1.1"
  confirm-expired:
    - "{prefix} &cNo hay ninguna confirmacion de sobrescritura activa. Ejecuta de nuevo el comando para establecer."
    - "[sound] block.note_block.bass 0.75"
  changed:
    - "{prefix} &cEste destino cambio. Ejecuta el comando de nuevo."
    - "[sound] block.note_block.bass 0.8"
  limit:
    - "{prefix} &cHas alcanzado tu limite de hogares ({limit})."
    - "[sound] entity.villager.no 0.95"
home:
  set:
    - "{prefix} &aHogar &f{name} &aestablecido."
    - "[sound] block.note_block.chime 1.3"
  deleted:
    - "{prefix} &aHogar &f{name} &aeliminado."
    - "[sound] item.book.page_turn 0.9"
  not-found:
    - "{prefix} &cHogar &f{name} &cno encontrado."
    - "[sound] block.note_block.bass 0.8"
  limit-reached:
    - "{prefix} &cHas alcanzado el limite de hogares (&f{limit}&c)."
    - "[sound] entity.villager.no 0.95"
  list:
    - "{prefix} &fHogares: &d{homes}"
    - "[sound] item.book.page_turn 1.1"
  none:
    - "{prefix} &cNo tienes hogares establecidos."
    - "[sound] block.note_block.hat 0.9"
  bed-entry:
    - "&dbed"
  bed-missing-entry:
    - "&7&mbed"
  bed-missing:
    - "{prefix} &cNo tienes cama ni ancla de reaparicion cargada, o esta bloqueada."
    - "[sound] block.note_block.bass 0.8"
  bed-reserved:
    - "{prefix} &cEl nombre &fbed &cesta reservado para tu cama; elige otro nombre para este hogar."
    - "[sound] block.note_block.bass 0.8"
  list-other:
    - "{prefix} &fHogares de {player}: &d{homes}"
    - "[sound] item.book.page_turn 1.1"
  none-other:
    - "{prefix} &f{player} &cno tiene hogares establecidos."
    - "[sound] block.note_block.hat 0.9"
  not-found-other:
    - "{prefix} &f{player} &cno tiene un hogar llamado &f{name}&c."
    - "[sound] block.note_block.bass 0.8"
  deleted-other:
    - "{prefix} &aEliminaste el hogar &f{name} &ade &f{player}&a."
    - "[sound] item.book.page_turn 0.9"
  bed-missing-other:
    - "{prefix} &f{player} &cno tiene cama ni ancla de reaparicion cargada, o esta bloqueada."
    - "[sound] block.note_block.bass 0.8"
  bed-set:
    - "{prefix} &aSe actualizo tu hogar de cama."
    - "[sound] block.note_block.chime 1.3"
  renamed:
    - "{prefix} &aRenombraste el hogar &f{old} &aa &f{name}&a."
    - "[sound] block.note_block.chime 1.25"
  renamed-other:
    - "{prefix} &aRenombraste el hogar &f{old} &ade &f{player} &aa &f{name}&a."

crops:
  banana:
    id: banana
    display-name: Banana
    seed:
      item: allium:banana_seeds
    placement:
      valid-soils:
      - FARMLAND
      requires-water: true
      minimum-light: 9
    growth:
      clock: REAL_TIME
      grow-while-unloaded: true
      maximum-catch-up-stages: 10
      randomness: 0.25
    interaction:
      right-click-harvest: false
      break-harvest: true
      progress-check: false
    paths:
      selection:
        mode: WEIGHTED_ONE
        timing: ON_PLANT
      entries:
        normal:
          weight: 85
          stages:
          - model: allium:banana_stage_1
            duration: 30m
            visual:
              transform: GROUND
              scale: 1.0
              y-offset: 0.001
              align-to-soil: true
          - model: allium:banana_stage_2
            duration: 45m
            visual:
              transform: GROUND
              scale: 1.0
              y-offset: 0.001
              align-to-soil: true
          - model: allium:banana_stage_3
            duration: 60m
            visual:
              transform: GROUND
              scale: 1.0
              y-offset: 0.001
              align-to-soil: true
          - model: allium:banana_stage_4
            duration: 60m
            visual:
              transform: GROUND
              scale: 1.0
              y-offset: 0.001
              align-to-soil: true
          - model: allium:banana_stage_5
            duration: 60m
            visual:
              transform: GROUND
              scale: 1.0
              y-offset: 0.001
              align-to-soil: true
          mature-harvest:
            delivery: DROP_AT_CROP
            primary:
              mode: WEIGHTED_ONE
              entries:
                regular:
                  weight: 65
                  drops:
                  - item: allium:banana
                    amount: 1
                silver:
                  weight: 25
                  drops:
                  - item: allium:banana_silver_star
                    amount: 1
                golden-star:
                  weight: 10
                  drops:
                  - item: allium:banana_golden_star
                    amount: 1
            additional:
              mode: INDEPENDENT
              entries:
                seeds:
                  chance: 1.0
                  drops:
                  - item: allium:banana_seeds
                    amount:
                      min: 1
                      max: 2
          break-drops:
            immature:
              mode: GUARANTEED_ALL
              entries:
                seeds:
                  drops:
                  - item: allium:banana_seeds
                    amount: 1
            mature:
              mode: GUARANTEED_ALL
              entries:
                seeds:
                  drops:
                  - item: allium:banana_seeds
                    amount: 2
          regrowth:
            enabled: false
            stage: 2
            on-right-click:
              enabled: false
              stage: 2
            on-break:
              enabled: false
        golden:
          weight: 0
          stages:
          - model: allium:banana_stage_1
            duration: 30m
            visual:
              transform: GROUND
              scale: 1.0
              y-offset: 0.001

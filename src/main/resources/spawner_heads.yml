############################################################
# +------------------------------------------------------+ #
# |                  Spawner Head Drops                  | #
# +------------------------------------------------------+ #
############################################################
# Heads Allium drops from mobs. These are the heads used to craft spawner
# cores (see spawnercraft in config.yml) and mob plushies.
#
# Remove a mob (or set enabled: false) to stop Allium dropping its head.
# Reload with /core reload.

settings:
  # A "More Mob Heads" style datapack drops its own head for many of these mobs,
  # which doubles the drop rate. When true, Allium removes the datapack's head for
  # any mob listed below and drops its own instead, so there is exactly one source.
  # Set to false to let the datapack head drop as well (both sources active).
  # Mobs not listed below are never touched - their datapack heads drop as normal.
  override-moremobs-head-drop: true

# chance                   : drop chance (0.0 - 1.0) when the killer has no Looting
# looting-chance           : drop chance at Looting I
# looting-chance-per-level : added per Looting level above I
#
# Optional per-mob keys (only needed to add a mob that Allium does not ship):
#   sound   : note_block_sound of the head, "entity.<mob>.<sound>". Allium reads this
#             back to tell which mob a head belongs to, so it must be unique per mob.
#   texture : base64 texture value of the head skin
heads:
  ENDERMAN:
    enabled: true
    chance: 0.001
    looting-chance: 0.0011
    looting-chance-per-level: 0.0001
    sound: "entity.enderman.scream"

name: Allium
version: '${version}'
main: codes.castled.allium.PluginStart
api-version: '1.20'
description: A modern essentials suite
authors: [castledking]
softdepend: [LuckPerms, Vault, PlaceholderAPI, Nexo, CraftEngine, Oraxen, ResourcePackManager, DiscordSRV, packetevents, InteractiveChat, GriefPrevention, GriefPrevention3D]
folia-supported: true

commands:
  grindstone:
    description: Open a virtual grindstone
    permission: allium.grindstone
  cartographytable:
    description: Open a virtual cartography table
    permission: allium.cartographytable
    aliases: [carttable]
  stonecutter:
    description: Open a virtual stonecutter
    permission: allium.stonecutter
  loom:
    description: Open a virtual loom
    permission: allium.loom
  smithing:
    description: Open a virtual smithing table
    permission: allium.smithing
    aliases: [smithingtable]
  depth:
    description: Show your height above sea level
    permission: allium.depth
    aliases: [height]
  ice:
    description: Apply the frost overlay
    permission: allium.ice
  rest:
    description: Reset time since rest
    permission: allium.rest
  thunder:
    description: Set thunder in the current world
    permission: allium.thunder
  broadcastworld:
    description: Broadcast to a world
    permission: allium.broadcastworld
    aliases: [bcw, bcastw, shoutworld]
  realname:
    description: Look up a visible online player by nickname
    permission: allium.realname
  rtoggle:
    description: Switch the reply target mode
    permission: allium.rtoggle
    aliases: [replytoggle]
  break:
    description: Break the block you are looking at
    permission: allium.break
  spawner:
    description: Change the spawner you are looking at
    permission: allium.spawner
    aliases: [changems, mobspawner]
  tree:
    description: Grow a tree
    permission: allium.tree
  bigtree:
    description: Grow a large tree
    permission: allium.bigtree
    aliases: [largetree]
  remove:
    description: Remove entities from loaded chunks
    permission: allium.remove
    aliases: [butcher, killall, mobkill]
  condense:
    description: Craft items into blocks
    permission: allium.condense
    aliases: [compact, blocks, toblocks]
  book:
    description: Edit or sign the held book
    permission: allium.book
  editsign:
    description: Edit or copy sign text
    permission: allium.editsign
    aliases: [sign]
  unlimited:
    description: Manage replenished block items
    permission: allium.unlimited
    aliases: [ul, unl]
  top:
    description: Teleport to the highest block above you
    usage: /top
    permission: allium.top
  bottom:
    description: Teleport to the lowest block below you
    usage: /bottom
    permission: allium.bottom
  there:
    description: Teleport to the block you are looking at, or send selected entities there
    aliases: [tpthere]
    permission: allium.tpthere
  tppet:
    description: Toggle selecting your own pets for /tp
    permission: allium.tppet
  tpent:
    description: Toggle selecting mobs and other entities for /tp
    aliases: [tpentity, tpmob, teleportmob, tpm, tpe]
    permission: allium.tpmob
  help:
    description: List the commands you can use
    usage: /<command> [page|command|plugin] [page]
    permission: allium.help
  nick:
    description: Set or clear your nickname (or another player's)
    aliases: [nickname]
    permission: allium.nick
  editnick:
    description: Open the nickname customization GUI
    aliases: [nickgui]
    usage: /<command> [player]
    permission: allium.editnick
  channel:
    description: Join, leave or write to a chat channel
    aliases: [g, global, shout, l, local, a, ac, amsg, staffchat]
    permission: allium.channel
  action:
    description: Describe what you are doing in chat
    usage: /<command> <message>
    aliases: [me, describe]
    permission: allium.me
  delmsg:
    description: Delete a chat message for everyone
    aliases: [deletemsg]
  clearchat:
    description: Clear the chat window for everyone or one player
    usage: /<command> [player]
    permission: allium.clearchat
  redeem:
    description: Claim configured rank rewards
    aliases: [claimrank]
    permission: allium.redeem
  autorestart:
    description: Schedule or manage server restarts
    aliases: [ar]
  voterestart:
    description: Vote for a server restart
    permission: allium.autorestart.vote.yes
  repair:
    description: Repair the held item, or your whole inventory
    usage: /<command> [hand|all]
    permission: allium.repair
    aliases: [fix]
  disposal:
    description: Open a trash bin that deletes what you put in
    usage: /<command>
    aliases: [trash, dispose]
    permission: allium.disposal
  workbench:
    description: Open a crafting table anywhere
    usage: /<command>
    aliases: [craft, wb, wbench]
    permission: allium.workbench
  anvil:
    description: Open an anvil anywhere
    usage: /<command>
    permission: allium.anvil
  info:
    description: Show the server info pages
    usage: /<command> [chapter] [page]
    aliases: [about, ifo, news]
    permission: allium.info
  inform:
    description: Show a player the info pages
    usage: /<command> [player] [chapter] [page]
    permission: allium.inform
  speed:
    description: Set your walk or fly speed
    usage: /<command> [walk|fly] <0..10|reset> [player]
    aliases: [wspeed, walkspeed, flyspeed, fspeed]
    permission: allium.speed
  scale:
    description: Set the scale of a player or selected mobs
    usage: /<command> <0..16> [player]
    permission: allium.scale
  ping:
    description: Show your (or a player's) connection latency
    usage: /<command> [player]
    permission: allium.ping
    aliases: [pong]
  coords:
    description: Show your (or a player's) position
    usage: /<command> [player]
    aliases: [getpos, whereami, getloc, getlocation, position]
    permission: allium.getpos
  glow:
    description: Set your glow colour, or another player's
    usage: /<command> <color|rainbow|off|spectator> [player]
    permission: allium.glow
  powertool:
    description: Create, edit, save, bind, enable/disable and give interactive powertool items
    usage: /<command> <add|set|remove|clear|cooldown|perm|uses|cancel|sneak|hand|info|save|delete|bind|enable|disable|get|give|list|toggle|reload|help> [args...]
    aliases: [pt, tool, tools, powertools, ptt, powertooltoggle, pttoggle, powertoollist, ptlist]
    permission: allium.powertool
  compass:
    description: Show the direction you are facing
    usage: /<command>
    permission: allium.compass
    aliases: [direction]
  ext:
    description: Put out a burning player
    usage: /<command> [player]
    aliases: [extinguish]
    permission: allium.ext
  burn:
    description: Set a player on fire
    usage: /<command> <player> [seconds]
    permission: allium.burn
  recipe:
    aliases: [formula, method, recipes]
    description: Show how an item is made
    usage: /<command> [item] [number]
    permission: allium.recipe
  potion:
    aliases: [elixer, elixir]
    description: Edit or apply custom effects on the held potion
    usage: /<command> <clear|apply|effect:<effect> power:<power> duration:<seconds>>
    permission: allium.potion
  firework:
    description: Edit or launch the held firework rocket
    usage: /<command> <<meta>|power <0-4>|clear|fire [amount]>
    permission: allium.firework
  smite:
    description: Strike a player or where you are looking with harmless lightning
    usage: /<command> [player]
    aliases: [lightning, strike, shock, thor]
    permission: allium.smite
  nv:
    description: Toggle night vision
    usage: /<command> [on|off] [player]
    aliases: [nightvision]
    permission: allium.nv
  clearinventory:
    description: Clear your (or a player's) inventory
    usage: /<command> [player|*|**] [item] [maxCount]
    aliases: [clear, ci, clean, clearinvent]
    permission: allium.clearinventory
  clearinventoryconfirmtoggle:
    description: Toggle inventory clear confirmation
    usage: /<command>
    permission: allium.clearinventoryconfirmtoggle
    aliases: [clearconfirm, clearconfirmon, clearconfirmoff, clearinventoryconfirmoff]
  more:
    description: Fill the held stack to its maximum
    usage: /<command> [amount] [player]
    permission: allium.more
  hat:
    description: Wear the held item on your head
    usage: /<command>
    permission: allium.hat
  skull:
    description: Get a player's head
    usage: /<command> [owner] [player]
    aliases: [head, playerhead, playerskull]
    permission: allium.skull
  itemdb:
    description: Show the held item's ID and metadata
    usage: /<command> [player]
    aliases: [iteminfo, itemno]
    permission: allium.itemdb
  gc:
    description: Show TPS, memory, uptime and loaded worlds
    usage: /<command>
    aliases: [uptime, lag, tps, mem, memory]
    permission: allium.gc
  time:
    description: View, set, add to or pause world time
    usage: /<command> [set|add|pause] [value] [world|*]
    permission: allium.time
  day:
    description: Set the time to day
    usage: /<command> [world|*]
    permission: allium.time.set
  night:
    description: Set the time to night
    usage: /<command> [world|*]
    permission: allium.time.set
  weather:
    description: Set the weather to clear, rain or thunder
    usage: /<command> <clear|sun|rain|storm|thunder> [duration] [world|*]
    permission: allium.weather
    aliases: [rain, storm, sun, sky]
  ptime:
    description: View, set, freeze, or reset a player's client time
    usage: /<command> [list|reset|@<time>|<time>] [player|*]
    aliases: [playertime]
    permission: allium.ptime
  pweather:
    description: View, set, or reset a player's client weather
    usage: /<command> [list|reset|sun|storm] [player|*]
    aliases: [playerweather]
    permission: allium.pweather
  enchant:
    description: Add or remove enchantments on the held item
    usage: /<command> <enchantment> <level> [player]
    permission: allium.enchant
  rename:
    description: Rename the item in your hand
    usage: /<command> <name|clear>
    aliases: [itemname, iname, itemrename, irename]
    permission: allium.rename
  lore:
    description: Edit the lore of the item in your hand
    usage: /<command> <add|set|insert|remove|clear|copy|paste>
    aliases: [itemlore, ilore]
    permission: allium.lore
  xp:
    description: Show or change experience
    usage: /<command> [player] | /<command> <give|take|set> <player> <amount>[L] | /<command> reset <player>
    aliases: [exp]
    permission: allium.xp
  xpbottle:
    description: Convert experience into a redeemable XP bottle
    usage: /<command> <amount|amountL|all> [player]
    aliases: [bottle, expbottle]
    permission: allium.xpbottle
  customtext:
    description: Show a page of the server's custom text
    usage: /<command> [section] [page]
    permission: allium.customtext
  broadcast:
    description: Send a message to everyone online
    usage: /<command> <message>
    aliases: [bc, bcast]
    permission: allium.broadcast
  broadcasts:
    description: Show the timed broadcasts, or send one now
    usage: /<command> [send <name>|next]
    permission: allium.broadcasts.admin
  spawnmob:
    description: Spawn one or more mobs at your target block or a player
    usage: /<command> <mob>[:data][,<mount>[:data]] [amount] [player]
    aliases: [mob]
    permission: allium.spawnmob
  motd:
    description: Show the message of the day
    usage: /<command> [section] [page]
    permission: allium.motd
  rules:
    description: Show the server rules
    usage: /<command> [chapter] [page]
    permission: allium.rules
  heal:
    description: Restore health, hunger and remove effects
    usage: /<command> [player]
    permission: allium.heal
  feed:
    description: Fill hunger and saturation
    usage: /<command> [player]
    permission: allium.feed
  fly:
    description: Toggle flight, or your timed flight
    usage: /<command> [player] | /<command> <player> <set|add|take|reset> [time]
    permission: allium.tfly
  toggleslowfall:
    description: Toggle slow falling when you lose flight
    usage: /<command> [on|off|status]
    aliases: [tsf, slowfalltoggle, toggleslowfalling]
    permission: allium.fly
  god:
    description: Toggle invulnerability
    usage: /<command> [player]
    permission: allium.god
  pvp:
    description: Toggle player-versus-player combat
    usage: /<command> [on|off] [player]
    permission: allium.pvp
  gamemode:
    description: Change gamemode (per-mode permission)
    usage: /<command> <mode> [player]
    aliases: [gm, gmc, gma, gms, gmsp, creative, survival, spectator, adventure, creativemode, survivalmode, spectatormode, adventuremode, gmt]
    permission: allium.gamemode
  msg:
    description: Send a private message
    usage: /<command> <player> <message>
    aliases: [tell, w, whisper, m, t, pm]
    permission: allium.msg
  reply:
    description: Reply to your last private message
    usage: /<command> <message>
    aliases: [r]
    permission: allium.reply
  ignore:
    description: Ignore a player, or list who you ignore
    usage: /<command> [player]
    permission: allium.ignore
  unignore:
    description: Stop ignoring a player
    usage: /<command> <player>
    permission: allium.ignore
    aliases: [delignore, remignore, rmignore]
  msgtoggle:
    description: Turn incoming private messages on or off
    usage: /<command> [on|off] [player]
    permission: allium.msgtoggle
  mail:
    description: Read and send mail, and send or claim item gifts
    usage: /<command> <read|send|gift|claim|delete|clear>
    permission: allium.mail
    aliases: [memo]
  socialspy:
    description: See private messages between other players
    usage: /<command> [on|off]
    permission: allium.socialspy
  commandspy:
    aliases: [cmdspy, cspy]
    description: Opt in or out of seeing other players' commands
    usage: /<command> [on|off]
    permission: allium.commandspy
  spy:
    description: Inspect and toggle message, local chat, and command spying for a player
    usage: /<command> <player>
    permission: allium.spy
  spectate:
    description: Spectate a player using the configured spectate commands
    usage: /<command> <player>
    permission: allium.spectate
  messagesounds:
    description: Set the volume of private-message sounds
    usage: /<command> [volume <0-1>|toggle|reset]
    aliases: [msounds, mfx]
    permission: allium.messagesounds
  allium:
    aliases: [core]
    description: "Allium administration: reload, version, imports"
    usage: /<command> <reload|version|import <lang|vouchers|legacy>|escalate|adopt-window [<duration>|off]|hide|creativemanager>
  give:
    description: Give vanilla, provider or Allium items
    usage: /<command> <player> <item[,item...]> [amount] [key:value...] [-e] [--overflow=drop|refuse|partial]
    permission: allium.give

  tpoffline:
    description: Teleport to where an offline player logged out
    aliases: [otp, offlinetp, tpoff]
    usage: /<command> <player>
    permission: allium.tp.offline
  tpa:
    description: Ask to teleport to a player
    permission: allium.tpa
    aliases: [call, tpask]
  tpahere:
    description: Ask a player to teleport to you
    permission: allium.tpahere
  tpaccept:
    description: Accept a teleport request
    aliases: [tpyes]
    permission: allium.tpaccept
  tpdeny:
    description: Deny a teleport request
    aliases: [tpno]
    permission: allium.tpdeny
  tpacancel:
    description: Cancel pending teleport requests or an active teleport
    usage: /<command> [player]
    aliases: [tpcancel]
    permission: allium.tpacancel
  tpaall:
    description: Send a teleport-here request to every online player
    usage: /<command> [player]
    permission: allium.tpaall
  tptoggle:
    description: Allow or block teleport requests to you
    permission: allium.tptoggle
  tpauto:
    description: Automatically accept incoming teleport requests
    usage: /<command> [on|off] [player]
    permission: allium.tpauto
  back:
    description: Return to your previous location
    permission: allium.back
    aliases: [return]
  spawn:
    description: Teleport to spawn
    permission: allium.spawn
  setspawn:
    description: Set the default or a group spawn point here
    usage: /<command> [group]
    permission: allium.setspawn
  world:
    description: List accessible worlds or teleport to a world's spawn
    usage: /<command> [world] [player]
    permission: allium.world
  tp:
    description: Teleport to a player or coordinates, or move a player
    aliases: [tp2p, tele]
    usage: /<command> <player> [target] | /<command> <x> <y> <z> [yaw] [pitch] [world]
    permission: allium.tp
  jump:
    description: Teleport to the block you are looking at
    aliases: [j, jumpto]
    usage: /<command>
    permission: allium.jump
  tppos:
    description: Teleport to coordinates
    usage: /<command> <x> <y> <z> [yaw] [pitch] [world]
    permission: allium.tppos
  tphere:
    aliases: [here, s]
    description: Teleport a player to you
    permission: allium.tphere

  tpo:
    description: Teleport to or move a player, bypassing /tptoggle
    usage: /<command> <player> [target]
    permission: allium.tpo

  tpohere:
    description: Teleport a player to you, bypassing /tptoggle
    usage: /<command> <player>
    permission: allium.tpohere

  tpall:
    description: Teleport all online players to your location, bypassing /tptoggle
    usage: /<command> [player]
    permission: allium.tpall

  sethome:
    description: Set a home here
    usage: /sethome
    aliases: [createhome]

  home:
    description: Teleport to one of your homes
    usage: /home [name|bed|player:home]

  delhome:
    description: Delete one of your homes
    usage: /delhome [name|player:home]
    aliases: [remhome, rmhome]

  renamehome:
    description: Rename one of your homes
    usage: /<command> <home|player:home> <newhome>
    permission: allium.renamehome

  homes:
    description: List your homes
    usage: /homes [player]

  bed:
    description: Teleport to your bed
    usage: /bed
    permission: allium.home.bed

  setwarp:
    description: Create or move a warp here
    usage: /setwarp
    aliases: [createwarp]

  warp:
    description: Teleport to a warp, or send a player to a warp
    usage: /<command> <name> [player]

  warpinfo:
    description: Show a warp's location and permission
    usage: /<command> <name>
    permission: allium.warpinfo

  delwarp:
    description: Delete a warp
    usage: /delwarp
    aliases: [remwarp, rmwarp]

  warps:
    description: List the warps you can use
    usage: /warps

  kit:
    description: Claim a kit, or give one to a player
    usage: /<command> [name] [player]
    permission: allium.kit
  kits:
    description: List the kits you can claim
    usage: /<command>
    permission: allium.kits
  createkit:
    description: Save your inventory as a kit
    usage: /<command> <name> [cooldown] [once]
    permission: allium.createkit
    aliases: [ck, kc, createk, kitcreate]
  delkit:
    description: Delete a kit
    usage: /<command> <name>
    permission: allium.delkit
    aliases: [deletekit, remkit, rmkit]
  showkit:
    description: Preview the items in a kit
    usage: /<command> <kit>
    aliases: [kitpreview, preview, kitshow]
    permission: allium.showkit
  kitreset:
    description: Clear a player's cooldown for a kit
    usage: /<command> <kit> [player]
    aliases: [kitr, resetkit]
    permission: allium.kitreset

  vanish:
    description: Toggle vanish for yourself or another player
    usage: /<command> [on|off] [player]
    aliases: [v]
    permission: allium.vanish
  mute:
    description: Mute or toggle mute on a player, optionally for a time
    usage: /<command> <player> [duration] [reason]
    aliases: [silence]
    permission: allium.mute
  unmute:
    description: Unmute a player
    usage: /<command> <player> [reason]
    permission: allium.unmute
  mutes:
    description: List active mutes
    usage: /<command>
    aliases: [mutelist]
    permission: allium.mute

  i:
    description: Give yourself an item
    usage: /<command> <item[,item...]> [amount] [key:value...] [-e] [--overflow=drop|refuse|partial]
    aliases: [item]
    permission: allium.give
  list:
    description: List online players by group
    usage: /<command>
    aliases: [online, who, playerlist, plist]
    permission: allium.list
  seen:
    description: Show when a player was last online
    usage: /<command> <player>
    aliases: [alts]
    permission: allium.seen
  whois:
    description: Show a player's UUID, names, status and staff details
    usage: /<command> <player>
    permission: allium.whois
  rtp:
    aliases: [tpr, tprandom]
    description: Teleport to a random safe spot
    usage: /<command> [location] [player]
    permission: allium.rtp
  settpr:
    aliases: [settprandom]
    description: Set a random teleport location's centre, range, shape and heights
    usage: /<command> <location> <center|minrange|maxrange|shape|miny|maxy|world|remove> [value]
    permission: allium.settpr
  worth:
    aliases: [price]
    description: Show what items sell for
    usage: /<command> [hand|inventory|blocks|item] [amount]
    permission: allium.worth
  sell:
    description: Sell items for their worth
    usage: /<command> <hand|inventory|all|blocks|item> [-][amount][s]
    permission: allium.sell
  setworth:
    description: Set what an item sells for
    usage: /<command> [hand|item] <price>
    permission: allium.setworth
  report:
    description: Report a player, or anything else, to staff
    usage: /<command> <player> <what happened> | /<command> <message>
    permission: allium.report
  escalate:
    description: Hand an issue up to senior staff
    usage: /<command> <target> <reason>
    permission: allium.escalate
  helpop:
    aliases: [helpme]
    description: Send a help request to online staff
    usage: /<command> <message>
    permission: allium.helpop
  voucher:
    aliases: [vouchers]
    description: Give and list vouchers (powertools named voucher_<name>); /vouchers lists them
    usage: /<command> <give|list|reload> [player] [voucher] [amount]
    permission: allium.voucher.give
  unrestrain:
    description: Free every restrained player, or one player
    usage: /<command> [player]
    permission: allium.unrestrain
  antioch:
    aliases: [grenade, tnt]
    description: Throw primed TNT where you look
    usage: /<command>
    permission: allium.antioch
  fireball:
    aliases: [fireentity, fireskull]
    description: Throw a fireball or another projectile
    usage: /<command> [fireball|small|large|arrow|skull|egg|snowball|expbottle|dragon|splashpotion|lingeringpotion|trident|windcharge] [speed] [ride]
    permission: allium.fireball
  beezooka:
    aliases: [beecannon]
    description: Throw an exploding bee
    usage: /<command>
    permission: allium.beezooka
  kittycannon:
    description: Throw an exploding kitten
    usage: /<command>
    permission: allium.kittycannon
  nuke:
    description: Rain TNT on players; it breaks no blocks
    usage: /<command> [player...]
    permission: allium.nuke
  explode:
    description: Drop an exploding fireball on yourself or a player
    usage: /<command> [player] [power]
    permission: allium.explode
  creativemanager:
    aliases: [cm]
    description: Manage creative-mode flags for players and permission groups
    usage: /<command> [gui|active|player <player> [edit|list|check|add|remove] [flag]|group <group> [edit|list|check|add|remove] [flag]]
    permission: allium.gamemode.creative.manage
  restore:
    description: Browse inventory snapshots and restore them
    usage: /<command> [player]
    permission: allium.restore
  altexempt:
    description: Exempt an account from alt detection, or check it
    usage: /<command> <add|remove|check> <player> [reason]
    permission: allium.altexempt
  near:
    description: List players near you
    usage: /<command> [radius]
    permission: allium.near
    aliases: [nearby]
  playtime:
    description: Show how long you (or another player) have played
    usage: /<command> [player]
    permission: allium.playtime
  afk:
    description: Toggle AFK, with an optional message
    usage: /<command> [message]
    aliases: [away]
    permission: allium.afk

  kick:
    description: Kick a player with a reason
    usage: /<command> <player> [reason]
    permission: allium.kick

  kickall:
    description: Kick every online player except the sender and exempt players
    usage: /<command> [reason]
    permission: allium.kickall

  ban:
    description: Ban a player permanently
    usage: /<command> <player> [reason]
    permission: allium.ban

  tempban:
    description: Ban a player for a set time
    usage: /<command> <player> <duration> [reason]
    permission: allium.tempban

  unban:
    description: Lift a player's ban
    usage: /<command> <player>
    permission: allium.unban
    aliases: [pardon]

  banlist:
    description: List active bans
    usage: /<command>
    permission: allium.banlist

  ipban:
    description: Ban a player's IP address
    usage: /<command> <player> [reason]
    aliases: [banip]
    permission: allium.ipban

  tempbanip:
    description: Temporarily ban a player or literal IP address
    usage: /<command> <player|ip> <duration> [reason]
    permission: allium.tempbanip

  unbanip:
    description: Remove IP bans for a player or literal IP address
    usage: /<command> <player|ip>
    aliases: [pardonip]
    permission: allium.unbanip

  freeze:
    description: Freeze or unfreeze a player in place
    usage: /<command> <player> [on|off] [reason]
    permission: allium.freeze

  setjail:
    description: Create or move a jail here
    usage: /<command> <name>
    permission: allium.setjail
    aliases: [createjail]

  deljail:
    description: Delete an empty jail
    usage: /<command> <jail>
    aliases: [remjail, rmjail]
    permission: allium.deljail

  jails:
    description: List all defined jails
    usage: /<command>
    permission: allium.jails

  jailedplayers:
    description: List currently jailed players
    usage: /<command>
    permission: allium.jailedplayers

  jail:
    description: Send a player to a jail
    usage: /<command> <player> <jail> [reason]
    permission: allium.jail

  unjail:
    description: Release a player from jail
    usage: /<command> <player>
    permission: allium.unjail

  togglejail:
    description: Toggle a player's jail status with an optional jail and duration
    usage: /<command> <player> [jail] [time]
    aliases: [tjail]
    permission: allium.togglejail

  warn:
    description: Warn a player and record it
    usage: /<command> <player> [reason]
    permission: allium.warn

  notes:
    description: Read, add, or remove staff notes on a player
    usage: /<command> <player> [list|add <note>|remove <id>]
    permission: allium.notes

  unnote:
    description: Remove a staff note while retaining moderation audit history
    usage: /<command> <id> | /<command> <player> <id>
    permission: allium.unnote

  invsee:
    description: View or edit a player's inventory, online or offline
    usage: /<command> <player>
    permission: allium.invsee

  enderchest:
    description: Open your ender chest, or view another player's
    usage: /<command> [player]
    aliases: [echest, ec]
    permission: allium.enderchest

  balance:
    description: Show your (or a player's) balance
    aliases: [bal]
    permission: allium.balance
  pay:
    description: Pay money to a player
    permission: allium.pay
  paytoggle:
    description: Allow or refuse incoming payments
    aliases: [payon, payoff]
    permission: allium.paytoggle
  payconfirmtoggle:
    description: Toggle confirmation prompts before sending /pay payments
    usage: /<command> [on|off] [player]
    aliases: [payconfirm, payconfirmon, payconfirmoff]
    permission: allium.payconfirmtoggle
  eco:
    aliases: [money]
    description: Give, take or set player balances
    permission: allium.eco
  baltop:
    description: Show the richest accounts
    usage: /<command> [page]
    aliases: [balancetop]
    permission: allium.baltop
  cheque:
    description: Write a redeemable money cheque
    usage: /<command> <amount> [player]
    permission: allium.cheque
  tax:
    description: Inspect, impose, list or refund server taxes
    usage: /<command> [balance|impose|history|refund]
    permission: allium.tax


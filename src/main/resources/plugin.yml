name: Allium
version: '${version}'
main: codes.castled.allium.PluginStart
api-version: '1.20'
description: A modern essentials suite
authors: [castledking]
softdepend: [LuckPerms, Vault, PlaceholderAPI, Nexo, CraftEngine, Oraxen, ResourcePackManager, DiscordSRV, packetevents, InteractiveChat, GriefPrevention, GriefPrevention3D]

commands:
  there:
    description: Teleport to the block you are looking at, or send selected entities there
    aliases: [tpthere]
    permission: allium.tpthere
  tppet:
    description: Toggle selecting your own pets for /tp
    permission: allium.tppet
  tpent:
    description: Toggle selecting mobs and other entities for /tp
    aliases: [tpentity, tpmob, teleportmob, tpm, tpe]
    permission: allium.tpmob
  help:
    description: List the commands you can use
    usage: /<command> [page|command|plugin] [page]
    permission: allium.help
  nick:
    description: Set or clear your nickname (or another player's)
    aliases: [nickname]
    permission: allium.nick
  channel:
    description: Join, leave or write to a chat channel
    aliases: [g, global, l, local, a, staffchat]
    permission: allium.channel
  delmsg:
    description: Delete a chat message for everyone
    aliases: [deletemsg]
  repair:
    description: Repair the held item, or your whole inventory
    usage: /<command> [hand|all]
    permission: allium.repair
  disposal:
    description: Open a trash bin that deletes what you put in
    usage: /<command>
    aliases: [trash, dispose]
    permission: allium.disposal
  workbench:
    description: Open a crafting table anywhere
    usage: /<command>
    aliases: [craft]
    permission: allium.workbench
  anvil:
    description: Open an anvil anywhere
    usage: /<command>
    permission: allium.anvil
  info:
    description: Show server information and the online count
    usage: /<command>
    permission: allium.info
  speed:
    description: Set your walk or fly speed
    usage: /<command> [walk|fly] <0..10|reset> [player]
    permission: allium.speed
  ping:
    description: Show your (or a player's) connection latency
    usage: /<command> [player]
    permission: allium.ping
  ext:
    description: Put out a burning player
    usage: /<command> [player]
    aliases: [extinguish]
    permission: allium.ext
  burn:
    description: Set a player on fire
    usage: /<command> <player> [seconds]
    permission: allium.burn
  smite:
    description: Strike a player with harmless lightning
    usage: /<command> <player>
    aliases: [lightning, strike]
    permission: allium.smite
  nv:
    description: Toggle night vision
    usage: /<command> [on|off] [player]
    aliases: [nightvision]
    permission: allium.nv
  clearinventory:
    description: Clear your (or a player's) inventory
    usage: /<command> [player] [material] [maxCount]
    aliases: [clear, ci]
    permission: allium.clearinventory
  more:
    description: Fill the held stack to its maximum
    usage: /<command> [amount] [player]
    permission: allium.more
  hat:
    description: Wear the held item on your head
    usage: /<command>
    permission: allium.hat
  skull:
    description: Get a player's head
    usage: /<command> [owner] [player]
    aliases: [head, playerhead]
    permission: allium.skull
  itemdb:
    description: Show the held item's ID and metadata
    usage: /<command> [player]
    aliases: [iteminfo]
    permission: allium.itemdb
  gc:
    description: Show TPS, memory, uptime and loaded worlds
    usage: /<command>
    aliases: [uptime, lag, tps]
    permission: allium.gc
  time:
    description: View, set, add to or pause world time
    usage: /<command> [set|add|pause] [value] [world|*]
    permission: allium.time
  day:
    description: Set the time to day
    usage: /<command> [world|*]
    permission: allium.time.set
  night:
    description: Set the time to night
    usage: /<command> [world|*]
    permission: allium.time.set
  weather:
    description: Set the weather to clear, rain or thunder
    usage: /<command> <clear|sun|rain|storm|thunder> [duration] [world|*]
    permission: allium.weather
  enchant:
    description: Add or remove enchantments on the held item
    usage: /<command> <enchantment> <level> [player]
    permission: allium.enchant
  heal:
    description: Restore health, hunger and remove effects
    usage: /<command> [player]
    permission: allium.heal
  feed:
    description: Fill hunger and saturation
    usage: /<command> [player]
    permission: allium.feed
  fly:
    description: Toggle flight
    usage: /<command> [player]
    permission: allium.fly
  toggleslowfall:
    description: Toggle slow falling when you lose flight
    usage: /<command> [on|off|status]
    aliases: [tsf, slowfalltoggle, toggleslowfalling]
    permission: allium.fly
  god:
    description: Toggle invulnerability
    usage: /<command> [player]
    permission: allium.god
  gamemode:
    description: Change gamemode (per-mode permission)
    usage: /<command> <mode> [player]
    aliases: [gm, gmc, gma, gms, gmsp, creative, survival, spectator, adventure]
    permission: allium.gamemode
  msg:
    description: Send a private message
    usage: /<command> <player> <message>
    aliases: [tell, w, whisper, m, t]
    permission: allium.msg
  reply:
    description: Reply to your last private message
    usage: /<command> <message>
    aliases: [r]
    permission: allium.reply
  ignore:
    description: Ignore a player, or list who you ignore
    usage: /<command> [player]
    permission: allium.ignore
  unignore:
    description: Stop ignoring a player
    usage: /<command> <player>
    permission: allium.ignore
  msgtoggle:
    description: Turn incoming private messages on or off
    usage: /<command> [on|off] [player]
    permission: allium.msgtoggle
  mail:
    description: Read and send mail, and send or claim item gifts
    usage: /<command> <read|send|gift|claim|delete|clear>
    permission: allium.mail
  socialspy:
    description: See private messages between other players
    usage: /<command> [on|off]
    permission: allium.socialspy
  messagesounds:
    description: Set the volume of private-message sounds
    usage: /<command> [volume <0-1>|toggle|reset]
    aliases: [msounds, mfx]
    permission: allium.messagesounds
  allium:
    aliases: [core]
    description: "Allium administration: reload, version, imports"
    usage: /<command> <reload|version|import lang [apply]|adopt-window [<duration>|off]|hide>
  give:
    description: Give vanilla, provider or Allium items
    usage: /<command> <player> <item[,item...]> [amount] [key:value...] [-e] [--overflow=drop|refuse|partial]
    permission: allium.give

  tpoffline:
    description: Teleport to where an offline player logged out
    aliases: [otp, offlinetp, tpoff]
    usage: /<command> <player>
    permission: allium.tp.offline
  tpa:
    description: Ask to teleport to a player
    permission: allium.tpa
  tpahere:
    description: Ask a player to teleport to you
    permission: allium.tpahere
  tpaccept:
    description: Accept a teleport request
    permission: allium.tpaccept
  tpdeny:
    description: Deny a teleport request
    permission: allium.tpdeny
  tpacancel:
    description: Cancel your outgoing teleport request
    permission: allium.tpacancel
  tptoggle:
    description: Allow or block teleport requests to you
    permission: allium.tptoggle
  back:
    description: Return to your previous location
    permission: allium.back
  spawn:
    description: Teleport to spawn
    permission: allium.spawn
  setspawn:
    description: Set the spawn point here
    permission: allium.setspawn
  tp:
    description: Teleport to a player or coordinates, or move a player
    permission: allium.tp
  tphere:
    aliases: [here, s]
    description: Teleport a player to you
    permission: allium.tphere

  sethome:
    description: Set a home here
    usage: /sethome

  home:
    description: Teleport to one of your homes
    usage: /home

  delhome:
    description: Delete one of your homes
    usage: /delhome

  homes:
    description: List your homes
    usage: /homes

  setwarp:
    description: Create or move a warp here
    usage: /setwarp

  warp:
    description: Teleport to a warp
    usage: /warp

  delwarp:
    description: Delete a warp
    usage: /delwarp

  warps:
    description: List the warps you can use
    usage: /warps

  kit:
    description: Claim a kit, or give one to a player
    usage: /<command> [name] [player]
    permission: allium.kit
  kits:
    description: List the kits you can claim
    usage: /<command>
    permission: allium.kits
  createkit:
    description: Save your inventory as a kit
    usage: /<command> <name> [cooldown] [once]
    permission: allium.createkit
  delkit:
    description: Delete a kit
    usage: /<command> <name>
    permission: allium.delkit

  vanish:
    description: Toggle vanish for yourself or another player
    usage: /<command> [on|off] [player]
    aliases: [v]
    permission: allium.vanish
  mute:
    description: Mute a player, optionally for a time
    usage: /<command> <player> [duration] [reason]
    permission: allium.mute
  unmute:
    description: Unmute a player
    usage: /<command> <player> [reason]
    permission: allium.unmute
  mutes:
    description: List active mutes
    usage: /<command>
    aliases: [mutelist]
    permission: allium.mute

  i:
    description: Give yourself an item
    usage: /<command> <item[,item...]> [amount] [key:value...] [-e] [--overflow=drop|refuse|partial]
    aliases: [item]
    permission: allium.give
  list:
    description: List online players by group
    usage: /<command>
    aliases: [online]
    permission: allium.list
  seen:
    description: Show when a player was last online
    usage: /<command> <player>
    permission: allium.seen
  whois:
    description: Show a player's UUID, names, status and staff details
    usage: /<command> <player>
    permission: allium.whois
  altexempt:
    description: Exempt an account from alt detection, or check it
    usage: /<command> <add|remove|check> <player> [reason]
    permission: allium.altexempt
  near:
    description: List players near you
    usage: /<command> [radius]
    permission: allium.near
  afk:
    description: Toggle AFK, with an optional message
    usage: /<command> [message]
    aliases: [away]
    permission: allium.afk

  kick:
    description: Kick a player with a reason
    usage: /<command> <player> [reason]
    permission: allium.kick

  ban:
    description: Ban a player permanently
    usage: /<command> <player> [reason]
    permission: allium.ban

  tempban:
    description: Ban a player for a set time
    usage: /<command> <player> <duration> [reason]
    permission: allium.tempban

  unban:
    description: Lift a player's ban
    usage: /<command> <player>
    permission: allium.unban
    aliases: [pardon]

  banlist:
    description: List active bans
    usage: /<command>
    permission: allium.banlist

  ipban:
    description: Ban a player's IP address
    usage: /<command> <player> [reason]
    permission: allium.ipban

  freeze:
    description: Freeze or unfreeze a player in place
    usage: /<command> <player> [on|off] [reason]
    permission: allium.freeze

  setjail:
    description: Create or move a jail here
    usage: /<command> <name>
    permission: allium.setjail

  jail:
    description: Send a player to a jail
    usage: /<command> <player> <jail> [reason]
    permission: allium.jail

  unjail:
    description: Release a player from jail
    usage: /<command> <player>
    permission: allium.unjail

  warn:
    description: Warn a player and record it
    usage: /<command> <player> [reason]
    permission: allium.warn

  notes:
    description: Read or add staff notes on a player
    usage: /<command> <player> [add <note>]
    permission: allium.notes

  invsee:
    description: View or edit a player's inventory, online or offline
    usage: /<command> <player>
    permission: allium.invsee

  enderchest:
    description: Open your ender chest, or view another player's
    usage: /<command> [player]
    aliases: [echest, ec]
    permission: allium.enderchest

  balance:
    description: Show your (or a player's) balance
    aliases: [bal]
    permission: allium.balance
  pay:
    description: Pay money to a player
    permission: allium.pay
  paytoggle:
    description: Allow or refuse incoming payments
    permission: allium.paytoggle
  eco:
    aliases: [money]
    description: Give, take or set player balances
    permission: allium.eco
  baltop:
    description: Show the richest accounts
    permission: allium.baltop

permissions:
  allium.*:
    description: All Allium permissions
    default: op
    children:
      allium.heal: true
      allium.heal.others: true
      allium.feed: true
      allium.feed.others: true
      allium.fly: true
      allium.fly.others: true
      allium.god: true
      allium.god.others: true
      allium.gamemode: true
      allium.gamemode.others: true
      allium.gamemode.survival: true
      allium.gamemode.creative: true
      allium.gamemode.adventure: true
      allium.gamemode.spectator: true
      allium.gamemode.creative.place: true
      allium.gamemode.creative.break: true
      allium.gamemode.creative.interact: true
      allium.gamemode.creative.use: true
      allium.gamemode.creative.drop: true
      allium.gamemode.creative.pickup: true
      allium.gamemode.creative.container: true
      allium.gamemode.creative.spawn: true
      allium.gamemode.creative.blacklist: true
      allium.gamemode.creative.inventory: true
      allium.gamemode.spectator.teleport: true
      allium.alerts: true
      allium.economy.*: true
      allium.mobdisarmer.use: true
      allium.mobdisarmer.bypass: true
      allium.phantomobliterator.use: true
      allium.phantomobliterator.bypass: true
      allium.treeaxe.use: true
      allium.give: true
      allium.give.privileged: true
      allium.socialspy: true
      allium.mail: true
      allium.mail.send: true
      allium.mail.gift: true
      allium.mail.bypass.limits: true
      allium.kit: true
      allium.kits: true
      allium.kit.others: true
      allium.createkit: true
      allium.delkit: true
      allium.vanish: true
      allium.vanish.others: true
      allium.vanish.see: true
      allium.mute: true
      allium.kick: true
      allium.ban: true
      allium.tempban: true
      allium.unban: true
      allium.banlist: true
      allium.ipban: true
      allium.freeze: true
      allium.setjail: true
      allium.jail: true
      allium.unjail: true
      allium.warn: true
      allium.notes: true
      allium.invsee: true
      allium.enderchest: true
      allium.enderchest.others: true
      allium.unmute: true
      allium.list: true
      allium.seen: true
      allium.whois: true
      allium.whois.location: true
      allium.whois.extra: true
      allium.whois.ip: true
      allium.seen.alts: true
      allium.seen.ip: true
      allium.altexempt: true
      allium.near: true
      allium.near.bypass-max: true
      allium.afk: true
      allium.repair: true
      allium.repair.all: true
      allium.disposal: true
      allium.workbench: true
      allium.anvil: true
      allium.info: true
      allium.speed: true
      allium.speed.others: true
      allium.ping: true
      allium.ping.others: true
      allium.ext: true
      allium.ext.others: true
      allium.burn: true
      allium.smite: true
      allium.nv: true
      allium.nv.others: true
      allium.clearinventory: true
      allium.clearinventory.others: true
      allium.more: true
      allium.more.others: true
      allium.hat: true
      allium.skull: true
      allium.skull.others: true
      allium.itemdb: true
      allium.itemdb.others: true
      allium.gc: true
      allium.time: true
      allium.time.set: true
      allium.time.add: true
      allium.time.pause: true
      allium.weather: true
      allium.enchant: true
      allium.enchant.others: true
      allium.reload: true
      allium.import: true
  allium.reload:
    description: Allows /allium reload
    default: op
  allium.import:
    description: Allows /allium import (pre-recode data imports; dry run unless 'apply')
    default: op
  allium.adoptwindow:
    description: Allows /allium adopt-window (adopt pre-recode privileged tools on first use for a short time). No one has it by default, so only the console can use it.
    default: false
  allium.treeaxe.use:
    description: Lets the Lazy Axe fell whole trees (the pre-recode node)
    default: true
  allium.mail:
    description: Allows /mail read, claim, delete and clear for your own mailbox
    default: true
  allium.mail.send:
    description: Allows /mail send (text mail to online and offline players)
    default: true
  allium.mail.gift:
    description: Allows /mail gift (send the held item by mail)
    default: true
  allium.mail.bypass.limits:
    description: Sends past the mailbox size and rate limit
    default: op
  allium.socialspy:
    description: Allows opting into social spy; only delivered messages between others are shown
    default: op
  allium.socialspy.exempt:
    description: Hides all traffic involving this player from social spy and optional console PM logging. Explicit only.
    default: false
  allium.messagesounds:
    description: Allows /messagesounds (/msounds, /mfx) for your own message sound volume
    default: true
  allium.msg:
    description: Allows /msg
    default: true
  allium.reply:
    description: Allows /reply
    default: true
  allium.ignore:
    description: Allows /ignore and /unignore
    default: true
  allium.msgtoggle:
    description: Allows /msgtoggle for yourself
    default: true
  allium.msgtoggle.others:
    description: Allows /msgtoggle for other players
    default: op
  allium.msg.color:
    description: Lets & colour and formatting codes in private messages take effect
    default: op
  allium.msg.hex:
    description: Lets hex colours in private messages take effect
    default: op
  allium.msg.gradient:
    description: Lets gradient and rainbow tags in private messages take effect
    default: op
  allium.vanish:
    description: Allows /vanish for yourself
    default: op
  allium.vanish.others:
    description: Allows /vanish for other players
    default: op
  allium.vanish.see:
    description: See vanished players (world, tab list, messages, tab completion)
    default: op
  allium.vanish.container.live:
    description: Lets vanished players open containers live (read-write) instead of a silent read-only mirror. Explicit only; emits chest lid animation, sound, and trapped-chest redstone.
    default: false
  allium.mute:
    description: Allows /mute and /mutes
    default: op
  allium.unmute:
    description: Allows /unmute
    default: op
  allium.msg.bypass.toggle:
    description: Message players who turned messages off. Explicit only; not given to ops or allium.*
    default: false
  allium.msg.bypass.ignore:
    description: Message players who ignore you. Explicit only; not given to ops or allium.*
    default: false
  allium.heal:
    description: Allows use of /heal
    default: op
  allium.heal.others:
    description: Allows healing other players
    default: op
  allium.feed:
    description: Allows use of /feed
    default: op
  allium.feed.others:
    description: Allows feeding other players
    default: op
  allium.fly:
    description: Allows use of /fly
    default: op
  allium.fly.safelogin:
    description: Enable flight when joining in midair outside water
    default: false
  allium.fly.others:
    description: Allows toggling flight for other players
    default: op
  allium.god:
    description: Allows use of /god
    default: op
  allium.god.others:
    description: Allows toggling god mode for other players
    default: op
  allium.gamemode:
    description: Allows use of /gamemode
    default: op
  allium.gamemode.others:
    description: Allows changing others gamemodes
    default: op
  allium.gamemode.survival:
    description: Switch to survival mode with /gamemode
    default: op
  allium.gamemode.creative:
    description: Switch to creative mode with /gamemode
    default: op
  allium.gamemode.adventure:
    description: Switch to adventure mode with /gamemode
    default: op
  allium.gamemode.spectator:
    description: Switch to spectator mode with /gamemode
    default: op
  allium.gamemode.creative.place:
    description: Place blocks in creative mode
    default: op
  allium.gamemode.creative.break:
    description: Break blocks in creative mode
    default: op
  allium.gamemode.creative.interact:
    description: Use doors, beds, containers by click, item frames, armor stands, food, potions and projectiles in creative mode
    default: op
  allium.gamemode.creative.use:
    description: Take items from the creative inventory menu
    default: op
  allium.gamemode.creative.drop:
    description: Drop items in creative mode
    default: op
  allium.gamemode.creative.pickup:
    description: Pick up items in creative mode
    default: op
  allium.gamemode.creative.container:
    description: Open containers (chests, ender chests, furnaces, crafting) in creative mode
    default: op
  allium.gamemode.creative.spawn:
    description: Use spawn eggs in creative mode
    default: op
  allium.gamemode.creative.blacklist:
    description: Bypass creative-manager.blacklist
    default: op
  allium.gamemode.creative.inventory:
    description: Keep one shared inventory across gamemodes (no separate creative inventory)
    default: op
  allium.gamemode.spectator.teleport:
    description: Teleport to players from the spectator menu
    default: op
  allium.alerts:
    description: Receive security alerts (gamemode audits, alt-account notices)
    default: op
  allium.give:
    description: Allows /give (M1 item-library harness)
    default: op
  allium.give.privileged:
    description: Allows /give to mint privileged items such as handcuffs
    default: op
  allium.mobdisarmer.use:
    description: Allows using a Mob Disarmer
    default: true
  allium.mobdisarmer.bypass:
    description: Mob Disarmer uses spend no charges and never break
    default: op
  allium.phantomobliterator.use:
    description: Allows using a Phantom Obliterator
    default: true
  allium.phantomobliterator.bypass:
    description: Phantom Obliterator uses spend no charges and never break
    default: op

  allium.tpa:

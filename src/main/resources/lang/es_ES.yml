    - "[sound] block.note_block.bass 0.85"
  mute-self:
    - "{prefix} &cNo puedes silenciarte a ti mismo."
    - "[sound] block.note_block.bass 0.8"
  mute-blocked:
    - "{prefix} &cEstas silenciado (&f{remaining}&c restantes). Razon: &f{reason}"
    - "[sound] entity.villager.no 0.9"
  mutes-empty:
    - "{prefix} &7No hay silencios activos."
    - "[sound] block.note_block.hat 0.95"

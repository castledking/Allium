name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      - name: Install vendored dependencies
        run: libs/install.sh

      - name: Build with Maven
        run: mvn install -DskipTests -B

      - name: Upload Allium.jar
        uses: actions/upload-artifact@v4
        with:
          name: Allium
          path: target/Allium.jar

  # Allium compiles against a newer Paper API than the oldest server it supports, so it can
  # name a member that no longer exists on an older server and still compile. The failure only
  # shows up at runtime, in whichever code path touches that member first - a /cards give on a
  # 1.21 server died inside a card frame that way, with no compile error and no test failure.
  #
  # This resolves each supported Paper API and checks every server-API call in the compiled
  # bytecode against it, descriptors included. Descriptor-exact because a name-only check
  # passes the case that actually bit: Adventure 5 re-bounded ComponentBuilder, so build()
  # exists on both generations under the same name with two different return descriptors.
  #
  # Add a Paper version here when you intend to support it. Anything listed must pass.
  api-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper:
          # 1.21.8 is the oldest Paper with the dialog APIs Allium uses; 1.21.6 and 1.21.4 are
          # missing PlayerCustomClickEvent, DialogResponseView and PlayerGameConnection, so they
          # are not supported. Raise this floor only once the audit passes for them.
          - '1.21.8-R0.1-SNAPSHOT'
          - '1.21.9-R0.1-SNAPSHOT'
          - '1.21.10-R0.1-SNAPSHOT'
          - '1.21.11-R0.1-SNAPSHOT'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      - name: Install vendored dependencies
        run: libs/install.sh

      - name: Build with Maven
        run: mvn install -DskipTests -B

      # The API Allium compiles against, taken from its own dependency tree so the audit
      # cannot drift from what the build actually used.
      - name: Resolve the compiled-against API
        id: baseline
        run: |
          mvn -B -q dependency:build-classpath \
            -Dmdep.outputFile=target/baseline-cp.txt -Dmdep.includeScope=compile
          echo "jars=$(cat target/baseline-cp.txt)" >> "$GITHUB_OUTPUT"

      # Resolved rather than pinned. Each Paper build bundles its own Adventure - 1.21.8 ships
      # 4.24, 1.21.10 ships 4.25, 1.21.11 ships 4.26 - and which one it is decides whether the
      # bytecode links at all. Letting Maven answer keeps that from being a list to maintain.
      - name: Resolve the supported server's API
        id: target
        run: |
          mkdir -p target/compat
          cat > target/compat/pom.xml <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>codes.castled.allium</groupId>
            <artifactId>compat-probe</artifactId>
            <version>1</version>
            <packaging>pom</packaging>
            <repositories>
              <repository>
                <id>papermc</id>
                <url>https://repo.papermc.io/repository/maven-public/</url>
              </repository>
            </repositories>
            <dependencies>
              <dependency>
                <groupId>io.papermc.paper</groupId>
                <artifactId>paper-api</artifactId>
                <version>PAPER_VERSION</version>
              </dependency>
            </dependencies>
          </project>
          POM
          sed -i "s/PAPER_VERSION/${{ matrix.paper }}/" target/compat/pom.xml
          mvn -B -q -f target/compat/pom.xml dependency:build-classpath \
            -Dmdep.outputFile=target/compat-cp.txt || {
            echo "::error::could not resolve paper-api ${{ matrix.paper }}"
            exit 1
          }
          echo "jars=$(cat target/compat-cp.txt)" >> "$GITHUB_OUTPUT"

      - name: Audit against ${{ matrix.paper }}
        run: |
          python3 tools/api_compat_audit.py \
            --classes target/classes \
            --baseline "${{ steps.baseline.outputs.jars }}" \
            --target "${{ matrix.paper }}:${{ steps.target.outputs.jars }}"

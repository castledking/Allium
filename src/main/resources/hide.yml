############################################################
# +------------------------------------------------------+ #
# |                     Hide Config                      | #
# +------------------------------------------------------+ #
############################################################
# Here you can configure the hidden commands.
# You can use the following formats:
# - command
# - <plugin>:*
# - ^ (uses commands list)
# - * (all commands)
# Vault is required.
# For more information, visit: https://github.com/castledking/Allium

settings:
  enabled: true
  block-namespaced-commands-for-ops: false
  hide-namespaced-commands-for-ops: false
  # Helper line the client shows above the chat box while typing a command that
  # does not exist (vanilla: "Unknown or incomplete command. See below for error").
  # The client draws this itself, so Allium ships it as a resource pack language
  # override. With ResourcePackManager installed the pack is dropped into its mixer
  # folder (run /rspm reload after changing this); otherwise it is written to
  # plugins/Allium/generated/ for you to merge into your server resource pack.
  # Colors: & codes and MiniMessage. Hex colors are rounded to the nearest of the
  # 16 standard colors, because language files cannot display hex.
  # The client appends " at position 1: /<--[HERE]" in the last color used.
  # Set to "" to keep the vanilla message.
  unknown-command-completion-help-message: "&c&lERROR &8» &7Unknown command. Type &c/help &7for a list of commands."
  # Remove unsafe commands from the DECLARE_COMMANDS packet sent to clients on join.
  # This prevents hacked clients/mods from enumerating commands like /version, /plugins, /pl, etc.
  remove-unsafe-commands: true
  unsafe-commands-list:
    - "bukkit:plugins"
    - "bukkit:version"
    - "version"
    - "plugins"
    - "bukkit:help"
    - "bukkit:pl"
    - "pl"
    - "bukkit:?"
    - "?"
    - "bukkit:me"
    - "me"
    - "bukkit:tell"
    - "tell"
    - "bukkit:msg"
    - "msg"
    - "bukkit:w"
    - "w"
    - "bukkit:r"
    - "r"
  # Filter plugin-prefixed commands from the tab-completion suggestion protocol.
  # This prevents hacked clients/mods (like LiquidBounce) from enumerating plugins
  # by requesting tab completions for "/" and parsing "pluginname:command" patterns.
  #
  # Behavior mirrors Pl-Hide-Pro:
  #   - Responses to a bare "/" request are cancelled entirely (the hack-client
  #     probe then times out instead of receiving a command list).
  #   - EVERY namespaced suggestion ("plugin:command") is stripped unless listed
  #     in allow-namespaced-suggestions below - unknown namespaces such as
  #     "jbt:*" can never leak regardless of this blocklist.
  #   - Plain suggestions additionally respect command-suggestion-filters and
  #     the group visibility rules below (groups -> tabcompletes).
  #   - If filtering removes every suggestion, the empty response is cancelled
  #     instead of being sent.
  filter-command-suggestions: true
  cancel-bare-slash-request: true
  cancel-unknown-suggestion-responses: true
  allow-namespaced-suggestions: []
  command-suggestion-filters:
    - "essentials:"
    - "worldedit:"
    - "worldguard:"
    - "luckperms:"
    - "vault:"
    - "griefprevention:"
    - "coreprotect:"
    - "dynmap:"
    - "dynmap-"
    - "placeholderapi:"
    - "multiverse-"
    - "multiverse:"
    - "citizens:"
    - "mythicmobs:"
    - "mythicdungeons:"
    - "job"
    - "shop"
    - "auction"
    - "economy"
    - "vault:"
    - "permission"
    - "perm"
    - "luckperms"
    - "groupmanager"
    - "pex:"
    - "bungee:"
    - "velocity:"
    - "bungeecord:"
    - "via:"
    - "viaversion:"
    - "viabackwards:"
    - "viadown:"
    - "protocol"
groups:
  op: # (allium.hide.bypass permission)
    whitelist: true
    commands:
      - "*"
    tabcompletes:
      - ^
  admin:
    whitelist: true
    commands:
      - "essentials:*"
      - "worldedit:*"
      - op
      - deop
    tabcompletes:
      - ^

  moderator:
    whitelist: false
    commands:
      - op
      - deop
    tabcompletes:
      - ^

  default:
    whitelist: true
    commands:
      - tpa
      - tpahere
      - help
      - tpaccept
      - tpdeny
      - tpyes
      - tpno
      - tpcancel
      - tptoggle
      - spawn
      - back
      - msg
      - reply
      - r
      - party
      - mail
    tabcompletes:
      - ^

  # Alt accounts - blacklist mode: listed commands are blocked for alt accounts
  # whitelist=false means these commands are BLOCKED (blacklist)
  # whitelist=true means ONLY these commands are allowed
  alt:
    whitelist: false
    commands:
      - pay
      - jobs
      - quests
      - tasks
      - ah
      - auctionhouse
    tabcompletes:
      - ^

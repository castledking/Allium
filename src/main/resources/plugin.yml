  allium.tpahere:
    default: true
  allium.tpaccept:
    default: true
  allium.tpdeny:
    default: true
  allium.tpacancel:
    default: true
  allium.tptoggle:
    default: true
  allium.back:
    default: true
  allium.spawn:
    default: true
  allium.setspawn:
    default: op
  allium.tp:
    default: op
  allium.tphere:
    default: op
  allium.tp.others:
    default: op
  allium.tptoggle.others:
    default: op
  allium.teleport.unsafe:

# ============================================================
#  Allium Trading Cards
# ============================================================
# Mob trading cards: dropped by the mobs they depict, levelled by
# playing, and traded in for that mob's head.
#
# Card definitions live in tradingcards/cards.yml. Reload with
# /tradingcards reload — an invalid entry is reported and skipped
# rather than stopping the rest of the file from loading.

enabled: true

# ------------------------------------------------------------
# Card levels.
#
# A dropped card starts at 0 and a merged card lands at 0 too, so
# merging converts spare cards into progress rather than granting a
# head start. Levels are per mob AND per tier: a FABLED chicken at
# level 34 shares no experience with a SIMPLE chicken at level 34.
#
# Only the three SIGNATURE boosts grow with level. The bonus boosts
# are a drop-time gamble, frozen once rolled — otherwise levelling
# could re-roll them and grant boosts the drop never awarded.
# ------------------------------------------------------------
levelling:
  start-level: 0
  maximum-level: 100

  # Each level adds this to ONE signature boost, chosen at random.
  # Not all three: a card that grew evenly would be interchangeable
  # with any other card at the same level, and there'd be no reason
  # to keep levelling this one rather than another.
  boost-per-level: 1.0

  # How many signature boosts grow per level. 2 makes levelling a
  # different gamble (which two) rather than a slower one.
  boosts-per-level: 1

  # The rule between lore sections. Rendered dark grey with a strikethrough,
  # which is what the design uses. Nine characters wide, trimmed from the
  # 200px of the source art to fit the tooltip without the ends being clipped.
  lore-separator: "─────────────"

  # How many bonus slots a card shows. Independent of how many bonuses a drop
  # actually rolls (boosts.yml roll.count): the card shows its full potential
  # so a player can see what is still locked, then fills in one slot per reroll.
  lore-bonus-slots: 5

  # Width of the XP bar on the level row, in characters. Sized by hand against
  # the card's own layout — it is deliberately much narrower than the lore
  # separator above and below it, so the three read as different rows. Tuned
  # with /tradingcards reload rather than a rebuild.
  xp-bar-width: 10

  # XP needed to go from level N to N+1. Flat early, steep late.
  curve:
    type: PIECEWISE
    breakpoints:
      10: 25
      25: 120
      50: 600
      75: 2400
      100: 9000

  # Chat, not a title or action bar: levelling is a persistent fact
  # about an item, so it belongs in the log where a player can scroll
  # back to it. The "40 -> 41" pair is the part that earns its
  # place — watching a number tick is most of the appeal.
  announce:
    enabled: true
    sound: ENTITY_PLAYER_LEVELUP
    # Owner only. At scale a server-wide broadcast of every card level
    # is pure noise; a busy server fires these constantly.
    broadcast: false
    # <card> is the card's own name, so a renamed card announces under
    # the name its owner gave it.
    message: "<gradient:#d4a04a:#8a5a2a>[Cards]</gradient> <yellow>Your <card> is now level <green><level></green>! <dark_green><previous></dark_green> <white>→</white> <green><level></green>"
    # Sent to the owner when a card goes into /reliques. <card> is the card's
    # title as its lore shows it, colour included; <tier> and <level> are plain.
    # Set to "" to send nothing.
    equip-message: "<gradient:#d4a04a:#8a5a2a>[Cards]</gradient> <yellow>Equipped <card><yellow>, its boosts are now active."

# ------------------------------------------------------------
# The 1..100 quality roll.
#
# One roll per card, partitioned across these bands. The loader
# REJECTS a config whose bands leave a gap or overlap, because a
# quality with no band would have no colour, no head payout, and no
# name in its lore — a silent failure, so it's an error not a
# warning.
#
# Quality is stored on the card as a plain integer, never as a band
# name, and the band is derived on read. Move a boundary and existing
# cards relabel themselves correctly; storing the name would freeze
# them into whatever the bands were the day they dropped.
#
# `heads` is what a card in that band trades for. Eight stages
# dividing into eight is why the ladder has eight bands.
# ------------------------------------------------------------
quality:
  bands:
    # `boost` is the range each STARTING boost is rolled from. It is derived
    # from the card's identity, not stored, so rebalancing a range moves every
    # card in that band at once — which is the point of tuning a ladder.
    rotten:    { min: 1,   max: 5,   heads: 1, colour: "<dark_gray>", boost: [1, 2] }
    damaged:   { min: 6,   max: 15,  heads: 1, colour: "<gray>",      boost: [2, 3] }
    torn:      { min: 16,  max: 25,  heads: 2, colour: "<dark_red>",  boost: [3, 4] }
    okay:      { min: 26,  max: 45,  heads: 3, colour: "<white>",     boost: [4, 5] }
    fine:      { min: 46,  max: 65,  heads: 5, colour: "<yellow>",    boost: [5, 6] }
    great:     { min: 66,  max: 85,  heads: 6, colour: "<green>",    boost: [6, 7] }
    mint:      { min: 86,  max: 99,  heads: 7, colour: "<aqua>",     boost: [7, 9] }
    emaculate: { min: 100, max: 100, heads: 8, colour: "<gold>",      boost: [7, 11] }

# ------------------------------------------------------------
# Trading a card in for its mob's head.
# ------------------------------------------------------------
# ------------------------------------------------------------
# Trading a card in for its mob's head. Right-click a card in your
# inventory to open the menu.
#
# The payout is NOT a percentage of anything — it is the `heads` value
# of the band the card's quality falls in, looked up as it stands at
# trade time. So a 92% card pays the `mint` value (7 heads) and a 100%
# card pays 8. That is deliberately a lookup rather than a formula:
# rebalancing the ladder above is an edit to the band table, and a
# card's value can never disagree with the number its own lore shows.
#
# Because the band is derived from the stored integer, moving a boundary
# changes what existing cards pay. That is intended.
# ------------------------------------------------------------
trade:
  enabled: true

  # Where the payout comes from. Trading cards are exchanged for the mob's
  # SPAWNER HEAD — Allium's own head item from spawner_heads.yml, not a plain
  # vanilla skull. A card can also name its own head item; that wins when set.
  #
  #   SPAWNER_HEADS  - Allium's spawner_heads.yml mob head  [default]
  #   CARD_ITEM      - only the card's own `head:` reference; mobs with no
  #                   explicit head simply cannot be traded
  #
  # SPAWNER_HEADS is the default because those heads already have a use (they
  # craft spawner cores and plushies), so trading a card in feeds that
  # progression rather than creating a second currency.
  head-source: SPAWNER_HEADS

  # Show each band's head payout on the quality ladder in the card menu.
  #
  # Off by default. The payout is not committed to when the menu opens — the
  # trade window is where the card is deposited and confirmed, and the heads
  # are only built then — so a "worth 7 heads" line on the card would be a
  # quote the next click could contradict. Turning it on is a deliberate
  # trade: players get planning information at the cost of a figure that a
  # reload between the two clicks can change.
  show-worth: false

  # Refuse cards below the `mint` band, so the trash end of the ladder
  # cannot be sold. Off by default: a rotten card is still a card, and
  # one head for one is a fine floor.
  require-mint-or-better: false

  # Consume the card when the trade is confirmed. Turning this off makes the
  # head a pure bonus with no card cost, so every card becomes infinitely
  # tradeable for heads — leave it on unless the card is the scarce part.
  consume-card: true

# ------------------------------------------------------------
# Rerolling. Progressive pricing, never flat.
#
# A flat fee makes "reroll forever" the optimum; a linear fee makes
# the last few rerolls affordable to anyone who saved up. Each
# reroll costs more than the last, so every one trades money for a
# diminishing chance at a better roll.
#
#   #1 2k  #2 3k  #3 5k  #4 8k  #5 13k  #6 21k  #7 33k  #8 53k
#
# A reroll does two things: it may unlock a NEW signature boost, and
# failing that it re-rolls the card's bonus boosts. It never
# REPLACES a signature, so every reroll leaves the card strictly
# better or unchanged — the price buys additive value, not a gamble
# that might take something away.
# ------------------------------------------------------------
bonus-slot-roll:
  # A bonus slot is rolled on its own, for its own price, rather than
  # as a side effect of a reroll. The card always shows every
  # slot it could ever have: one opens per tier, so a SIMPLE card
  # has one to roll and a FABLED one has all five. An open slot with
  # nothing in it reads "Empty!" and costs this to fill.
  enabled: true

  # Low, because a card drops with NO bonus slots filled and the tier pool is
  # still small — at 2000 the first roll read as a tax rather than a choice. The
  # escalation is what stops it being a bargain, not the starting figure.
  cost: 500.0

  # Each roll of a slot costs more than the last, the same way a reroll
  # does. The menu always shows the NEXT price, so the player commits
  # knowing it.
  escalation: 1.35
  round-to: 100

  # A tier multiplier, so filling every slot on a Fabled card costs
  # more than on a SIMPLE one. That is the point of the ladder.
  tier-multipliers:
    SIMPLE: 1.0
    ELITE: 1.5
    ULTIMATE: 2.0
    LEGENDARY: 3.0
    FABLED: 5.0

# ------------------------------------------------------------
reroll:
  enabled: true
  base-cost: 2000.0
  escalation: 1.6
  round-to: 100
  maximum-cost: 500000.0

  # A tier multiplier on top, so a FABLED reroll isn't merely the
  # same price one step further along the ladder.
  tier-multipliers:
    SIMPLE: 1.0
    ELITE: 1.5
    ULTIMATE: 2.0
    LEGENDARY: 3.0
    FABLED: 5.0

  # Chance a reroll unlocks a new signature rather than re-rolling
  # bonuses. 0.35 means roughly 3 unlocks across 10 rerolls.
  signature-unlock-chance: 0.35

  # How many signatures a card may ever hold. 3 is where every card
  # starts, so this is the ceiling, not a starting count.
  maximum-signatures: 6

  # Once the signature pool is exhausted, a reroll re-rolls the bonus
  # boosts the card ALREADY holds. It never fills an empty slot and never
  # mints a bonus the player has not paid for — those are bought in the
  # bonus menu — so a card with no bonuses has nothing here to re-roll and
  # is pointed at that menu instead.
  #
  # Set false to refuse and refund outright.
  allow-bonus-only-when-full: true

  # The signature pool a reroll may unlock from, per tier.
  #
  # ONLY integer-incrementable boosts belong here. Levelling adds
  # +1 to one signature per level, so every signature needs a unit
  # that +1 means something in. `transmit-range` qualifies because
  # it is literally blocks; `scale` does not, because "+0.1x player
  # scale" is not a quantity and its 0.6-1.9 clamp means nothing
  # under flat addition.
  signature-pool:
    SIMPLE:    [ health, toughness, wisdom ]
    ELITE:     [ health, toughness, wisdom, crit-chance ]
    ULTIMATE:  [ health, toughness, wisdom, crit-chance, regeneration, armor ]
    LEGENDARY: [ health, toughness, wisdom, crit-chance, regeneration, armor,
                 crit-damage, haste, knockback ]
    FABLED:    [ health, toughness, wisdom, crit-chance, regeneration, armor,
                 crit-damage, haste, knockback, transmit-range, jump-height ]

  # Amounts for boosts a reroll can unlock, and the three every card
  # drops with. The "(+n)" in a card's lore is its total minus this.
  signature-amounts:
    luck: 5.0
    strength: 5.0
    speed: 3.0
    health: 2.0
    toughness: 2.0
    wisdom: 3.0
    regeneration: 2.0
    crit-chance: 1.0
    crit-damage: 2.0
    haste: 0.5
    armor: 1.0
    knockback: 0.05
    jump-height: 0.1
    transmit-range: 48.0

# ------------------------------------------------------------
# Merging: two cards of the same mob at maximum level of the same
# tier become one card of the NEXT tier at level 0.
#
# Level 0 is deliberate. A dropped card also starts at level 0, so a
# merged card is worth exactly what a fresh drop of the next tier
# would be worth — merging converts SPARE cards into progress rather
# than granting a head start. Landing anywhere above a natural drop
# would make merging a better source than killing the mob, and
# players would farm duplicates instead of playing.
#
# All three conditions are checked — same mob, same tier, both at
# maximum — and a refusal names which one failed. A vague refusal is
# how a merge feature loses player trust: someone merges two cards,
# gets a confusing result, and never tries again.
# ------------------------------------------------------------
merge:
  enabled: true
  require-same-mob: true
  target-level: 0

# ------------------------------------------------------------
# Morphing.
#
# /morph turns you into the mob on your EQUIPPED card. The
# disguise itself is cosmetic: LibsDisguises changes packets only,
# so the server still treats you as a player in every mechanical
# sense. Anything that makes a morph BEHAVE like a mob — aggro,
# flight, breaking at low health — is implemented by Allium and
# governed by the fields below.
#
# LibsDisguises is premium, so Allium talks to it reflectively and
# needs nothing on the classpath. On the free version the disguise
# is visible to you only, which is still worth having; premium
# shows it to everyone, which is what makes the mob aggro below
# legible to the mobs involved.
# ------------------------------------------------------------
morph:
  enabled: true

  # Lowest tier that may morph. FABLED is the intended gate: morphing
  # is the reward for having merged all the way up.
  minimum-tier: FABLED

  # 0 is a toggle that lasts until the player runs /morph again,
  # quits, or drops below the health floor below.
  duration: 0

  # A morphed player under this health drops the morph. 0 disables
  # the check. There is no Bukkit event for "health crossed a
  # threshold", so this is polled once a second while anyone is
  # morphed rather than hooked.
  deactivate-below-health: 0.0

  # Flight for mob types that fly. The most abusable thing in the
  # set, so it is opt-in and per-mob: parrots, bees, phantoms,
  # ghasts, vexes and allays, and nothing else.
  allow-flight: false

  # A morphed player shaped like a hostile is not a target until
  # they strike first. The mobs that witness the attack converge;
  # mobs that spawn later have no memory of an event they never saw,
  # which is what makes this read as vanilla rather than as an
  # invincibility button.
  #
  # Named vindicators and evokers are exempt outright — Johnny is a
  # vanilla pacifist, and a morph should not start a fight its
  # wearer did not ask for.
  stealth-until-attacked: true

  # Passed to LibsDisguises. Leave this true. Setting it false stops
  # LibsDisguises cancelling the targeting event for disguised
  # entities, which makes the morphed player invisible to mob AI
  # entirely — the opposite of the point of the feature.
  mobs-target-disguised: true

# ------------------------------------------------------------
# Card experience.
#
# Xp goes to the EQUIPPED card, not a card in your inventory. Levels
# are per mob AND per tier, so a FABLED chicken at 34 shares nothing
# with a SIMPLE chicken at 34. That is what makes merging the only way
# up the tier ladder, and therefore what gives merging a purpose
# beyond tidying inventory.
#
# Xp to go from level N to N+1. Flat early so the first levels arrive
# fast enough to be interesting, steep late so the last are a project.
# Five rows describe a hundred levels: a level with no entry inherits
# the next one's cost.
# ------------------------------------------------------------
xp:
  curve:
    10: 25
    25: 120
    50: 600
    75: 2400
    100: 9000

  # Every source is independent and can be switched off on its own.
  # A source whose plugin is absent is skipped and logged once, never
  # an error — a server without ExcellentQuests should not have to
  # delete its config to make the rest of the file quiet.
  #
  # `xp` is a flat award. `multiplier` scales the event's OWN value
  # instead; a source uses one or the other, never both, because adding
  # a flat amount to a plugin's xp is not a thing anybody can reason
  # about.
  sources:
    kill-mob:
      enabled: true
      xp: 4

    # Once per mob type, so a chicken farm does not put cows on
    # cooldown and a player is not locked out of breeding entirely.
    breed-mob:
      enabled: true
      xp: 40
      per-mob-cooldown: true
      per-mob-cooldown-duration: 7d

    # Allium's own crop event, so custom crops pay out alongside
    # vanilla ones with no second listener and no toggle.
    farm-crop:
      enabled: true
      xp: 2

    # Once each. Without the once-each claim an advancement is a
    # repeatable xp fountain: it can be re-triggered by redoing its
    # steps, and a player who notices will redo them all.
    advancement:
      enabled: true
      xp: 20

    # Needs the patched ExcellentQuests build in tradingcardjars/ — the
    # released plugin has no quest-completion event at all, so this source
    # cannot fire against it. Allium registers reflectively, so it loads
    # fine without ExcellentQuests; the source simply never triggers.
    quest-complete:
      enabled: true
      xp: 25

    # Fires on ACTIVATION, not on effect, so an ability that misses still
    # pays. The card is paying for practice with the skill, not for damage
    # dealt, and a miss-based reward would penalise abilities whose value is
    # not damage at all.
    auraskills-ability:
      enabled: true
      xp: 3
      # A short cooldown, because a high-mana build can otherwise level a card
      # purely by chaining abilities — which would make mana the only xp worth
      # having.
      cooldown: 30s

    # EcoJobs pays a MULTIPLE of the job's own experience rather than a flat
    # amount. The event fires once per counter acceptance, not once per action,
    # so counting events would pay more for a job that merely has more triggers
    # configured. Scaling the plugin's own figure means it has already decided
    # what the work was worth.
    ecojobs-work:
      enabled: true
      multiplier: 1.5
      # AFK and creative are already filtered by EcoJobs before the event
      # fires, so they are not re-checked here.

    # LiteFish has no isLarge() — its bands are a percentage within a species'
    # OWN range, so a 12.4kg cod and a 12.4kg salmon are not the same
    # achievement, and the boundaries live in a config this plugin would have
    # to parse. So "large" is measured against the player's own recent catches
    # for that species instead.
    #
    # The trade: "large" means large FOR YOU, not large absolutely. A player
    # who has only landed 1kg sardines finds 2kg sardines large. That is the
    # point — the reward is for a player showing progress on their own fishing,
    # and a fixed table would make the early game unrewarding and the late
    # game trivial.
    fish-large:
      enabled: true
      xp: 12
      # Recent catches remembered per species. Bounded so a year of fishing
      # does not grow an unbounded list, and small enough that the sample stays
      # responsive to a change in what the player is landing.
      max-samples: 40
      # The share of the player's own sample a catch must reach. 0.75 is the
      # top quarter.
      minimum-percentile: 0.75
      # Catches needed before anything can count. Below this the first fish of
      # a species would always look enormous against a sample of one.
      minimum-samples: 8

# ------------------------------------------------------------
# Crafting: 8 heads of one mob around a paper.
#
# OFF BY DEFAULT, and the reason matters: heads buy cards and cards
# buy heads. Turn both on with bound: false and you have built a money
# printer — 8 heads become a card, which buys back 8 heads, forever.
# `bound: true` stamps crafted cards so the trade-in refuses them.
#
# This is off by default also because it competes with the drop rate.
# With it off, a card is something you earn by playing.
# ------------------------------------------------------------
crafting:
  enabled: false
  result-tier: SIMPLE
  result-level: 0

  # Crafting bypasses the quality roll: a crafted card has no
  # condition and reads as a clean card.
  result-quality: emaculate

  consume: true
  bound: true

  # Which heads count as ingredients. allium: true is Allium's own
  # drops (recognised by note_block_sound); datapack: true is the
  # "More Mob Heads" datapack (recognised by item_name). Both true
  # doubles the ingredient supply wherever the datapack overlaps
  # the card roster, so watch that combination.
  #
  # vanilla-skulls is false deliberately: a plain creeper head is
  # craftable and untradeable, so allowing it hands out cards for a
  # resource with no sink.
  accept:
    allium: true
    datapack: true
    vanilla-skulls: false

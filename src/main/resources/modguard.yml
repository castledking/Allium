# ModGuard: spots modified clients from what they tell the server (their brand, plugin channels,
# and the mod lists Forge and Lunar Client send) and, with PacketEvents, from a sign translation
# probe that checks which mods' keybinds and texts the client knows. Clients can hide or fake all
# of this, so treat a detection as strong evidence, not proof.
#
# Operators are never checked. Players with the bypass permission are not checked either.
# On its first start ModGuard takes legacy Allium's settings from modguard/config.yml and
# modguard/rules.yml (or the modguard section of config.legacy.yml).

# Turn detection on or off. The module itself is modules.modguard in config.yml.
enabled: true

# Staff with this permission get alerts in chat; the console always gets them.
staff-permission: modguard.notify
bypass-permission: modguard.bypass

alerts:
  # INFO, WARNING or CRITICAL: alerts for detections at least this severe. One alert per mod
  # per session; reconnecting allows a new one.
  minimum-severity: WARNING

# {player}, {mod}, {rule} and {severity} are filled in.
staff-alert: '&7[&c&lModGuard&7] &e{player} &7was disconnected for using: &c{mod}'
kick-message: |-
  &c&lMODIFIED CLIENT DETECTED

  &7You cannot join with these mods installed:
  &c{mod}

  &7Please disable or remove them, then reconnect.

access-control:
  # Disconnect players for WARNING and CRITICAL detections. Operators and bypass holders stay.
  enabled: true
  # AUTO uses the proxy when spigot.yml's bungeecord setting is on, so the player leaves the whole
  # network; PROXY always does; SERVER only kicks from this server. For Velocity, use PROXY and
  # turn on bungee-plugin-message-channel on the proxy.
  disconnect-mode: AUTO
  # Per rule id: allow-join true lets players with that mod join. Rules not listed here let
  # players join only for INFO detections.
  mods:
    freecam:
      allow-join: false
    meteor:
      allow-join: false
    tweakeroo:
      allow-join: false

# Lunar Client tells servers its installed mods when asked over its Apollo channel.
lunar:
  apollo-integration: true
  direct-json: true

# The sign translation probe (needs PacketEvents). A sign the player never sees is opened and
# closed under them a moment after they join; what their client fills in shows which mods it has.
# Each check names a translation or keybind key a mod adds. action: kick, alert or none.
translation-probe:
  enabled: true
  default-action: kick
  delay-ticks: 10
  timeout-ticks: 60
  fallback-prefix: allium_probe_
  checks:
    meteor-client:
      enabled: true
      mode: meteor
      key: key.meteor-client.open-gui
      display-name: Meteor Client
      action: kick

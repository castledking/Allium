info:
  list:
    empty:
      - "{prefix} &7Hay &f0&7/&f{max} &7jugadores en linea."
      - "[sound] item.book.page_turn 0.95"
    header:
      - "{prefix} &fJugadores en linea &7({online}/{max}):"

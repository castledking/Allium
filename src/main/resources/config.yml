# ==========================================
#            Allium Configuration
# ==========================================

# Internal version tracker - do not modify
config-version: 1

# Commands disabled in Allium (canonical name or alias, e.g. [heal, gm]).
# Disabling a command family blocks its canonical label, all aliases, and allium:<label>
# forms, and yields its labels in Bukkit's CommandMap on startup so another plugin can own them.
disabled-commands: []

# Database settings
database:
  # Type: MYSQL or SQLITE
  type: SQLITE
  # MySQL connection details (ignored if type is SQLITE)
  mysql:
    host: localhost
    port: 3306
    database: allium
    username: root
    password: ""
    # HikariCP pool settings
    pool:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# Module toggles - enable/disable entire feature sets
modules:
  # Player preferences (accept messages/payments/teleport requests, message sound volume).
  preferences: true
  # Private messages: /msg, /reply, /ignore, /unignore, /msgtoggle.
  messaging: true
  # Mail: /mail text mail and gifts, to online and offline players.
  mail: true
  teleport: true
  travel: true
  # Item library and the M1 /give harness.
  items: true
  teleportation: true
  economy: true
  homes: true
  warps: true
  kits: true
  chat: true
  spawn: true
  moderation: true
  info: true
  tools: true

economy:
  # Development-only legacy provider. Leave off until the journalled engine replaces it.
  scaffold-vault-provider-enabled: false

# Staple tools. Each works with its built-in item and with Nexo, CraftEngine or Oraxen items;
# an item's appearance never changes the tool's behavior.
# Tools (such as the Mob Disarmer) are defined in plugins/Allium/tools/*.yml, one file per tool.
# A tools.mob-disarmer section from an older Allium is moved to tools/mob_disarmer.yml the first
# time this version starts, and is not read after that.

# Message sounds. A lang entry may declare a sound with its own volume and pitch; each one it
# leaves out falls back separately to these defaults.
sounds:
  defaults:
    # Volume of a message sound whose lang entry sets none (0 or more; 1.0 is normal).
    volume: 1.0
    # Pitch of a message sound whose lang entry sets none (0.5 to 2.0).
    pitch: 1.0
  messages:
    # Private-message notification volume for players who never set their own with /mfx
    # (0 to 1; 0 mutes notifications by default). It multiplies the message sound's own volume,
    # so a player at 0.5 hears a sound authored at 0.8 at 0.4.
    fallback-volume: 1.0
    # Whether a player's message sound volume (/mfx) also scales the sound they hear when they send
    # a private message (messaging.sent's sound, if it has one). true: /mfx toggle and /mfx volume 0
    # silence both directions. false: only incoming messages follow /mfx.
    scale-sent-sound: true

# Player preferences, stored per UUID in the database above. Players who never chose a value
# follow these defaults, and changing a default here changes it for them too (defaults are never
# written to the database). The default message sound volume is sounds.messages.fallback-volume.
preferences:
  defaults:
    accept-messages: true
    accept-payments: true
    accept-teleport-requests: true
  # How long a joining player's login waits (off the server thread) for preferences to load,
  # 0 to 10000. A slower load finishes after join; nothing is enforced from defaults meanwhile.
  preload-wait-millis: 2000
  # A failed load is retried in the background: up to this many times, first after
  # first-delay-millis, then twice as long each time up to max-delay-millis. Until a load
  # succeeds, messages, payments and teleport requests to that player are refused.
  load-retry:
    retries: 4
    first-delay-millis: 1000
    max-delay-millis: 15000
  storage:
    queue-capacity: 512
    # Parallel storage lanes on MySQL; each player's work always runs in order on one lane.
    mysql-lanes: 4
    # How long shutdown waits for queued saves. Saves still unfinished then are logged one by
    # one as not saved, and shutdown continues.
    shutdown-timeout-millis: 10000

# Item library and the M1 /give harness.
items:
  give:
    # What happens when the target's inventory is full. drop: give what fits and drop the rest at
    # their feet. refuse: give nothing unless everything fits. partial: give what fits and report
    # the rest. Override per command with --overflow=<policy>.
    overflow: drop
    # Accept the old item;meta;amount form. Semicolons inside [...], {...} or quotes always work.
    legacy-semicolon-syntax: false
    # When a head's skin cannot be resolved in time (timeout, failure or the lookup limit below):
    # untextured gives the head without its skin (reported as degraded); refuse gives nothing.
    skull-timeout-fallback: untextured
    skull:
      # owner:<name> resolves off the server thread, through a cache shared by every give.
      lookup-timeout-millis: 3000
      cache-size: 256
      cache-minutes: 60
      # Remote profile lookups started per rolling minute; over the limit a head falls back as above.
      max-lookups-per-minute: 30

# Core resource pack (Allium's custom item visuals). Allium generates the pack at build time and
# bundles it in the jar. Players who decline it keep working, named vanilla items.
resource-pack:
  # Who delivers the pack to players. Changes need a restart.
  # none: Allium never sends or exports it (another plugin or server.properties can serve it).
  # standalone: Allium exports it to plugins/Allium/pack/allium-core-pack.zip; you host that file
  #   at standalone.url, and Allium sends the URL with the pack's SHA-1. Allium has no web server.
  # rpm-export: Allium writes it into ResourcePackManager's mixer (below) before RPM starts; RPM
  #   merges and sends it. Allium never edits RPM's config or another pack.
  # Before 1.20.3 a player holds one server pack, so exactly one delivery owner is mandatory there.
  # From 1.20.3 Allium adds its pack beside others (server.properties, other plugins) by its own UUID.
  owner: none
  # Deliver a local pack instead of the bundled one, relative to plugins/Allium/ (for example
  # pack/allium-core-pack-sf.zip, built with SF's art by pack/tools/sf_export.py). It must keep the
  # bundled pack's models and item definitions; only textures may differ. Otherwise Allium warns
  # and delivers the bundled pack. Leave empty for the bundled pack.
  pack-file: ""
  standalone:
    # Where you host plugins/Allium/pack/allium-core-pack.zip (http or https).
    url: ""
    # Download the URL once at startup and send it only if its SHA-1 matches the bundled pack.
    verify-hosted-file: true
  # Standalone only. true: players must load the pack; declining or a failed download kicks them
  # with kick-message. false: players who decline keep the named vanilla items.
  required: false
  # The text shown with the offer (Allium formatting).
  prompt: "&eThis pack shows Allium's custom tool models. Without it you see named vanilla items."
  kick-message: "&cThis server requires its resource pack. Reconnect and accept it to play."
  rpm-export:
    # ResourcePackManager's mixer directory, relative to plugins/ (or absolute).
    mixer-directory: ResourcePackManager/mixer
    # The only file Allium writes there.
    file-name: Allium_core_resource_pack.zip
    # Report what would be written and any carrier collisions with other packs, but write nothing.
    dry-run: false

# External addon jars live in plugins/Allium/addons/.
# These are for heavier features that should not be bundled into the core jar.
addons:
  # Auto-download should remain opt-in and must verify addon checksums before loading.
  auto-download: false
  enabled:
    party-locator: false
    modguard: false
    custom-items: false

# General settings
settings:
  debug: false
  locale: en_US

# Private-message observation. Player spies must explicitly opt in with /socialspy.
messaging:
  socialspy:
    # PRIVACY: enabling this records delivered PM bodies in console/server logs.
    # Blocked attempts, exempt traffic, and console's own PMs are never copied.
    # Console can see vanished players. Log retention/access is the operator's responsibility.
    log-to-console: false

# The shared index of known player names (mail now, /pay later). Completion reads only this
# in-memory cache; a name outside it still resolves when a command runs.
player-names:
  cache-size: 10000

# /mail. Limits are read at the start of each send, so /allium reload applies them to the next
# send and never to one already in progress.
mail:
  # Most mails (text and gifts) a mailbox holds.
  mailbox-size: 50
  # Longest text body or gift note, in characters.
  body-max-length: 256
  # Text mail is deleted this many days after it was sent; 0 keeps it forever. Gifts never expire,
  # so expiry can never destroy items.
  text-expiry-days: 30
  rate-limit:
    # At most this many mails per player in each window.
    sends: 10
    per-seconds: 60
  gift:
    # Most items (summed amounts) one gift may carry.
    max-items: 64
  notify:
    # "You have N unread mail" on join.
    on-join: true
    # A notice when new mail arrives while the recipient is online on this server.
    new-mail: true

# Shared safe teleport pipeline. Bounds are validated before the settings snapshot is swapped.
teleport:
  warmup-seconds: 3
  movement-tolerance: 0.1
  request-expiry-seconds: 60
  back:
    include-death: false
  cooldowns:
    home: 0
    warp: 0
    tpa: 0
    tpahere: 0
    back: 0
    spawn: 0
    tp: 0
    tphere: 0
  safety:
    enabled: true
    adjust: true
    search-radius: 3
    vertical-search: 4
    avoid-lava: true
    avoid-void: true
    avoid-suffocation: true
    avoid-falls: true
    # False avoids blocking chunk generation; only loaded neighboring chunks are searched.
    load-destination-chunk: false

# Homes use the highest permission grant or staff-assigned minimum, never the sum.
homes:
  default-limit: 1
  overwrite-confirm-seconds: 30
  # UUID: absolute minimum limit; does not downgrade a higher rank. Hard cap: 1000.
  staff-overrides: {}
warps:
  overwrite-confirm-seconds: 30

# Vanish and mute settings (S17).
moderation:
  # How long login waits (off the server thread) for vanish and mute state to load (0-10000 ms).
  preload-wait-millis: 2000
  load-retry:
    retries: 4
    first-delay-millis: 1000
    max-delay-millis: 15000
  vanish:
    # Block public chat while vanished so staff cannot accidentally reveal themselves.
    allow-public-chat: false
  mute:
    # Commands blocked while muted or while mute state is still loading / failed to load.
    muted-commands:
      - /me
      - /say
      - /tell
      - /minecraft:msg
      - /teammsg
      - /msg
      - /reply
      - /r
      - /w
      - /whisper
      - /m
      - /t
      - /mail send
      - /mail gift

# Player info utilities (S18): /list, /seen, /whois, /near, /afk.
info:
  list:
    # Group visible online players by permission group (allium.list.group.<name> or Vault primary group).
    group-by-permission: true
    default-group: "Players"
    groups:
      - owner
      - admin
      - mod
      - staff
      - vip
  near:
    default-radius: 200
    max-radius: 500
  afk:
    # Seconds of inactivity before entering AFK automatically (0 disables auto-AFK).
    auto-afk-seconds: 300
    # Kick AFK players after kick-after-seconds (off by default).
    kick-on-afk: false
    kick-after-seconds: 600
    broadcast: true
    ignore-sleep: true

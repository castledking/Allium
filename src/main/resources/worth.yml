# Item prices for /worth and /sell, each for one item. Items not listed, or priced below 0,
# cannot be sold; an item priced 0 is worthless, and /sell keeps it. /setworth changes prices
# in game.
#
# Keys are item names (diamond_pickaxe); Essentials' worth.yml keys work too (diamondpickaxe,
# and a section such as {'0': 2.0, '*': 2.5}, where '*' is used), as do Allium item aliases.
# Default prices cover standard Minecraft items and can be customized freely.

# Price multipliers: holders of allium.sell.multiplier.<name> sell at that multiple of the
# price; the highest one held applies. "default" applies to everyone else.
multipliers:
  default: 1.0
  double: 2.0
  triple: 3.0

# Sell items that have a custom name (renamed in an anvil, or given with a name).
allow-named-items: false

# Items that can only be sold in whole stacks (item names).
trade-in-stacks: []

# /sell inventory, /sell all and /sell blocks first show what would be sold and for how much;
# the same command again within this many seconds sells it. 0 sells at once, as in Essentials.
confirm-bulk-seconds: 15

# Selling in creative or spectator mode, where items are free. When false, only holders of
# allium.sell.creative can.
allow-creative: false


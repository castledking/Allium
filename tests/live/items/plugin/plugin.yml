name: GiveGate
version: 1.0.0
main: gate.GiveGate
api-version: '1.20'
depend: [Allium]
softdepend: [Nexo, CraftEngine, Oraxen]
description: S04 item-library gate fixture only. Never install on a production server.
commands:
  gg:
    description: S04 give gate fixture
    permission: givegate.console
  ggwho:
    description: S04 gate probe; logs the CommandSender a plugin command receives
    permission: givegate.console
permissions:
  givegate.console:
    default: op

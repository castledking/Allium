      - "[sound] block.anvil.break 0.9"
    conflict:
      - "{prefix} &cLos datos desconectados de &f{player} &ccambiaron externamente; inspeccion cerrada sin guardar."
      - "[sound] item.shield.break 0.95"
    target-online:
      - "{prefix} &e{player} &eentro al servidor; inspeccion desconectada cerrada."
      - "[sound] block.chest.close 1.15"
    target-offline:
      - "{prefix} &e{player} &ese desconecto; inspeccion en vivo cerrada."

  exists:
    - "{prefix} &cYa existe un hogar llamado &f{name}&c."
    - "[sound] block.note_block.bass 0.8"
  limit-info:
    - "{prefix} &6Maximo de hogares para &e{player}&6: &e{effective} &7(permisos: &f{permissions}&7, anulacion: &f{override}&7, establecidos: &f{count}&7)."

# ==========================================
#            Allium Configuration
# ==========================================

# Internal version tracker - do not modify
config-version: 1

# Commands disabled in Allium (canonical name or alias, e.g. [heal, gm]).
# Disabling a command family blocks its canonical label, all aliases, and allium:<label>
# forms, and yields its labels in Bukkit's CommandMap on startup so another plugin can own them.
disabled-commands: []

# Database settings
database:
  # Type: MYSQL or SQLITE
  type: SQLITE
  # MySQL connection details (ignored if type is SQLITE)
  mysql:
    host: localhost
    port: 3306
    database: allium
    username: root
    password: ""
    # HikariCP pool settings
    pool:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# Module toggles - enable/disable entire feature sets
modules:
  # Item library and the M1 /give harness.
  items: true
  teleportation: true
  economy: true
  homes: true
  warps: true
  kits: true
  chat: true
  spawn: true
  moderation: true
  tools: true

# Staple tools. Each works with its built-in item and with Nexo, CraftEngine or Oraxen items;
# an item's appearance never changes the tool's behavior.
tools:
  mob-disarmer:
    enabled: true
    # Appearance for new and imported disarmers: allium:mob_disarmer (built-in), nexo:<id>,
    # oraxen:<id> or craftengine:<namespace>:<id>. Vanilla items are not accepted.
    appearance: allium:mob_disarmer
    # Provider items that act as Mob Disarmers when issued by their provider (e.g. /nexo give).
    aliases: []
    # Optional charge-variant sets. A disarmer shown as any item in a set is swapped to the set's
    # entry for its new charge count ('broken' for a broken tool, else '0'), keeping its charges,
    # instance UUID and MAC. Counts without an entry and items in no set keep their appearance.
    # Swapping rebuilds the item from its provider definition, so custom names are not kept.
    charge-variants: {}
    #  sf:
    #    '3': nexo:mob_disarmer
    #    '2': nexo:mob_disarmer_2-3
    #    '1': nexo:mob_disarmer_1-3
    #    '0': nexo:mob_disarmer_0-3
    # Maximum distance in blocks between player and mob. 0 leaves reach checks to the server.
    radius: 6.0
    max-charges: 3
    # Spending the last charge starts one timer; the tool refills completely when it ends.
    recharge-seconds: 120
    break-chance:
      # none: never breaks. legacy: 3% per spent charge, 5% on the final charge (pre-recode Allium).
      # custom: the values below. Each charge-spending disarm rolls once.
      preset: none
      per-charge: 0.0
      final-charge: 0.0
    # Which removed pieces drop; the rest are destroyed. Either way the slot's drop chance is
    # then set to 0, so killing the mob cannot drop them again.
    # slot-chance: each piece rolls its slot's own drop chance once (2.0 for gear a mob picked up,
    #   0.085 for natural spawn gear). Villager gear and an enderman's carried block always drop.
    #   This is pre-recode Allium's behavior.
    # always: every removed piece drops.
    drop-rule: slot-chance
    # Mob types that cannot be disarmed. Players and armor stands never can.
    excluded-mobs: [ender_dragon, wither, elder_guardian, warden]
    # Skip entities other plugins mark as NPCs (e.g. Citizens).
    exclude-npcs: true
    # Seconds a disarmed mob cannot pick items up, so it cannot re-equip at once. 0 disables.
    pickup-block-seconds: 120
    # A second charge-spending click from one player within this many milliseconds is ignored.
    click-guard-millis: 200
    # Minimum milliseconds between charge status messages from right-clicking air.
    status-cooldown-millis: 1000
    # Sound played at the mob on a disarm; "" for none.
    sound: minecraft:item.shield.break

# Item library and the M1 /give harness.
items:
  give:
    # What happens when the target's inventory is full. drop: give what fits and drop the rest at
    # their feet. refuse: give nothing unless everything fits. partial: give what fits and report
    # the rest. Override per command with --overflow=<policy>.
    overflow: drop
    # Accept the old item;meta;amount form. Semicolons inside [...], {...} or quotes always work.
    legacy-semicolon-syntax: false
    # When a head's skin cannot be resolved in time (timeout, failure or the lookup limit below):
    # untextured gives the head without its skin (reported as degraded); refuse gives nothing.
    skull-timeout-fallback: untextured
    skull:
      # owner:<name> resolves off the server thread, through a cache shared by every give.
      lookup-timeout-millis: 3000
      cache-size: 256
      cache-minutes: 60
      # Remote profile lookups started per rolling minute; over the limit a head falls back as above.
      max-lookups-per-minute: 30

# Core resource pack (Allium's custom item visuals). Allium generates the pack at build time and
# bundles it in the jar. Players who decline it keep working, named vanilla items.
resource-pack:
  # Who sends the pack to players. none: Allium never sends or exports it (another plugin or the
  # server's own resource-pack setting can serve it). standalone and rpm-export are reserved for
  # the delivery step and currently behave like none.
  owner: none

# External addon jars live in plugins/Allium/addons/.
# These are for heavier features that should not be bundled into the core jar.
addons:
  # Auto-download should remain opt-in and must verify addon checksums before loading.
  auto-download: false
  enabled:
    party-locator: false
    modguard: false
    custom-items: false

# General settings
settings:
  debug: false
  locale: en_US

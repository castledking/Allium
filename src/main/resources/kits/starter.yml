# Default starter kit (plugins/Allium/kits/starter.yml).
# Access requires allium.kits.starter or its parent allium.kits.* (operators hold the parent by default).
# Paid kits (cost > '0.00') are denied until M3 economy reservations exist.
name: starter
enabled: true
cooldown-seconds: 300
one-time: false
cost: '0.00'
items:
  - "minecraft:stone_sword 1 unbreaking:1"
  - "minecraft:stone_pickaxe 1 efficiency:1"
  - "minecraft:cooked_beef 16"

name: Allium
version: '${version}'
main: codes.castled.allium.PluginStart
api-version: '1.20'
description: A modern essentials suite
authors: [castledking]
softdepend: [Vault, PlaceholderAPI, Nexo, CraftEngine, Oraxen, ResourcePackManager, GriefPrevention, GriefPrevention3D]

commands:
  heal:
    description: Heal yourself or another player
    usage: /<command> [player]
    permission: allium.heal
  feed:
    description: Feed yourself or another player
    usage: /<command> [player]
    permission: allium.feed
  fly:
    description: Toggle flight mode
    usage: /<command> [player]
    permission: allium.fly
  god:
    description: Toggle god mode
    usage: /<command> [player]
    permission: allium.god
  gamemode:
    description: Change your gamemode
    usage: /<command> <mode> [player]
    aliases: [gm]
    permission: allium.gamemode
  msg:
    description: Send a private message
    usage: /<command> <player> <message>
    aliases: [tell, w, whisper, m, t]
    permission: allium.msg
  reply:
    description: Reply to your last private message
    usage: /<command> <message>
    aliases: [r]
    permission: allium.reply
  ignore:
    description: Ignore a player's private messages, or list who you ignore
    usage: /<command> [player]
    permission: allium.ignore
  unignore:
    description: Stop ignoring a player
    usage: /<command> <player>
    permission: allium.ignore
  msgtoggle:
    description: Turn receiving private messages on or off
    usage: /<command> [on|off] [player]
    permission: allium.msgtoggle
  mail:
    description: Send and read mail, and gifts of items
    usage: /<command> <read|send|gift|claim|delete|clear>
    permission: allium.mail
  socialspy:
    description: Observe delivered private messages between other players
    usage: /<command> [on|off]
    permission: allium.socialspy
  messagesounds:
    description: Your private-message sound volume
    usage: /<command> [volume <0-1>|toggle|reset]
    aliases: [msounds, mfx]
    permission: allium.messagesounds
  allium:
    description: Allium administration
    usage: /<command> <reload|version|import lang [apply]|adopt-window [<duration>|off]>
  give:
    description: Give items (M1 item-library harness)
    usage: /<command> <player> <item[,item...]> [amount] [key:value...] [-e] [--overflow=drop|refuse|partial]
    permission: allium.give

  tpa:
    description: Allium safe teleport command
    permission: allium.tpa
  tpahere:
    description: Allium safe teleport command
    permission: allium.tpahere
  tpaccept:
    description: Allium safe teleport command
    permission: allium.tpaccept
  tpdeny:
    description: Allium safe teleport command
    permission: allium.tpdeny
  tpacancel:
    description: Allium safe teleport command
    permission: allium.tpacancel
  tptoggle:
    description: Allium safe teleport command
    permission: allium.tptoggle
  back:
    description: Allium safe teleport command
    permission: allium.back
  spawn:
    description: Allium safe teleport command
    permission: allium.spawn
  setspawn:
    description: Allium safe teleport command
    permission: allium.setspawn
  tp:
    description: Allium safe teleport command
    permission: allium.tp
  tphere:
    description: Allium safe teleport command
    permission: allium.tphere

  sethome:
    description: Allium sethome
    usage: /sethome

  home:
    description: Allium home
    usage: /home

  delhome:
    description: Allium delhome
    usage: /delhome

  homes:
    description: Allium homes
    usage: /homes

  setwarp:
    description: Allium setwarp
    usage: /setwarp

  warp:
    description: Allium warp
    usage: /warp

  delwarp:
    description: Allium delwarp
    usage: /delwarp

  warps:
    description: Allium warps
    usage: /warps

  kit:
    description: Claim a kit or list available kits
    usage: /<command> [name] [player]
    permission: allium.kit
  kits:
    description: List available kits
    usage: /<command>
    permission: allium.kits
  createkit:
    description: Create a kit from your inventory
    usage: /<command> <name> [cooldown] [once]
    permission: allium.createkit
  delkit:
    description: Delete a kit definition
    usage: /<command> <name>
    permission: allium.delkit

  vanish:
    description: Toggle vanish mode for yourself or another player
    usage: /<command> [on|off] [player]
    aliases: [v]
    permission: allium.vanish
  mute:
    description: Mute a player with an optional duration and reason
    usage: /<command> <player> [duration] [reason]
    permission: allium.mute
  unmute:
    description: Unmute a muted player
    usage: /<command> <player> [reason]
    permission: allium.unmute
  mutes:
    description: List currently active mutes
    usage: /<command>
    aliases: [mutelist]
    permission: allium.mute

permissions:
  allium.*:
    description: All Allium permissions
    default: op
    children:
      allium.heal: true
      allium.heal.others: true
      allium.feed: true
      allium.feed.others: true
      allium.fly: true
      allium.fly.others: true
      allium.god: true
      allium.god.others: true
      allium.gamemode: true
      allium.gamemode.others: true
      allium.economy.*: true
      allium.mobdisarmer.use: true
      allium.mobdisarmer.bypass: true
      allium.phantomobliterator.use: true
      allium.phantomobliterator.bypass: true
      allium.treeaxe.use: true
      allium.give: true
      allium.give.privileged: true
      allium.socialspy: true
      allium.mail: true
      allium.mail.send: true
      allium.mail.gift: true
      allium.mail.bypass.limits: true
      allium.kit: true
      allium.kits: true
      allium.kit.others: true
      allium.createkit: true
      allium.delkit: true
      allium.vanish: true
      allium.vanish.others: true
      allium.vanish.see: true
      allium.mute: true
      allium.unmute: true
      allium.reload: true
      allium.import: true
  allium.reload:
    description: Allows /allium reload
    default: op
  allium.import:
    description: Allows /allium import (pre-recode data imports; dry run unless 'apply')
    default: op
  allium.adoptwindow:
    description: Allows /allium adopt-window (adopt pre-recode privileged tools on first use for a short time). No one has it by default, so only the console can use it.
    default: false
  allium.treeaxe.use:
    description: Lets the Lazy Axe fell whole trees (the pre-recode node)
    default: true
  allium.mail:
    description: Allows /mail read, claim, delete and clear for your own mailbox
    default: true
  allium.mail.send:
    description: Allows /mail send (text mail to online and offline players)
    default: true
  allium.mail.gift:
    description: Allows /mail gift (send the held item by mail)
    default: true
  allium.mail.bypass.limits:
    description: Sends past the mailbox size and rate limit
    default: op
  allium.socialspy:
    description: Allows opting into social spy; only delivered messages between others are shown
    default: op
  allium.socialspy.exempt:
    description: Hides all traffic involving this player from social spy and optional console PM logging. Explicit only.
    default: false
  allium.messagesounds:
    description: Allows /messagesounds (/msounds, /mfx) for your own message sound volume
    default: true
  allium.msg:
    description: Allows /msg
    default: true
  allium.reply:
    description: Allows /reply
    default: true
  allium.ignore:
    description: Allows /ignore and /unignore
    default: true
  allium.msgtoggle:
    description: Allows /msgtoggle for yourself
    default: true
  allium.msgtoggle.others:
    description: Allows /msgtoggle for other players
    default: op
  allium.msg.color:
    description: Lets & colour and formatting codes in private messages take effect
    default: op
  allium.msg.hex:
    description: Lets hex colours in private messages take effect
    default: op
  allium.msg.gradient:
    description: Lets gradient and rainbow tags in private messages take effect
    default: op
  allium.vanish:
    description: Allows /vanish for yourself
    default: op
  allium.vanish.others:
    description: Allows /vanish for other players
    default: op
  allium.vanish.see:
    description: See vanished players (world, tab list, messages, tab completion)
    default: op
  allium.mute:
    description: Allows /mute and /mutes
    default: op
  allium.unmute:
    description: Allows /unmute
    default: op
  allium.msg.bypass.toggle:
    description: Message players who turned messages off. Explicit only; not given to ops or allium.*
    default: false
  allium.msg.bypass.ignore:
    description: Message players who ignore you. Explicit only; not given to ops or allium.*
    default: false
  allium.heal:
    description: Allows use of /heal
    default: op
  allium.heal.others:
    description: Allows healing other players
    default: op
  allium.feed:
    description: Allows use of /feed
    default: op
  allium.feed.others:
    description: Allows feeding other players
    default: op
  allium.fly:
    description: Allows use of /fly
    default: op
  allium.fly.others:
    description: Allows toggling flight for other players
    default: op
  allium.god:
    description: Allows use of /god
    default: op
  allium.god.others:
    description: Allows toggling god mode for other players
    default: op
  allium.gamemode:
    description: Allows use of /gamemode
    default: op
  allium.gamemode.others:
    description: Allows changing others gamemodes
    default: op
  allium.give:
    description: Allows /give (M1 item-library harness)
    default: op
  allium.give.privileged:
    description: Allows /give to mint privileged items such as handcuffs
    default: op
  allium.mobdisarmer.use:
    description: Allows using a Mob Disarmer
    default: true
  allium.mobdisarmer.bypass:
    description: Mob Disarmer uses spend no charges and never break
    default: op
  allium.phantomobliterator.use:
    description: Allows using a Phantom Obliterator
    default: true
  allium.phantomobliterator.bypass:
    description: Phantom Obliterator uses spend no charges and never break
    default: op

  allium.tpa:
    default: true
  allium.tpahere:
    default: true
  allium.tpaccept:
    default: true
  allium.tpdeny:
    default: true
  allium.tpacancel:
    default: true
  allium.tptoggle:
    default: true
  allium.back:
    default: true
  allium.spawn:
    default: true
  allium.setspawn:
    default: op
  allium.tp:
    default: op
  allium.tphere:
    default: op
  allium.tp.others:
    default: op
  allium.tptoggle.others:
    default: op
  allium.teleport.bypass.toggle:
    description: Explicit teleport toggle bypass (never granted implicitly to operators)
    default: false
  allium.teleport.bypass.ignore:
    description: Explicit teleport ignore bypass (never granted implicitly to operators)
    default: false
  allium.teleport.bypass.warmup:
    description: Explicit teleport warmup bypass (never granted implicitly to operators)
    default: false
  allium.teleport.bypass.cooldown:
    description: Explicit teleport cooldown bypass (never granted implicitly to operators)
    default: false

  allium.sethome:
    default: true

  allium.home:
    default: true

  allium.delhome:
    default: true

  allium.homes:
    default: true

  allium.setwarp:
    default: op

  allium.warp:
    default: true

  allium.delwarp:
    default: op

  allium.warps:
    default: true

  allium.sethome.unlimited:
    description: Permit up to the hard cap of 1000 homes
    default: false

  allium.kit:
    description: Allows /kit
    default: true
  allium.kits:
    description: Allows /kits
    default: true
  allium.kits.*:
    description: Parent wildcard permission granting access to all kits
    default: false
  allium.kit.others:
    description: Allows /kit <name> <player>
    default: op
  allium.createkit:
    description: Allows /createkit
    default: op
  allium.delkit:
    description: Allows /delkit
    default: op
  allium.kit.bypass.cooldown:
    description: Explicit kit cooldown bypass (never granted implicitly to operators)
    default: false

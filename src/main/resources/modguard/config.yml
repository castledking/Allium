  - trouser-streak
  - newernewchunks
  - ui-utils
  - uiutils
  # --- inventory mods (IPN family) ---
  - inventory-profiles-next
  - inventoryprofilesnext
  - inventoryprofiles
  - inventory_profiles
  - inventory_profiles_next
  - ipnext
  - libipn
  # --- other utility mods ---
  - tweakeroo
  - litematica
  - minihud
  # --- more clients / cheats ---
  - vape
  - sigma
  - impact
  - future
  - konas
  - rusherhack
  - inertia-client
  - inertia
  - phobos
  - kami
  - salhack
  - creepy-salhack
  - gamesense
  - xulu
  - w+2
  - w+3
  - pyro
  - 3arthh4ck
  - earthhack
  - '0x22'
  - auto-crystal
  - crystal-aura
  - waylandcraft
  - waylandcraftplusplus
  - waylandcraft-plus-plus
  - waylandcraft_plus_plus

# Only used when mode is whitelist. Any client that announces a mod NOT on this
# list is kicked.
allowed-mods:
  - optifabric
  - sodium
  - lithium
  - phosphor
  - iris
  - fabric-api
  - fabric-language-kotlin
  - modmenu
  - cloth-config
  - owo-lib
  - reeses-sodium-options
  - yet-another-config-lib

# Kick message shown to players using banned mods
# Use {mod} for the detected mod name and {player} for player name.
kick-message: |-
  &c&lMODIFIED CLIENT DETECTED

  &7You have been kicked from the server.
  &7Reason: &cBanned modification detected

  &7Detected mod: &e{mod}

  &7Please remove this mod and rejoin.

# Alert sent to staff when player is kicked for banned mod.
staff-alert: "&7[&c&lModGuard&7] &e{player} &7was kicked for using: &c{mod}"

# Log format for detected mods.
detection-log: "&7[ModGuard] Detected mods for {player}: {mods} (brand: {brand})"

# Notify staff with permission when players join with any mods (not just banned).
notify-staff: true

# Staff permission for notifications.
staff-permission: "modguard.notify"

# Bypass permission - players with this permission won't be checked.
bypass-permission: "modguard.bypass"

# Log all detected mods to console (not just banned ones).
log-all-mods: false

# Log detection events (kicks, banned mods found).
log-detections: true

# Match banned-mods entries as regex instead of plain substring.
regex-matching: false

# Match banned-mods case-sensitively.
case-sensitive: false

# --- Layer 2: translation probe ------------------------------------------
# Requires PacketEvents. Sends a virtual (ghost) sign whose lines carry
# translation / keybind components, then opens the sign editor for a split
# second. A client with the mod registered resolves the key and echoes the
# translated text back; a vanilla client echoes the fallback or raw key.
#
# Multi-probe: up to 3 checks are packed onto a single sign (one per line)
# plus a control line carrying a vanilla keybind (key.forward). If the control
# line comes back as the raw "key.forward", a sign-spoofing / exploit-preventer
# mod is hijacking the probe and it is flagged - and coincident hit confidence
# is lowered.
#
# Modes:
#   translate - component resolves via {key} (fallback echoes when unknown).
#               Hit = resolved != fallback. Exact key echo = protected.
#   keybind   - component resolves via the client's keybinding for {key}.
#               Hit = resolved a bound-key name (mod controls defined).
#   meteor    - exact key echo = hit (meteor special), fallback echo = clean.
#
# 'expected' is optional. When non-empty, only exact (case-insensitive) matches
# to those resolved values trigger a hit.
translation-probe:
  enabled: true
  # Default action for checks that don't declare one: none / alert / kick
  default-action: kick
  delay-ticks: 10
  timeout-ticks: 60
  # Ticks between signs when a client is clean for all checks on the current sign.
  between-sign-ticks: 5
  fallback-prefix: "allium_probe_"
  alert-message: "&7[&cModGuard&7] &e{player} &7hit translation probe &c{check} &8(&f{key}&8) &7resolved=&f{resolved} &7confidence=&e{confidence}&7 action=&e{action}"
  checks:
    # ---------------- Meteor Client (hackops, addon base) ----------------
    meteor-client:
      enabled: true
      mode: meteor
      key: "key.meteor-client.open-gui"
      display-name: "Meteor Client"
      action: kick
      require-corroboration-for-kick: false
    meteor-client-commands:
      enabled: true
      mode: meteor
      key: "key.meteor-client.open-commands"
      display-name: "Meteor Client"
      action: kick
      require-corroboration-for-kick: false
    meteor-client-category:
      enabled: true
      mode: meteor
      key: "key.category.meteor-client.meteor-client"
      display-name: "Meteor Client"
      action: kick
      require-corroboration-for-kick: false

    # ---------------- hackops other clients -------------------------------
    wurst:
      enabled: true
      mode: keybind
      key: "key.wurst.zoom"
      display-name: "Wurst Client"
      action: kick
      require-corroboration-for-kick: false
    # LiquidBounce is IMPOSSIBLE to detect via the sign probe on current builds.
    # It loads its lang files as classpath resources (/resources/liquidbounce/lang/)
    # into its OWN ClientLanguage and only swaps it in for its own LanguageText
    # components (MixinTranslatableContents). Vanilla Language.getInstance() - which
    # resolves sign components - never sees a single liquidbounce.* key, so every
    # probe echoes the fallback (CLEAN). Its module names are also raw strings (no
    # .name keys) and it ships a ClientSpoofer (vanilla/geyser/lunar/CB/custom brand).
    # Kept here disabled so the reasoning stays on record:
    liquidbounce-killaura:
      enabled: false
      mode: translate
      key: "liquidbounce.module.killAura.description"
      display-name: "LiquidBounce"
      action: kick
      require-corroboration-for-kick: false
    baritone:
      enabled: true
      mode: translate
      key: "baritone.command.help.title"
      display-name: "Baritone"
      action: alert
      require-corroboration-for-kick: true


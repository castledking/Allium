    offline-required:
      - "{prefix} &cLa inspeccion desconectada requiere &f{permission}&c."
      - "[sound] entity.villager.no 0.95"
    offline-unavailable:
      - "{prefix} &cLos datos desconectados de &f{player} &cno estan disponibles ahora mismo."
      - "[sound] block.note_block.bass 0.75"

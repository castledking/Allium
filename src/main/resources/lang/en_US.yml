    volume: 0.5
    pitch: 1.2
  vanish-off:
    text: "{prefix} &7Vanish disabled. You are now visible."
    sound: minecraft:entity.illusioner.cast_spell
    volume: 0.45
    pitch: 1.1
  vanish-other-on:
    text: "{prefix} &aEnabled vanish for &f{player}&a."
    sound: minecraft:entity.illusioner.mirror_move
    volume: 0.45
    pitch: 1.2
  vanish-other-off:
    text: "{prefix} &7Disabled vanish for &f{player}&7."
    sound: minecraft:entity.illusioner.cast_spell
    volume: 0.45
    pitch: 1.1
  vanish-silent-container:
    text: "{prefix} &7Opened container silently (read-only while vanished)."

# ==========================================
#   Allium Archivo de Idioma - Espanol (ES)
# ==========================================

prefix: "&7[&dAllium&7]"

core:
  reload-success:
    text: "{prefix} &aConfiguracion recargada."
    sound: minecraft:block.note_block.chime
    volume: 0.55
    pitch: 1.35
  reload-failed:
    text: "{prefix} &cFallo al recargar. Revisa la consola."
    sound: minecraft:block.note_block.bass
    volume: 0.6
    pitch: 0.75
  version:
    text: "{prefix} &fEjecutando Allium &dv{version}&f."
    sound: minecraft:ui.button.click
    volume: 0.4
    pitch: 1.25
  import:
    lang-no-source:
      text: "{prefix} &cNo hay un archivo de idioma anterior en &f{file}&c."
      sound: minecraft:block.note_block.bass
      volume: 0.55
      pitch: 0.8
    lang-report:
      text: "{prefix} &7{mode}: &f{write} &7por escribir, &f{same} &7ya importados, &f{kept} &7conservados (personalizados), &f{unmapped} &7aun no portables. Los detalles estan en la consola."
      sound: minecraft:item.book.page_turn
      volume: 0.6
      pitch: 1.0
    lang-applied:
      text: "{prefix} &aImportados &f{write} &amensaje(s) en &f{file}&a; el archivo anterior se guardo como &f{backup}&a."
      sound: minecraft:entity.player.levelup
      volume: 0.5
      pitch: 1.35
    lang-nothing:
      text: "{prefix} &aNada que importar; &f{file} &aesta al dia."
      sound: minecraft:block.note_block.hat
      volume: 0.45
      pitch: 1.15
    lang-failed:
      text: "{prefix} &cLa importacion del idioma fallo: &f{reason}"
      sound: minecraft:block.note_block.bass
      volume: 0.6
      pitch: 0.75
  adopt-window:
    opened:
      text: "{prefix} &eLas herramientas privilegiadas anteriores al recode se adoptan al primer uso durante los proximos &f{duration}&e. Cada adopcion queda registrada. Cierralo antes con &f/allium adopt-window off&e."
      sound: minecraft:block.beacon.activate
      volume: 0.45
      pitch: 1.25
    closed:
      text: "{prefix} &aLa ventana de adopcion esta cerrada."
      sound: minecraft:block.beacon.deactivate
      volume: 0.45
      pitch: 1.0
    status:
      text: "{prefix} &7La ventana de adopcion esta &f{state}&7."
      sound: minecraft:ui.button.click
      volume: 0.4
      pitch: 1.1

error:
  no-permission:
    text: "{prefix} &cNo tienes permiso para hacer eso."
    sound: minecraft:entity.villager.no
    volume: 0.55
    pitch: 1.0
  player-only: "{prefix} &cEste comando solo puede ser usado por jugadores."
  console-only:
    text: "{prefix} &cEste comando solo puede ser usado desde la consola."
    sound: minecraft:entity.villager.no
    volume: 0.55
    pitch: 0.95
  invalid-args:
    text: "{prefix} &cUso: &f{usage}"
    sound: minecraft:ui.button.click
    volume: 0.4
    pitch: 0.75
  player-not-found:
    text: "{prefix} &cJugador &f{player} &cno encontrado."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  number-invalid:
    text: "{prefix} &c'{input}' no es un numero valido."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  world-not-found:
    text: "{prefix} &cMundo &f{world} &cno encontrado."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  cooldown-active:
    text: "{prefix} &cEspera &f{time} &cantes de usar esto de nuevo."
    sound: minecraft:block.note_block.hat
    volume: 0.5
    pitch: 0.85
  module-disabled:
    text: "{prefix} &cEsta funcion esta desactivada."
    sound: minecraft:entity.villager.no
    volume: 0.5
    pitch: 0.9

teleport:
  success:
    text: "{prefix} &aTeletransportado a &f{target}&a."
    sound: minecraft:entity.enderman.teleport
    volume: 0.5
    pitch: 1.15
  request-sent:
    text: "{prefix} &aSolicitud de teletransporte enviada a &f{player}&a."
    sound: minecraft:block.note_block.pling
    volume: 0.45
    pitch: 1.35
  request-received:
    text: "{prefix} &f{player} &aquiere teletransportarse a ti. &f/tpaccept &ao &f/tpdeny"
    sound: minecraft:block.note_block.bell
    volume: 0.6
    pitch: 1.25
  accepted:
    text: "{prefix} &aSolicitud de teletransporte aceptada."
    sound: minecraft:block.note_block.pling
    volume: 0.5
    pitch: 1.5
  denied:
    text: "{prefix} &cSolicitud de teletransporte denegada."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  cancelled:
    text: "{prefix} &cSolicitud de teletransporte expirada."
    sound: minecraft:block.note_block.bass
    volume: 0.45
    pitch: 0.75
  back:
    text: "{prefix} &aRegresaste a tu ubicacion anterior."
    sound: minecraft:entity.enderman.teleport
    volume: 0.5
    pitch: 0.95
  no-back:
    text: "{prefix} &cNo hay ubicacion anterior."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  no-pending:
    text: "{prefix} &cNo tienes solicitudes pendientes."
    sound: minecraft:block.note_block.bass
    volume: 0.5
    pitch: 0.85
  here-received:
    text: "{prefix} &f{player} &aquiere que te teletransportes hacia el. &f/tpaccept &ao &f/tpdeny"
    sound: minecraft:block.note_block.bell
    volume: 0.6
    pitch: 1.15
  request-cancelled:
    text: "{prefix} &cSolicitud de teletransporte cancelada."
    sound: minecraft:block.note_block.hat
    volume: 0.45
    pitch: 0.8
  warmup:
    text: "{prefix} &eTeletransportando en {time}s. Quedate quieto y evita dano."
    sound: minecraft:block.note_block.chime
    volume: 0.45
    pitch: 1.0
  interrupted:
    text: "{prefix} &cTeletransporte cancelado: {reason}."
    sound: minecraft:item.shield.break
    volume: 0.45
    pitch: 1.15
  refused:
    text: "{prefix} &c{player} no puede recibir teletransportes ahora mismo."
    sound: minecraft:entity.villager.no
    volume: 0.5
    pitch: 1.0
  loading:
    text: "{prefix} &cTus datos de teletransporte aun se estan cargando. Intentalo de nuevo en un momento."
    sound: minecraft:block.note_block.hat
    volume: 0.45
    pitch: 0.9
  storage-failed:
    text: "{prefix} &cNo se pudieron guardar los datos de teletransporte. Intentalo de nuevo en un momento."
    sound: minecraft:block.note_block.bass
    volume: 0.6
    pitch: 0.7
  unsafe:
    text: "{prefix} &cNo se encontro un destino seguro. No se teletransporto nada."
    sound: minecraft:item.shield.break
    volume: 0.5
    pitch: 0.95
  busy:
    text: "{prefix} &cYa hay un teletransporte pendiente. Intentalo de nuevo en un momento."
    sound: minecraft:block.note_block.hat
    volume: 0.45
    pitch: 0.85
  self:
    text: "{prefix} &cNo puedes enviarte una solicitud de teletransporte a ti mismo."
    sound: minecraft:block.note_block.bass
    volume: 0.5
    pitch: 0.8
  toggle-on:
    text: "{prefix} &a{player} ahora acepta solicitudes de teletransporte."
    sound: minecraft:block.note_block.pling
    volume: 0.45
    pitch: 1.4
  toggle-off:
    text: "{prefix} &c{player} ya no acepta solicitudes de teletransporte. Solicitudes entrantes canceladas."
    sound: minecraft:block.note_block.bass
    volume: 0.45
    pitch: 0.85

travel:
  loading:
    text: "{prefix} &cLos datos de viaje se estan cargando. Intentalo de nuevo en un momento."
    sound: minecraft:block.note_block.hat
    volume: 0.45
    pitch: 0.9
  busy:
    text: "{prefix} &cEl almacenamiento de viajes esta ocupado. Intentalo de nuevo en un momento."
    sound: minecraft:block.note_block.hat
    volume: 0.45
    pitch: 0.85
  storage-failed:
    text: "{prefix} &cNo se pudieron guardar los datos de viaje. Intentalo de nuevo en un momento."
    sound: minecraft:block.note_block.bass
    volume: 0.6
    pitch: 0.7
  name-invalid:
    text: "{prefix} &cUsa de 1 a 32 letras, digitos, guiones bajos o guiones para el nombre."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  confirm:
    text: "{prefix} &eEste nombre ya existe. Ejecuta &f{command} &epara confirmar la ubicacion capturada."
    sound: minecraft:block.note_block.bell
    volume: 0.55
    pitch: 1.1
  confirm-expired:
    text: "{prefix} &cNo hay ninguna confirmacion de sobrescritura activa. Ejecuta de nuevo el comando para establecer."
    sound: minecraft:block.note_block.bass
    volume: 0.5
    pitch: 0.75
  changed:
    text: "{prefix} &cEste destino cambio. Ejecuta el comando de nuevo."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  limit:
    text: "{prefix} &cHas alcanzado tu limite de hogares ({limit})."
    sound: minecraft:entity.villager.no
    volume: 0.55
    pitch: 0.95

home:
  set:
    text: "{prefix} &aHogar &f{name} &aestablecido."
    sound: minecraft:block.note_block.chime
    volume: 0.55
    pitch: 1.3
  deleted:
    text: "{prefix} &aHogar &f{name} &aeliminado."
    sound: minecraft:item.book.page_turn
    volume: 0.55
    pitch: 0.9
  not-found:
    text: "{prefix} &cHogar &f{name} &cno encontrado."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  limit-reached:
    text: "{prefix} &cHas alcanzado el limite de hogares (&f{limit}&c)."
    sound: minecraft:entity.villager.no
    volume: 0.55
    pitch: 0.95
  list:
    text: "{prefix} &fHogares: &d{homes}"
    sound: minecraft:item.book.page_turn
    volume: 0.55
    pitch: 1.1
  none:
    text: "{prefix} &cNo tienes hogares establecidos."
    sound: minecraft:block.note_block.hat
    volume: 0.4
    pitch: 0.9

warp:
  set:
    text: "{prefix} &aWarp &f{name} &aestablecido."
    sound: minecraft:block.enchantment_table.use
    volume: 0.5
    pitch: 1.25
  deleted:
    text: "{prefix} &aWarp &f{name} &aeliminado."
    sound: minecraft:item.book.page_turn
    volume: 0.55
    pitch: 0.9
  not-found:
    text: "{prefix} &cWarp &f{name} &cno encontrado."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  list:
    text: "{prefix} &fWarps: &d{warps}"
    sound: minecraft:item.book.page_turn
    volume: 0.55
    pitch: 1.1
  none:
    text: "{prefix} &cNo hay warps disponibles."
    sound: minecraft:block.note_block.hat
    volume: 0.4
    pitch: 0.9

spawn:
  set:
    text: "{prefix} &aPunto de aparicion establecido."
    sound: minecraft:block.beacon.activate
    volume: 0.5
    pitch: 1.2
  teleport:
    text: "{prefix} &aTeletransportado al spawn."
    sound: minecraft:entity.enderman.teleport
    volume: 0.5
    pitch: 1.25
  not-set:
    text: "{prefix} &cEl spawn no ha sido establecido."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8

kit:
  received:
    text: "{prefix} &aKit &f{name} &arecibido."
    sound: minecraft:entity.player.levelup
    volume: 0.5
    pitch: 1.4
  given:
    text: "{prefix} &aKit &f{name} &aentregado a &f{player}&a."
    sound: minecraft:entity.item.pickup
    volume: 0.55
    pitch: 1.2
  not-found:
    text: "{prefix} &cKit &f{name} &cno encontrado."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  no-permission:
    text: "{prefix} &cNo tienes permiso para reclamar el kit &f{name}&c."
    sound: minecraft:entity.villager.no
    volume: 0.55
    pitch: 1.0
  list:
    text: "{prefix} &fKits: &d{kits}"
    sound: minecraft:item.book.page_turn
    volume: 0.55
    pitch: 1.1
  none:
    text: "{prefix} &cNo hay kits disponibles."
    sound: minecraft:block.note_block.hat
    volume: 0.4
    pitch: 0.9
  cooldown:
    text: "{prefix} &cKit &f{name} &cen espera. Espera &f{time}&c."
    sound: minecraft:block.note_block.hat
    volume: 0.5
    pitch: 0.85
  one-time-claimed:
    text: "{prefix} &cYa reclamaste el kit de un solo uso &f{name}&c."
    sound: minecraft:entity.villager.no
    volume: 0.55
    pitch: 0.95
  paid-denied:
    text: "{prefix} &cEl kit de pago &f{name} &crequiere reclamo propio y una economia disponible."
    sound: minecraft:entity.villager.no
    volume: 0.55
    pitch: 0.9
  cost-refused:
    text: "{prefix} &cNo puedes pagar por ese kit."
    sound: minecraft:entity.villager.no
    volume: 0.55
    pitch: 0.9
  full:
    text: "{prefix} &cTu inventario no tiene espacio para todos los objetos del kit &f{name}&c; no se entrego nada."
    sound: minecraft:item.shield.break
    volume: 0.45
    pitch: 0.95
  busy:
    text: "{prefix} &cYa hay una operacion de kit o inventario en curso. Intentalo de nuevo en un momento."
    sound: minecraft:block.note_block.hat
    volume: 0.45
    pitch: 0.85
  failed:
    text: "{prefix} &cLa entrega de kits no esta disponible ahora; no se entrego ni consumio nada."
    sound: minecraft:block.note_block.bass
    volume: 0.6
    pitch: 0.7
  invalid:
    text: "{prefix} &cEl kit &f{name} &ctiene una definicion de objeto invalida: &f{reason}"
    sound: minecraft:block.note_block.bass
    volume: 0.6
    pitch: 0.75
  created:
    text: "{prefix} &aKit &f{name} &acreado con &f{items} &apila(s) de objetos."
    sound: minecraft:block.anvil.use
    volume: 0.5
    pitch: 1.25
  deleted:
    text: "{prefix} &aKit &f{name} &aeliminado."
    sound: minecraft:item.book.page_turn
    volume: 0.55
    pitch: 0.85
  already-exists:
    text: "{prefix} &cEl kit &f{name} &cya existe. Eliminalo primero con &f/delkit {name}&c."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.85
  create-empty:
    text: "{prefix} &cColoca al menos un objeto en tu inventario antes de usar &f/createkit&c."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  name-invalid:
    text: "{prefix} &cUsa de 1 a 32 letras minusculas, digitos, guiones bajos o guiones para el nombre del kit."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  capture-privileged:
    text: "{prefix} &cNo se puede capturar la ranura &f{slot} &c(&f{item}&c / &f{behavior}&c): capturar objetos privilegiados requiere &f{permission}&c."
    sound: minecraft:entity.villager.no
    volume: 0.55
    pitch: 0.95
  capture-unsupported:
    text: "{prefix} &cNo se puede crear el kit: la ranura &f{slot} &ccontiene datos de objeto no soportados (&f{reason}&c). Quita o reemplaza el objeto para no degradar el kit."
    sound: minecraft:block.note_block.bass
    volume: 0.6
    pitch: 0.75

economy:
  balance:
    text: "{prefix} &fSaldo: &a{amount}"
    sound: minecraft:ui.button.click
    volume: 0.4
    pitch: 1.3
  balance-other:
    text: "{prefix} &fSaldo de &f{player}&f: &a{amount}"
    sound: minecraft:ui.button.click
    volume: 0.4
    pitch: 1.3
  pay-sent:
    text: "{prefix} &aEnviaste &f{amount} &aa &f{player}&a."
    sound: minecraft:entity.experience_orb.pickup
    volume: 0.5
    pitch: 0.95
  pay-received:
    text: "{prefix} &aRecibiste &f{amount} &ade &f{player}&a."
    sound: minecraft:entity.experience_orb.pickup
    volume: 0.6
    pitch: 1.35
  insufficient:
    text: "{prefix} &cFondos insuficientes."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  invalid-amount:
    text: "{prefix} &cLa cantidad debe ser mayor que cero."
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8

chat:
  delete:
    success:
      text: "{prefix} &aMensaje eliminado."
      sound: minecraft:item.book.page_turn
      volume: 0.4
      pitch: 1.0
    multiple:
      text: "{prefix} &aMensajes eliminados."
      sound: minecraft:item.book.page_turn
      volume: 0.4
      pitch: 1.0
    not-found: "{prefix} &cMensaje no encontrado."
    amount: "{prefix} &cLa cantidad debe estar entre 1 y 200."
    usage: "{prefix} &cUso: &f/delmsg <id> &co &f/delmsg <player> <amount>"
  player-not-found: "{prefix} &cJugador no encontrado."
  msg-format: "&7[&f{sender} &7-> &f{receiver}&7] &f{message}"
  no-reply:
    text: "{prefix} &cNo hay nadie a quien responder."
    sound: minecraft:block.note_block.bass
    volume: 0.5
    pitch: 0.85
  socialspy-toggle:
    text: "{prefix} &fSocialSpy {state}&f."
    sound: minecraft:ui.button.click
    volume: 0.4
    pitch: 1.15
  broadcast:
    text: "&4[Anuncio] &c{message}"
    sound: minecraft:block.note_block.bell
    volume: 0.55
    pitch: 1.05

moderation:
  discipline:
    usage:
      text: "{prefix} &cUso: {usage}"
      sound: minecraft:ui.button.click
      volume: 0.4
      pitch: 0.75
    unavailable:
      text: "{prefix} &cLos datos de moderacion no estan disponibles. Intentalo de nuevo en un momento."
      sound: minecraft:block.note_block.bass
      volume: 0.6
      pitch: 0.7
    busy:
      text: "{prefix} &cYa hay una accion de moderacion pendiente o limitada por frecuencia. Intentalo de nuevo en un momento."
      sound: minecraft:block.note_block.hat
      volume: 0.45
      pitch: 0.85
    exempt:
      text: "{prefix} &cNo puedes actuar sobre este jugador segun la jerarquia de moderacion."
      sound: minecraft:entity.villager.no
      volume: 0.55
      pitch: 0.9
    success:
      text: "{prefix} &a{action}: {player}."
      sound: minecraft:block.note_block.pling
      volume: 0.5
      pitch: 1.25
    not-active:
      text: "{prefix} &cNo hay ningun registro activo coincidente para {player}."
      sound: minecraft:block.note_block.bass
      volume: 0.5
      pitch: 0.85
    ip-disabled:
      text: "{prefix} &cLos baneos de IP estan desactivados en la configuracion."
      sound: minecraft:entity.villager.no
      volume: 0.5
      pitch: 0.9
    jail-not-found:
      text: "{prefix} &cNo se encontro la carcel {jail}."
      sound: minecraft:block.note_block.bass
      volume: 0.55
      pitch: 0.8
    unsafe-location:
      text: "{prefix} &cLa carcel o la ubicacion de retorno no esta disponible o no es segura."
      sound: minecraft:item.shield.break
      volume: 0.5
      pitch: 0.95
    ban-denied: "Estas baneado: {message}"
    login-unavailable: "Los datos de moderacion no estan disponibles. Por favor intentalo de nuevo en un momento."
    kick-notice: "Fuiste expulsado: {message}"
    warning-notice:
      text: "{prefix} &eAdvertencia: {message}"
      sound: minecraft:block.note_block.bell
      volume: 0.6
      pitch: 0.9
    list-header:
      text: "{prefix} &fRegistros de moderacion ({count}):"
      sound: minecraft:item.book.page_turn
      volume: 0.55
      pitch: 1.0
    list-entry: "&7- {player} por {actor}: {message}"
    list-empty:
      text: "{prefix} &7No se encontraron registros de moderacion."
      sound: minecraft:block.note_block.hat
      volume: 0.4
      pitch: 0.95
  inspect:
    self:
      text: "{prefix} &cNo puedes usar /invsee contigo mismo."
      sound: minecraft:block.note_block.bass
      volume: 0.5
      pitch: 0.8
    busy:
      text: "{prefix} &cEse inventario esta ocupado ahora mismo. Intentalo de nuevo en un momento."
      sound: minecraft:block.note_block.hat
      volume: 0.45
      pitch: 0.85
    offline-required:
      text: "{prefix} &cLa inspeccion desconectada requiere &f{permission}&c."
      sound: minecraft:entity.villager.no
      volume: 0.55
      pitch: 0.95
    offline-unavailable:
      text: "{prefix} &cLos datos desconectados de &f{player} &cno estan disponibles ahora mismo."
      sound: minecraft:block.note_block.bass
      volume: 0.55
      pitch: 0.75
    offline-corrupt:
      text: "{prefix} &cLos datos desconectados de &f{player} &cno pudieron leerse de forma segura; no se modifico nada."
      sound: minecraft:item.shield.break
      volume: 0.55
      pitch: 0.85
    offline-newer-version:
      text: "{prefix} &cLos datos desconectados de &f{player} &cfueron guardados por una version mas nueva de Minecraft; no se modifico nada."
      sound: minecraft:item.shield.break
      volume: 0.55
      pitch: 0.9
    offline-version-rewrite:
      text: "{prefix} &cLos datos desconectados de &f{player} &cusan una DataVersion diferente de Minecraft; se rechaza la edicion para no reescribir nada."
      sound: minecraft:item.shield.break
      volume: 0.55
      pitch: 0.9
    offline-hold:
      text: "{prefix} &cLa edicion desconectada para &f{player} &ces rechazada mientras exista una retencion pendiente."
      sound: minecraft:entity.villager.no
      volume: 0.55
      pitch: 0.9
    offline-edit-disabled:
      text: "{prefix} &cLa edicion de datos de jugadores desconectados esta desactivada debido a un fallo en el autotest del codec."
      sound: minecraft:block.anvil.break
      volume: 0.45
      pitch: 0.9
    conflict:
      text: "{prefix} &cLos datos desconectados de &f{player} &ccambiaron externamente; inspeccion cerrada sin guardar."
      sound: minecraft:item.shield.break
      volume: 0.55
      pitch: 0.95
    target-online:
      text: "{prefix} &e{player} &eentro al servidor; inspeccion desconectada cerrada."
      sound: minecraft:block.chest.close
      volume: 0.5
      pitch: 1.15
    target-offline:
      text: "{prefix} &e{player} &ese desconecto; inspeccion en vivo cerrada."
      sound: minecraft:block.chest.close
      volume: 0.5

# ==========================================
#            Allium Configuration
# ==========================================

# Internal version tracker - do not modify
config-version: 1

# Commands disabled in Allium (canonical name or alias, e.g. [heal, gm]).
# Disabling a command family blocks its canonical label, all aliases, and allium:<label>
# forms, and yields its labels in Bukkit's CommandMap on startup so another plugin can own them.
disabled-commands: []

# Database settings
database:
  # Type: MYSQL or SQLITE
  # With the economy enabled, each MYSQL schema belongs to one Allium server and its native player data.
  type: SQLITE
  # MySQL connection details (ignored if type is SQLITE)
  mysql:
    host: localhost
    port: 3306
    database: allium
    username: root
    password: ""
    # HikariCP pool settings
    pool:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# Module toggles - enable/disable entire feature sets
modules:
  # Player preferences (accept messages/payments/teleport requests, message sound volume).
  preferences: true
  # Private messages: /msg, /reply, /ignore, /unignore, /msgtoggle.
  messaging: true
  # Mail: /mail text mail and gifts, to online and offline players.
  mail: true
  teleport: true
  travel: true
  # Item library and /give.
  items: true
  teleportation: true
  economy: true
  homes: true
  warps: true
  kits: true
  chat: true
  hide: true
  spawn: true
  moderation: true
  info: true
  tools: true
  # Creative manager: creative restrictions and separate creative/survival inventories.
  creative: true
  # Alt detection: IP history, the alt parent group, /altexempt, alt lists in /seen and /whois.
  alts: true
  # Inventory snapshots and /restore.
  restore: true
  # Random teleport: /rtp (/tpr), /settpr and rtp.yml. Needs teleport.
  rtp: true
  # Item prices and selling: /worth (/price), /sell, /setworth and worth.yml. /sell needs economy.
  worth: true
  # Explosion regeneration and /antioch, /fireball, /beezooka, /kittycannon, /nuke, /explode; explosions.yml.
  explosions: true
  # Modified-client detection; settings in modguard.yml.
  modguard: true

# Log committed command and sign transactions to trade.log.
economy-log-enabled: false
# Prefer UUIDs over known account names in trade.log.
economy-log-uuids: false
# Include Vault API changes. This can fill trade.log quickly.
economy-log-update-enabled: false

economy:
  currency-symbol: '$'
  currency-symbol-suffix: false
  # Register Allium as the Vault economy provider when Vault is installed.
  vault-provider-enabled: true
  # Single-server journaled money. Quote amounts ('100.00') so they stay exact; a plain
  # number is read by its digits with a warning.
  starting-balance: '100.00'
  min-money: '0.00'
  max-money: '10000000000000.00'
  minimum-pay-amount: '0.01'
  offline-pay-enabled: true
  pay-excludes-ignore-list: true
  # Automatic transaction tax deposited into a dedicated economy account (GPExpansion-style layout).
  # Holders of allium.tax.exempt (default: false) skip automatic taxes.
  tax:
    enabled: true
    percent: '5'
    account-name: 'Tax'
    account-in-baltop: true
    account-payable: false
    round-mode: nearest # nearest, floor, ceil
    minimum-tax: '0.00'
    apply-to:
      pay: true
      cheques: false

# Staple tools. Each works with its built-in item and with Nexo, CraftEngine or Oraxen items;
# an item's appearance never changes the tool's behavior.
# Tools (such as the Mob Disarmer) are defined in plugins/Allium/tools/*.yml, one file per tool.
# A tools.mob-disarmer section from an older Allium is moved to tools/mob_disarmer.yml the first
# time this version starts, and is not read after that.

# Message sounds. A lang entry may declare a sound with its own volume and pitch; each one it
# leaves out falls back separately to these defaults.
sounds:
  defaults:
    # Volume of a message sound whose lang entry sets none (0 or more; 1.0 is normal).
    volume: 1.0
    # Pitch of a message sound whose lang entry sets none (0.5 to 2.0).
    pitch: 1.0
  messages:
    # Message sound volume for players who never set their own with /mfx (0 to 1; 0 mutes message
    # sounds by default). It multiplies each message sound's own volume (or sounds.defaults.volume),
    # so a player at 0.5 hears a sound authored at 0.8 at 0.4.
    fallback-volume: 1.0
    # Whether a player's message sound volume (/mfx) also scales the sound they hear when they send
    # a private message (messaging.sent's sound, if it has one). true: /mfx toggle and /mfx volume 0
    # silence both directions. false: only incoming messages follow /mfx.
    scale-sent-sound: true

# Player preferences, stored per UUID in the database above. Players who never chose a value
# follow these defaults, and changing a default here changes it for them too (defaults are never
# written to the database). The default message sound volume is sounds.messages.fallback-volume.
preferences:
  defaults:
    accept-messages: true
    accept-payments: true
    accept-teleport-requests: true
    pvp-enabled: true
  # How long a joining player's login waits (off the server thread) for preferences to load,
  # 0 to 10000. A slower load finishes after join; nothing is enforced from defaults meanwhile.
  preload-wait-millis: 2000
  # A failed load is retried in the background: up to this many times, first after
  # first-delay-millis, then twice as long each time up to max-delay-millis. Until a load
  # succeeds, messages, payments and teleport requests to that player are refused.
  load-retry:
    retries: 4
    first-delay-millis: 1000
    max-delay-millis: 15000
  storage:
    queue-capacity: 512
    # Parallel storage lanes on MySQL; each player's work always runs in order on one lane.
    mysql-lanes: 4
    # How long shutdown waits for queued saves. Saves still unfinished then are logged one by
    # one as not saved, and shutdown continues.
    shutdown-timeout-millis: 10000

# Item library and /give.
items:
  give:
    # What happens when the target's inventory is full. drop: give what fits and drop the rest at
    # their feet. refuse: give nothing unless everything fits. partial: give what fits and report
    # the rest. Override per command with --overflow=<policy>.
    overflow: drop
    # Accept the old item;meta;amount form. Semicolons inside [...], {...} or quotes always work.
    legacy-semicolon-syntax: false
    # When a head's skin cannot be resolved in time (timeout, failure or the lookup limit below):
    # untextured gives the head without its skin (reported as degraded); refuse gives nothing.
    skull-timeout-fallback: untextured
    skull:
      # owner:<name> resolves off the server thread, through a cache shared by every give.
      lookup-timeout-millis: 3000
      cache-size: 256
      cache-minutes: 60
    # Optional provider-aware allow/deny rules and per-item spawn permissions for /give and /i.
    # Rules match canonical provider keys ("bedrock", "minecraft:*_spawn_egg", "allium:*",
    # "craftengine:sf_ores:*", "nexo:*", "oraxen:*"). Bare names mean minecraft:<id>.
    policy:
      # denylist: allow everything except deny (specific allow rules can carve out exceptions).
      # allowlist: deny everything except allow (equal or more specific deny rules still win).
      mode: denylist
      deny: []
      allow: []
      # When true, players also need allium.give.item.<provider>.<id> (or provider/global wildcard)
      # or allium.give.bypass.policy to give an item.
      permission-based-spawn: false
      # Remote profile lookups started per rolling minute; over the limit a head falls back as above.
      max-lookups-per-minute: 30

# Core resource pack (Allium's custom item visuals). Allium generates the pack at build time and
# bundles it in the jar. Players who decline it keep working, named vanilla items.
resource-pack:
  # Who delivers the pack to players. Changes need a restart.
  # none: Allium never sends or exports it (another plugin or server.properties can serve it).
  # standalone: Allium exports it to plugins/Allium/pack/allium-core-pack.zip and sends it with its
  #   SHA-1, either from an external standalone.url or via the built-in standalone.self-host server.
  # rpm-export: Allium writes it into ResourcePackManager's mixer (below) before RPM starts; RPM
  #   merges and sends it. Allium never edits RPM's config or another pack.
  # Before 1.20.3 a player holds one server pack, so exactly one delivery owner is mandatory there.
  # From 1.20.3 Allium adds its pack beside others (server.properties, other plugins) by its own UUID.
  owner: none
  # Deliver a local pack instead of the bundled one, relative to plugins/Allium/ (for example
  # pack/custom-core-pack.zip). It must keep the bundled pack's models and item definitions;
  # only textures may differ. Otherwise Allium warns and delivers the bundled pack.
  # Leave empty for the bundled pack.
  pack-file: ""
  standalone:
    # Where you host plugins/Allium/pack/allium-core-pack.zip (http or https).
    # Ignored when self-host.enabled is true.
    url: ""
    # Download the URL once at startup and send it only if its SHA-1 matches the bundled pack.
    verify-hosted-file: true
    # Built-in HTTP server (no external web host needed). Disabled by default.
    # Enable alongside owner: standalone to serve the pack directly from Allium.
    self-host:
      enabled: false
      # Interface to bind: 0.0.0.0 listens on all interfaces; 127.0.0.1 for local-only testing.
      bind-host: "0.0.0.0"
      # TCP port to listen on (must be open in your firewall / host allocation for remote players).
      port: 8080
      # Public hostname or IP players connect to (e.g. play.example.com). Leave empty to use
      # Bukkit's server-ip, or 127.0.0.1 for local testing when server-ip is blank.
      public-host: ""
      # Optional full URL override (e.g. https://packs.example.com/allium-core-pack.zip behind a
      # reverse proxy). When empty, Allium advertises http://<public-host>:<port>/allium-core-pack.zip.
      public-url: ""
  # Standalone only. true: players must load the pack; declining or a failed download kicks them
  # with kick-message. false: players who decline keep the named vanilla items.
  required: false
  # The text shown with the offer (Allium formatting).
  prompt: "&eThis pack shows Allium's custom tool models. Without it you see named vanilla items."
  kick-message: "&cThis server requires its resource pack. Reconnect and accept it to play."
  rpm-export:
    # ResourcePackManager's mixer directory, relative to plugins/ (or absolute).
    mixer-directory: ResourcePackManager/mixer
    # The only file Allium writes there.
    file-name: Allium_core_resource_pack.zip
    # Report what would be written and any carrier collisions with other packs, but write nothing.
    dry-run: false

# Official addons live in plugins/Allium/addons/.
# Set an addon to true under enabled to load it on startup, or false to keep its jar installed in
# addons/ without starting it. Toggle in-game with /allium addon <list|download|enable|disable>.
# With auto-download: true, any official addon set to true whose jar is missing from addons/ is
# downloaded automatically from GitHub Releases on startup.
addons:
  auto-download: false
  # Must use HTTPS. Custom mirrors require pinned SHA-256 digests under addons.checksums
  # unless the requested release is already pinned in Allium's bundled checksum manifest.
  release-base-url: 'https://github.com/castledking/Allium/releases/download'
  # Leave empty to match this Allium plugin version (e.g. 1.0.0 -> tag v1.0.0).
  release-version: ''
  # Optional trusted SHA-256 hex digests keyed by addon key (e.g. curios: '<64-hex>').
  checksums: {}
  enabled:
    crops: false
    curios: false
    ores: false
    partylocator: false
    spawnercraft: false

# General settings
settings:
  debug: false
  locale: en_US

# Private-message observation. Player spies must explicitly opt in with /socialspy.
messaging:
  socialspy:
    # PRIVACY: enabling this records delivered PM bodies in console/server logs.
    # Blocked attempts, exempt traffic, and console's own PMs are never copied.
    # Console can see vanished players. Log retention/access is the operator's responsibility.
    log-to-console: false

# The shared index of known player names (mail now, /pay later). Completion reads only this
# in-memory cache; a name outside it still resolves when a command runs.
player-names:
  cache-size: 10000

# /mail. Limits are read at the start of each send, so /allium reload applies them to the next
# send and never to one already in progress.
mail:
  # Exact per-send prices; free by default. Gifts hold funds until native sender proof is saved.
  costs:
    text: '0.00'
    gift: '0.00'
  # Most mails (text and gifts) a mailbox holds.
  mailbox-size: 50
  # Longest text body or gift note, in characters.
  body-max-length: 256
  # Text mail is deleted this many days after it was sent; 0 keeps it forever. Gifts never expire,
  # so expiry can never destroy items.
  text-expiry-days: 30
  rate-limit:
    # At most this many mails per player in each window.
    sends: 10
    per-seconds: 60
  gift:
    # Most items (summed amounts) one gift may carry.
    max-items: 64
  notify:
    # "You have N unread mail" on join.
    on-join: true
    # A notice when new mail arrives while the recipient is online on this server.
    new-mail: true

# Shared safe teleport pipeline. Bounds are validated before the settings snapshot is swapped.
end-gateway:
  enabled: true
  # Correct returns near the central End island. Search already-loaded chunks around the exit.
  max-distance-from-center: 512
  search-radius: 5

teleport:
  # Use the saved home named "home" on death before falling back to the configured spawn.
  respawn-at-home: true
  # Opt-in newcomer onboarding: send brand-new players to the group/default spawn on their first join.
  first-join-spawn: false
  # Opt-in: teleport players to the group/default spawn whenever they join.
  spawn-on-join: false
  # Default teleport warmup/delay in seconds (0 = instant). Per-type overrides live under warmups.
  warmup-seconds: 3
  # Per-type teleport warmup/delay overrides in seconds (0 = instant; -1 or omitted = use warmup-seconds).
  # Other commands (tppos, top, bottom, there, tpoffline, jump) and groups (homes, warps, requests) also work.
  warmups:
    home: -1
    warp: -1
    tpa: -1
    tpahere: -1
    back: -1
    spawn: -1
    world: -1
    tp: -1
    tphere: -1
    rtp: -1
  movement-tolerance: 0.1
  request-expiry-seconds: 60
  # Opt-in inbound and outbound PvP grace window in seconds after a teleport completes (0 = disabled).
  arrival-pvp-grace-seconds: 0
  back:
    include-death: false
  cooldowns:
    home: 0
    warp: 0
    tpa: 0
    tpahere: 0
    back: 0
    spawn: 0
    world: 0
    tp: 0
    tphere: 0
    # Random teleport (/rtp): each one may generate new terrain, so keep this generous.
    rtp: 300
  safety:
    enabled: true
    adjust: true
    search-radius: 3
    vertical-search: 4
    avoid-lava: true
    avoid-void: true
    avoid-suffocation: true
    avoid-falls: true
    # Existing chunks are always loaded from disk for a teleport. True also generates terrain
    # that was never generated (on the server thread); false refuses such destinations.
    load-destination-chunk: false
  entity-limits:
    # Maximum pets a player can select at once with /tppet (separate from /tpe).
    tppet-max: 10
    # Maximum entities a player can select at once with /tpe (/tpent).
    tpe-max: 50
    # Maximum entities a single /tphere (/s) or /there command may target (e.g. /s @e).
    tphere-max: 50
    # Seconds a mass-entity selector confirmation (e.g. /s @e) remains valid; 0 disables confirmation.
    confirm-seconds: 15

# Essentials-style /spawnmob settings.
spawnmob:
  # Maximum total entities spawned by a single /spawnmob invocation (1-256).
  limit: 10

# Optional outcomes-aware costs and persistent cooldowns for self-service convenience commands.
# Funds are reserved and captured (and cooldown recorded) ONLY when the command actually delivers
# its effect — refusals, undamaged items, or disconnects are free.
# Supported actions: repair, repair-all, heal, feed, ext, hat, workbench, anvil, disposal,
# grindstone, cartographytable, stonecutter, loom, smithing.
command-policy:
  actions:
    repair:
      cost: '0.00'
      cooldown-seconds: 0
    repair-all:
      cost: '0.00'
      cooldown-seconds: 0
    heal:
      cost: '0.00'
      cooldown-seconds: 0
    feed:
      cost: '0.00'
      cooldown-seconds: 0
    ext:
      cost: '0.00'
      cooldown-seconds: 0
    hat:
      cost: '0.00'
      cooldown-seconds: 0
    workbench:
      cost: '0.00'
      cooldown-seconds: 0
    anvil:
      cost: '0.00'
      cooldown-seconds: 0
    disposal:
      cost: '0.00'
      cooldown-seconds: 0

# Homes use the highest permission grant or staff-assigned minimum, never the sum.
homes:
  default-limit: 1
  overwrite-confirm-seconds: 30
  # Point a player's compass toward their first home when they hold allium.home.compass.
  compass-towards-home-perm: false
  # Opt-in: when a player runs plain /home with no homes set (and no bed fallback), send them to spawn instead of erroring.
  spawn-if-no-home: false
  # UUID: absolute minimum limit; does not downgrade a higher rank. Hard cap: 1000.
  staff-overrides: {}
warps:
  overwrite-confirm-seconds: 30
kits:
  # Opt-in starter kit granted automatically once on a player's first join (leave empty to disable).
  first-join-kit: ''

# Staff feeds in Discord: moderation actions, staff notes, /report and /escalate.
# Each feed posts to its "channel" through DiscordSRV when DiscordSRV is running (a channel ID, or
# the name of a channel in DiscordSRV's own Channels setting, such as "staff"), else to its
# "webhook" (a Discord webhook URL). A feed with neither is off. "mentions" are role IDs pinged
# with each post; nothing a player or staff member types can ping anyone.
discord:
  # Shown under each post; empty for none.
  server-name: ''
  # The name and avatar of webhook posts.
  webhook-name: Allium
  webhook-avatar: ''
  channels:
    # Bans, temporary and IP bans, unbans, mutes, unmutes, kicks, warnings, jails, freezes.
    moderation:
      channel: ''
      webhook: ''
      mentions: []
      # Which actions post: ban, tempban, ipban, unban, mute, unmute, kick, warn, jail, unjail,
      # freeze, unfreeze.
      actions: [ban, tempban, ipban, unban, mute, unmute, kick, warn, jail, unjail, freeze, unfreeze]
    # /notes <player> add <note>
    notes:
      channel: ''
      webhook: ''
      mentions: []
    # /report
    reports:
      channel: ''
      webhook: ''
      mentions: []
    # /escalate and /allium escalate
    escalations:
      channel: ''
      webhook: ''
      mentions: []

# Moderation, discipline, vanish, and mute settings.
moderation:
  discipline:
    # DENY keeps known bans effective and refuses new logins when authoritative data is unavailable.
    # ALLOW trades that protection for availability; already-loaded active bans still refuse login.
    ban-load-failure-policy: DENY
    # IP bans can affect other people sharing an address; never enabled implicitly.
    ip-ban-enabled: false
    exempt-permission: allium.moderation.exempt
    # Console and an explicitly granted allium.moderation.bypass may override the hierarchy.
    # Ordinary staff cannot act on a target with equal or higher action privileges.
    rate-limit-millis: 1000
    # Ascending ranks; holding any permission in a row grants that rank. Bypass stays explicit.
    staff-rank-permissions:
      - allium.mute,allium.unmute,allium.warn,allium.notes
      - allium.freeze,allium.kick
      - allium.jail,allium.tempban
      - allium.ban,allium.ipban
  # /report: staff online with allium.report.receive see each report; it also goes to the reports
  # feed (discord.channels.reports). A player may report once per cooldown
  # (allium.report.cooldown.bypass skips it).
  reports:
    cooldown-seconds: 60
  # How long login waits (off the server thread) for vanish and mute state to load (0-10000 ms).
  preload-wait-millis: 2000
  load-retry:
    retries: 4
    first-delay-millis: 1000
    max-delay-millis: 15000
  vanish:
    # Block public chat while vanished so staff cannot accidentally reveal themselves.
    allow-public-chat: false
  mute:
    # When true (default), speech is blocked while a joining player's mute state is still loading
    # or failed to load. Outage cost: during a DB outage, unmuted joining players cannot chat or
    # use muted-commands until background retries succeed (or this switch is disabled and reloaded).
    fail-closed: true
    # Canonical commands blocked while muted (resolved through Bukkit's CommandMap by identity,
    # automatically covering aliases and namespaced forms such as /w, /tm, /minecraft:tell,
    # /minecraft:me, /minecraft:say, and /minecraft:teammsg).
    muted-commands:
      - /me
      - /say
      - /tell
      - /minecraft:msg
      - /teammsg
      - /msg
      - /allium:msg
      - /reply
      - /allium:reply
      - /mail send
      - /allium:mail send
      - /mail gift
      - /allium:mail gift

# Player info utilities: /list, /seen, /whois, /near, /afk.
info:
  whois:
    # Clickable lines at the end of /whois for holders of allium.whois.extra. {player} and {uuid}
    # are replaced. click: run-command, suggest-command, copy-to-clipboard or open-url.
    # permission (optional) hides an action from staff without it. Remove an entry to drop it.
    actions:
      coreprotect:
        text: "&e[CoreProtect] &fLook up diamond ore mined in the last 4 weeks"
        hover: "&7Click to run a CoreProtect lookup of {player}'s mined diamond ore."
        click: run-command
        value: "/co l u:{player} b:diamond_ore t:4w r:#global"
      litebans:
        text: "&e[LiteBans] &fView punishment history for {player}"
        hover: "&7Click to view {player}'s punishment history."
        click: run-command
        value: "/history {player}"
      chatsentry:
        text: "&e[ChatSentry] &fLook up chat violations"
        hover: "&7Click to look up {player}'s chat violations (ChatSentry)."
        click: run-command
        value: "/kcs lookup player:{player}"
  list:
    # Group visible online players by permission group (allium.list.group.<name> or Vault primary group).
    group-by-permission: true
    default-group: "Players"
    groups:
      - owner
      - admin
      - mod
      - staff
      - vip
  near:
    default-radius: 200
    max-radius: 500
  afk:
    # Seconds of inactivity before entering AFK automatically (0 disables auto-AFK).
    auto-afk-seconds: 300
    # Kick AFK players after kick-after-seconds (off by default).
    kick-on-afk: false
    kick-after-seconds: 600
    broadcast: true
    ignore-sleep: true

# /playtime and %allium_firstjoindate%: how the first-join date is written (Java date pattern, in the
# server's time zone).
playtime:
  date-format: 'MMM d, yyyy'

# The message of the day: plugins/Allium/motd.txt, shown by /motd and on join to holders of
# allium.motd (default true). /rules shows rules.txt and /info info.txt. All use custom.txt's layout
# and formatting tags.
motd:
  show-on-join: true
  # Ticks to wait after joining (0-200), so the MOTD follows the join messages.
  join-delay-ticks: 10

# Timed flight: /fly for players without allium.fly, spending time staff give with
# /fly <player> add <time>. The time runs from /fly until the player turns it off or it runs out,
# in the air or not. With count-only-while-flying: true it runs only while they are in the air.
# Creative and spectator never spend it. /allium reload applies a change.
timed-flight:
  count-only-while-flying: false

# Timed broadcasts: every interval-seconds, the next #section of plugins/Allium/broadcasts.txt goes
# to everyone online with allium.broadcasts.receive (default true) and to the console. Off by
# default. /broadcasts lists them; /broadcasts send <name> and /broadcasts next send one now.
broadcasts:
  enabled: false
  # 10-86400
  interval-seconds: 300
  # sequential (the file's order) or random (never the same one twice in a row)
  order: sequential
  # Skip a turn while fewer unvanished players than this are online.
  minimum-players: 1

# Opt-in sign types: color, warp, kit, balance, heal, repair, disposal, workbench, anvil,
# cartography, grindstone, loom, smithing, mail, info, gamemode, time, weather,
# randomteleport (alias rtp), free, enchant, spawnmob, buy, sell.
# Legacy colour is accepted as color. One shared click limit across all types.
enabledSigns:
  #- color
  #- warp
  #- kit
  #- balance
  #- heal
  #- repair
  #- disposal
  #- workbench
  #- anvil
  #- cartography
  #- grindstone
  #- loom
  #- smithing
  #- mail
  #- info
  #- gamemode
  #- time
  #- weather
  #- randomteleport
  #- free
  #- enchant
  #- spawnmob
  #- buy
  #- sell
sign-use-per-second: 4
# Display sign prices above 999 in compact K/M/B/T form (for example $1K, $1.1K, $1M).
sign-short-prices: true
# When true, admins may place priced kit/command signs costing less than the configured kit/command price.
unsafe-sign-prices: false
# Automatically convert legacy Essentials dark-blue [Type] signs into Allium signs when chunks load or players click them.
# Also enabled automatically after running /allium import essentials apply.
adopt-essentials-signs: false

# Static safe public chat; formatting does not require Vault. Optional peers supply decorations.
enable-chat-formatting: true
chat-format:
  default: '<prefix><display_name>&f: <message>'
  # Per-group chat formats (matched against the player's primary group).
  # Replace 'groups: {}' with 'groups:' and uncomment entries to customize per group:
  #   owner: '&c[Owner] <prefix><display_name>&f: <message>'
  #   admin: '&4[Admin] <prefix><display_name>&f: <message>'
  #   default: '<prefix><display_name>&7: <message>'
  groups: {}
chat-hover:
  # Staff see the deletion hint and ID at the bottom of the selected hover.
  delete-hover-mode: prefix
  groups: {}
join-and-quit-messages:
  join:
    enabled: true
    format: '&e%name% &7has joined the server'
  quit:
    enabled: true
    format: '&e%name% &7has left the server'
  # Opt-in once-only welcome broadcast for brand-new players (suppressed when vanished or jailed).
  first-join:
    enabled: false
    format: '&dWelcome &f%name% &dto the server for the first time!'
  broadcast-scope: server
chat:
  max-message-length: 512
  replay-packets-per-tick: 64
  deletion_resend:
    clear_lines: 500
    header_enabled: false
    header: '&8&oChat re-synced by staff; a message was deleted'
  channels:
    enabled: true
    default-write-channel: default
    staff-channel: staff-chat
    local-channel:
      radius: 100
      format: '&8[Local] <display_name>&f: <message>'
      # Keep local proximity chat out of Discord by default; set false + discord-channel-id to opt in.
      exclude-from-discord: true
    list:
      default:
        display-name: Global
        aliases: [g, global, shout]
        format: '<prefix><display_name>&f: <message>'
        discord-channel-id: ''
        discord-out-format: '{player}: {message}'
        discord-in-format: '&8[Discord] &f{discord_username}: {message}'
      staff-chat:
        display-name: Staff
        aliases: [a, ac, amsg, staffchat]
        format: '&8[Staff] <prefix><display_name>&f: <message>'
        discord-channel-id: ''
        webhook-delivery: false
  # /me (/action): sent to everyone online like chat; deletable with /delmsg, never relayed to Discord.
  action-format: '&5* <display_name> &5<message>'
  # @<player> mentions in chat (requires allium.chat.mention, default true).
  mentions:
    enabled: true
    color: '&e'
    sound: 'minecraft:entity.experience_orb.pickup'
    volume: 0.8
    pitch: 1.5
  # EssentialsChat-style global questions from local chat (requires allium.chat.question, default true).
  question:
    enabled: true
    prefix: '?'
    format: '&e[Question] &r<prefix><display_name>&f: <message>'
  # Require allium.chat.url (default op) to post links in chat.
  urls:
    enabled: true
  # Opt-in chat phrase, repeat-similarity, and rate-limit filter with auditable staff alerts.
  # Staff with allium.chat.filter.bypass are exempt; staff with allium.chat.filter.alerts receive notices.
  filter:
    enabled: false
    # block = stop message delivery/relay; alert-only = log & alert staff without blocking (staging/tuning).
    mode: block
    exempt-staff-channel: true
    notify-staff: true
    # Records CHAT_FILTER entries in the moderation audit log when the moderation module is enabled.
    audit-to-moderation: true
    phrases:
      enabled: true
      normalize-substitutions: true
      join-split-letters: true
      tokens: []
      phrases: []
      substrings: []
      exceptions: []
    repeat:
      enabled: true
      window-seconds: 15
      max-similar: 2
      similarity-threshold: 0.85
      strip-flood-suffix: true
      whitelist: [gg, wb, ty, welcome]
    rate-limit:
      enabled: true
      min-interval-millis: 1000
      burst-max: 5
      burst-window-seconds: 10

# UUID:rank entries are one-time claims. The console runs the selected rank's commands in order.
# Commands can use {player} and {uuid}. The claimed list is maintained by Allium.
redeem-settings:
  players-to-redeem: []
  commands-to-run: {}
  claimed: []
# Commands run by console when staff runs /spectate <player>.
# Placeholders: {player} (spectator), {target} (target). Prefix with "player:" to run as the spectator.
spectate-commands:
  - 'tp {player} {target}'
  - 'gmsp {player}'
nickname:
  max-length: 32
  gradientplus-enabled: true
  animate-tab: false
  updates-per-tick: 16

# Unsafe enchantments require this switch and allium.enchant.unsafe.
allow-unsafe-enchants: false

# Creative manager (modules.creative). In creative mode, each action needs
# allium.gamemode.creative.<place|break|interact|use|drop|pickup|container|spawn> (op by default).
creative-manager:
  # Keep creative and survival/adventure inventories apart. The inventory not in use is stored in
  # the player's own data file. Holders of allium.gamemode.creative.inventory keep one shared
  # inventory.
  separate-inventories: true
  # Put staff back into creative or spectator on join when the server reset their gamemode
  # (force-gamemode), if they still hold allium.gamemode.<mode>.
  restore-gamemode-on-join: true
  # Tell holders of allium.alerts when someone is in creative or spectator without that mode's node.
  audit: true
  # Seconds between two "not allowed" messages to one player.
  message-cooldown-seconds: 10
  # Creative players cannot light TNT (flint and steel, fire charges, burning arrows...) unless they
  # hold allium.gamemode.creative.blacklist.
  protect-tnt: true
  # Refused in creative mode unless the player holds allium.gamemode.creative.blacklist. Names as in
  # Bukkit, e.g. TNT, WITHER.
  blacklist:
    # Blocks that cannot be placed, broken or right-clicked.
    blocks: []
    # Entities: spawn eggs, armor stands, paintings, minecarts...
    entities: []
    # Items that cannot be used (right-clicked, emptied) or taken from the creative menu.
    items: [FLINT_AND_STEEL, FIRE_CHARGE, LAVA_BUCKET]
    # Commands: a command (give), or one with its first arguments (gamemode survival).
    commands: []
  # Blocks placed in creative mode are remembered (in each chunk's own data), so they never become
  # survival loot. Holders of allium.gamemode.creative.loot get the normal drops.
  placed-blocks:
    enabled: true
    # When a player who is not in creative breaks one: no-drops (it breaks and drops nothing) or deny.
    # Explosions, liquids and leaf decay remove them without drops; pistons and falling keep the mark,
    # and plants and trees grown from them are marked too.
    survival-break: no-drops
    # Iron golems, snow golems and withers built from them are not spawned.
    prevent-mob-builds: true
  # Lore added to items taken from the creative menu ({item}, {player}, {uuid}), so they can always be
  # told apart. Holders of allium.gamemode.creative.untagged take items without it.
  item-lore:
    enabled: true
    lines:
      - '&5Creative {item}'
      - '&7Taken by {player}'
  # Items taken from the creative menu. Holders of allium.gamemode.creative.any-item are exempt.
  menu-items:
    # Remove custom (plugin) data, attribute modifiers, the unbreakable flag and enchantments above
    # their highest level, which only modified clients put on creative items.
    sanitize: true
    refuse-enchanted: true
    # Potions, splash and lingering potions, tipped arrows and stews with an effect.
    refuse-potions: true
  # Clear potion effects when a player enters or leaves creative (allium.gamemode.creative.keep-effects
  # keeps them).
  clear-effects-on-switch: true
  # Players in restricted creative (creative without allium.gamemode.creative.bypass) glow in this
  # colour (light_purple, red, gold... or rainbow), over any /glow they set, unless they hold
  # allium.gamemode.creative.own-glow. Coloured glow needs PacketEvents; without it the glow is white.
  glow:
    enabled: false
    color: light_purple
  # Armour worn while in creative. It cannot be taken off and is removed on leaving creative; with one
  # shared inventory the player's own armour comes back. allium.gamemode.creative.own-armor skips it.
  armor:
    enabled: true
    helmet: {material: LEATHER_HELMET, name: '&6Creative Helmet', lore: ['&7Worn while in creative mode'], color: '#FF55FF'}
    chestplate: {material: LEATHER_CHESTPLATE, name: '&6Creative Chestplate', lore: ['&7Worn while in creative mode'], color: '#FF55FF'}
    leggings: {material: LEATHER_LEGGINGS, name: '&6Creative Leggings', lore: ['&7Worn while in creative mode'], color: '#FF55FF'}
    boots: {material: LEATHER_BOOTS, name: '&6Creative Boots', lore: ['&7Worn while in creative mode'], color: '#FF55FF'}

# Alt detection (modules.alts). Every join records the player's IP. An account that first joined
# from an IP an older account already used is an alt.
alts:
  # Add the group below as a parent of each alt (through LuckPerms' command when LuckPerms is
  # installed, else Vault). /altexempt add removes it and keeps the account out.
  assign-group: true
  group: alt
  # Tell holders of allium.alerts when an alt joins.
  notify-staff: true
  # How many linked accounts /seen and /whois list.
  max-listed: 10
  # Skip players connecting from a loopback address (127.0.0.1, ::1). Behind a proxy without IP
  # forwarding every player shares the proxy's address and would otherwise all be "alts".
  ignore-local-addresses: true

# Player PvP toggle (/pvp) and optional same-IP alt protection.
pvp:
  # Block PvP between players sharing an IP when the victim is in the alt group (alts.group).
  protect-same-ip-alts: true
  # Notify the attacker (rate-limited) when a hit is blocked by /pvp off or alt protection.
  notify-blocked: true
  # Minimum milliseconds between blocked-PvP notifications per attacker.
  notify-cooldown-millis: 2500

# Inventory snapshots and /restore (modules.restore).
restore:
  # When to save a snapshot: death, login, logout, world-change, gamemode-change, autosave.
  snapshot-on: [death, login, logout, world-change, gamemode-change, autosave]
  autosave-minutes: 10
  # Snapshots older than this are deleted (0 keeps them until the per-player cap removes them).
  retention-days: 14
  # Only the newest snapshots of each player are kept.
  max-snapshots-per-player: 50

# Interactive PowerTools (/pt, behavior: allium:powertool in plugins/Allium/tools/*.yml).
powertools:
  enabled: true
  # Console commands allowed in console powertool actions. Entries may be a namespace prefix
  # ending with ':' (e.g. 'allium:'), a specific command (e.g. 'minecraft:effect'), or '*' to allow all.
  console-allowlist:
    - "allium:"
    - "minecraft:effect"
    - "minecraft:particle"
    - "minecraft:playsound"
    - "minecraft:title"
    - "minecraft:tellraw"
  # Reject @a/@e/@p/@r/@s target selectors inside console powertool commands.
  block-selectors: true

# Restraints: the powertool ride action's restrain option, which the Handcuffs (tools/handcuffs.yml)
# use. A restrained player rides whoever restrained them and cannot get down, break, place, use or
# drop items, attack or be hurt, or run commands other than these (labels, e.g. msg or allium:msg).
restraints:
  allowed-commands: []
  # Run by the console when a restrained player logs out; {player} is their name.
  commands-on-quit:
    - ban {player} Logged out while restrained

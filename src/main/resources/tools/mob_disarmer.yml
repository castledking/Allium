# Mob Disarmer: a tool definition. Allium loads every .yml file in plugins/Allium/tools/ at
# startup; edit the file and restart to apply changes.
#
# A definition binds an item identity to a core behavior and supplies that behavior's settings.
# The behavior owns how the tool acts, and settings cannot change those steps: allium:disarm
# takes the mob's equipment before anything drops, rolls each piece's drop once, puts everything
# back if the tool cannot be updated, spends a charge only on a successful disarm, and asks
# protection plugins first. A definition with any invalid setting is not loaded at all, and the
# log names the file and the setting.
# Settings left out use the defaults shown here. See docs/tools.md for every setting.
schema: 1

# The tool's signed item identity. Never change it once tools exist: stacks carry it.
id: allium:mob_disarmer
name: Mob Disarmer
behavior: allium:disarm
enabled: true

appearance:
  # What new and imported disarmers look like: allium:mob_disarmer (built-in), nexo:<id>,
  # oraxen:<id> or craftengine:<namespace>:<id>. Vanilla items are not accepted.
  default: allium:mob_disarmer
  # Provider items that act as Mob Disarmers when issued by their provider (e.g. /nexo give).
  aliases: []
  # Optional charge-variant sets. A disarmer shown as any item in a set is swapped to the set's
  # entry for its new charge count ('broken' for a broken tool, else '0'), keeping its charges,
  # instance UUID and MAC. Counts without an entry and items in no set keep their appearance.
  # Swapping rebuilds the item from its provider definition, so custom names are not kept.
  charge-variants: {}
  #  sf:
  #    '3': nexo:mob_disarmer
  #    '2': nexo:mob_disarmer_2-3
  #    '1': nexo:mob_disarmer_1-3
  #    '0': nexo:mob_disarmer_0-3

charges:
  max: 3
  # Spending the last charge starts one timer; the tool refills completely when it ends.
  recharge-seconds: 120
  break-chance:
    # none: never breaks. legacy: 3% per spent charge, 5% on the final charge (pre-recode Allium).
    # custom: the values below. Each charge-spending disarm rolls once.
    preset: none
    per-charge: 0.0
    final-charge: 0.0

targets:
  # Maximum distance in blocks between player and mob. 0 leaves reach checks to the server.
  radius: 6.0
  # Mob types that cannot be disarmed. Players and armor stands never can.
  excluded-mobs: [ender_dragon, wither, elder_guardian, warden]
  # Skip entities other plugins mark as NPCs (e.g. Citizens).
  exclude-npcs: true

disarm:
  # Which removed pieces drop; the rest are destroyed. Either way the slot's drop chance is
  # then set to 0, so killing the mob cannot drop them again.
  # slot-chance: each piece rolls its slot's own drop chance once (2.0 for gear a mob picked up,
  #   0.085 for natural spawn gear). Villager gear and an enderman's carried block always drop.
  #   This is pre-recode Allium's behavior.
  # always: every removed piece drops.
  drop-rule: slot-chance
  # Seconds a disarmed mob cannot pick items up, so it cannot re-equip at once. 0 disables.
  pickup-block-seconds: 120

timing:
  # A second charge-spending click from one player within this many milliseconds is ignored.
  click-guard-millis: 200
  # Minimum milliseconds between charge status messages from right-clicking air.
  status-cooldown-millis: 1000

sounds:
  # Played at the mob on a disarm. Set sound to "" for none.
  disarm:
    sound: minecraft:item.shield.break
    volume: 1.0
    pitch: 1.2

permissions:
  # Who may use the tool, and who disarms without spending charges or breaking it. Nodes that no
  # plugin.yml declares default to everyone for use and to operators for bypass.
  use: allium.mobdisarmer.use
  bypass: allium.mobdisarmer.bypass

# Lang keys for this tool's messages, from lang/<locale>.yml. Each one left out uses the Mob
# Disarmer's own entry (tool.mob-disarmer.<name>; no-permission uses error.no-permission).
# Names: no-permission, disarmed, disarmed-bypass, last-charge, broke, broken, recharging, status,
# status-bypass, player-target, excluded, too-far, protected, protected-reason, single-item,
# update-failed.
messages: {}

# Allium language: text lines plus optional "[sound] id [pitch] [volume]".
# Volume omitted below: use the configured server default.

prefix: "&7[&dAllium&7]"
core:
  reload-success:
    - "{prefix} &aConfiguration reloaded."
    - "[sound] block.note_block.chime 1.35"
  reload-failed:
    - "{prefix} &cReload failed. Check console for details."
    - "[sound] block.note_block.bass 0.75"
  version:
    - "{prefix} &fRunning Allium &dv{version}&f."
    - "[sound] ui.button.click 1.25"
  modguard:
    reloaded:
      - "{prefix} &aModGuard settings reloaded."
      - "[sound] block.note_block.chime 1.35"
    reload-failed:
      - "{prefix} &cModGuard reload failed. Check console for details."
      - "[sound] block.note_block.bass 0.75"
    alerts-on:
      - "{prefix} &aModGuard alerts enabled."
      - "[sound] block.note_block.chime 1.2"
    alerts-off:
      - "{prefix} &cModGuard alerts muted."
      - "[sound] block.note_block.bass 0.9"
  addon:
    unknown:
      - "{prefix} &cUnknown addon '&f{addon}&c'. Use &f/allium addon list&c."
      - "[sound] block.note_block.bass 0.8"
    list-header:
      - "{prefix} &dAllium Addons &7(plugins/Allium/addons/):"
    list-entry:
      - " &8- &f{addon} &8(&7{key}&8): {status} &8- &7{description}"
    already-installed:
      - "{prefix} &e{addon} &7is already installed (&f{file}&7)."
      - "[sound] block.note_block.bass 0.9"
    already-installed-disabled:
      - "{prefix} &e{addon} &7is already installed in &faddons/&7 but disabled. Run &f/allium addon enable {key} &7and restart the server."
      - "[sound] block.note_block.bass 0.9"
    download-in-progress:
      - "{prefix} &e{addon} &7is already downloading."
    download-started:
      - "{prefix} &7Downloading &f{addon} &7(v{version}) from GitHub Releases..."
    download-complete:
      - "{prefix} &aDownloaded &f{addon} &7(&f{file}&7) and set &faddons.enabled.{key}: true &ain config.yml. &eRestart the server to load it."
      - "[sound] block.note_block.chime 1.35"
    download-failed:
      - "{prefix} &cFailed to download &f{addon}&c: &f{reason}"
      - "[sound] block.note_block.bass 0.75"
    already-enabled:
      - "{prefix} &e{addon} &7is already enabled in config.yml."
    already-disabled:
      - "{prefix} &e{addon} &7is already disabled in config.yml."
    enabled-restart:
      - "{prefix} &aEnabled &f{addon} &7(&faddons.enabled.{key}: true&7). &eRestart the server to start it."
      - "[sound] block.note_block.chime 1.25"
    enabled-not-installed:
      - "{prefix} &aEnabled &f{addon} &7in config.yml, but its jar is not in &faddons/&7 yet. Run &f/allium addon download {key} &7or enable &faddons.auto-download &7and restart."
      - "[sound] block.note_block.chime 1.1"
    disabled-restart:
      - "{prefix} &cDisabled &f{addon} &7(&faddons.enabled.{key}: false&7). Its jar stays in &faddons/&7; &erestart the server for the change to take effect."
      - "[sound] block.note_block.bass 0.9"
    config-save-failed:
      - "{prefix} &cCould not save config.yml while updating &f{addon}&c. Check console for details."
      - "[sound] block.note_block.bass 0.75"
  import:
    lang-no-source:
      - "{prefix} &cNo pre-recode lang file at &f{file}&c."
      - "[sound] block.note_block.bass 0.8"
    lang-report:
      - "{prefix} &7{mode}: &f{write} &7to write, &f{same} &7already imported, &f{kept} &7kept (customized), &f{unmapped} &7not portable yet. Details are in the console."
      - "[sound] item.book.page_turn 1.0"
    lang-applied:
      - "{prefix} &aImported &f{write} &amessage(s) into &f{file}&a; the old file is backed up as &f{backup}&a."
      - "[sound] entity.player.levelup 1.35"
    lang-nothing:
      - "{prefix} &aNothing to import; &f{file} &ais up to date."
      - "[sound] block.note_block.hat 1.15"
    lang-failed:
      - "{prefix} &cThe lang import failed: &f{reason}"
      - "[sound] block.note_block.bass 0.75"
    vouchers-no-source:
      - "{prefix} &cNo legacy vouchers file at &f{file}&c."
      - "[sound] block.note_block.bass 0.8"
    vouchers-report:
      - "{prefix} &7{mode}: &f{write} &7powertool(s) to write, &f{same} &7already imported, &f{kept} &7kept (another tool has the name), &f{blocked} &7blocked. Details are in the console."
      - "[sound] item.book.page_turn 1.0"
    vouchers-applied:
      - "{prefix} &aWrote &f{write} &apowertool(s) to &ftools/ &aand loaded them; give one with &f/pt give <player> <tool>&a."
      - "[sound] entity.player.levelup 1.35"
    vouchers-nothing:
      - "{prefix} &aNothing to import; every voucher already has its powertool."
      - "[sound] block.note_block.hat 1.15"
    vouchers-failed:
      - "{prefix} &cThe voucher import failed: &f{reason}"
      - "[sound] block.note_block.bass 0.75"
    legacy-started:
      - "{prefix} &7Reading the legacy Allium database for {mode}..."
      - "[sound] block.note_block.hat 1.15"
    legacy-dry-run:
      - "{prefix} &aDry run &f{run}&a. Homes: &f{homes}&a. Warps: &f{warps}&a. Logout positions: &f{logouts}&a. Review &f{summary}&a, then run &f/allium import legacy apply {run}&a."
      - "[sound] item.book.page_turn 1.0"
    legacy-applied:
      - "{prefix} &aImported &f{run}&a. Homes: &f{homes}&a. Warps: &f{warps}&a. Logout positions: &f{logouts}&a. Details are in &f{summary}&a."
      - "[sound] entity.player.levelup 1.35"
    legacy-refused:
      - "{prefix} &cImport refused: &f{reason}"
      - "[sound] block.note_block.bass 0.8"
    legacy-failed:
      - "{prefix} &cThe legacy import failed: &f{reason}"
      - "[sound] block.note_block.bass 0.75"
    legacy-fence:
      - "&cThe server is importing legacy data. Try again in a minute."
    essentials-started:
      - "{prefix} &7Reading Essentials data for {mode}..."
    essentials-dry-run:
      - "{prefix} &aEssentials dry run &f{run}&a: &f{import} &ato import, &f{present} &apresent, &f{conflicts} &aconflicts, &f{blocked} &ablocked. Review &f{summary}&a, then run &f/allium import essentials apply {run}&a."
      - "[sound] item.book.page_turn 1.0"
    essentials-applied:
      - "{prefix} &aEssentials import &f{run} &aapplied: &f{applied} &aapplied, &f{adopted} &aadopted, &f{conflicts} &aconflicts. Details: &f{summary}&a."
      - "[sound] entity.player.levelup 1.35"
    essentials-refused:
      - "{prefix} &cEssentials import refused: &f{reason}"
      - "[sound] block.note_block.bass 0.8"
    essentials-failed:
      - "{prefix} &cEssentials import failed: &f{reason}"
      - "[sound] block.note_block.bass 0.75"
  adopt-window:
    opened:
      - "{prefix} &ePre-recode privileged tools are adopted on first use for the next &f{duration}&e. Every adoption is logged. Close it early with &f/allium adopt-window off&e."
      - "[sound] block.beacon.activate 1.25"
    closed:
      - "{prefix} &aThe adoption window is closed."
      - "[sound] block.beacon.deactivate 1.0"
    status:
      - "{prefix} &7The adoption window is &f{state}&7."
      - "[sound] ui.button.click 1.1"
error:
  no-permission:
    - "{prefix} &cYou don't have permission to do that."
    - "[sound] entity.villager.no 1.0"
  player-only:
    - "{prefix} &cThis command can only be used by players."
  console-only:
    - "{prefix} &cThis command can only be used from the console."
    - "[sound] entity.villager.no 0.95"
  invalid-args:
    - "{prefix} &cUsage: &f{usage}"
    - "[sound] ui.button.click 0.75"
  player-not-found:
    - "{prefix} &cPlayer &f{player} &cnot found."
    - "[sound] block.note_block.bass 0.8"
  number-invalid:
    - "{prefix} &c'{input}' is not a valid number."
    - "[sound] block.note_block.bass 0.8"
  world-not-found:
    - "{prefix} &cWorld &f{world} &cnot found."
    - "[sound] block.note_block.bass 0.8"
  cooldown-active:
    - "{prefix} &cPlease wait &f{time} &cbefore using this again."
    - "[sound] block.note_block.hat 0.85"
  module-disabled:
    - "{prefix} &cThis feature is currently disabled."
    - "[sound] entity.villager.no 0.9"
teleport:
  selection:
    - "{prefix} &e{message}"
  offline-success:
    - "{prefix} &aTeleported to &f{target}&a's last saved logout location."
    - "[sound] entity.enderman.teleport 1.2"
  offline-unavailable:
    - "{prefix} &cNo saved offline location is available for that player."
    - "[sound] block.note_block.bass 0.8"
  ungenerated:
    - "{prefix} &cThat destination is in terrain this world never generated."
    - "[sound] block.note_block.bass 0.8"
  success:
    - "{prefix} &aTeleported to &f{target}&a."
    - "[sound] entity.enderman.teleport 1.15"
  position-success:
    - "{prefix} &aTeleported to &f{x}, {y}, {z}&a in &f{world}&a."
    - "[sound] entity.enderman.teleport 1.15"
  request-sent:
    - "{prefix} &aTeleport request sent to &f{player}&a."
    - "[sound] block.note_block.pling 1.35"
  request-received:
    - "{prefix} &f{player} &awants to teleport to you. &f/tpaccept &aor &f/tpdeny"
    - "[sound] block.note_block.bell 1.25"
  accepted:
    - "{prefix} &aTeleport request accepted."
    - "[sound] block.note_block.pling 1.5"
  denied:
    - "{prefix} &cTeleport request denied."
    - "[sound] block.note_block.bass 0.8"
  cancelled:
    - "{prefix} &cTeleport request expired."
    - "[sound] block.note_block.bass 0.75"
  back:
    - "{prefix} &aReturned to your previous location."
    - "[sound] entity.enderman.teleport 0.95"
  back-death:
    - "{prefix} &aReturned to your death location."
    - "[sound] entity.enderman.teleport 0.95"
  back-on-death:
    - "{prefix} &eUse &f/back &eto return to your death location."
    - "[sound] block.note_block.bell 1.0"
  no-back:
    - "{prefix} &cNo previous location to return to."
    - "[sound] block.note_block.bass 0.8"
  no-pending:
    - "{prefix} &cYou have no pending teleport requests."
    - "[sound] block.note_block.bass 0.85"
  here-received:
    - "{prefix} &f{player} &awants you to teleport to them. &f/tpaccept &aor &f/tpdeny"
    - "[sound] block.note_block.bell 1.15"
  request-cancelled:
    - "{prefix} &cTeleport request cancelled."
    - "[sound] block.note_block.hat 0.8"
  warmup:
    - "[actionbar] &eTeleporting in &f{warmup}s&e. Stay still and avoid damage."
    - "[sound] block.note_block.chime 1.0"
  interrupted:
    - "{prefix} &cTeleport cancelled: {reason}."
    - "[sound] item.shield.break 1.15"
  refused:
    - "{prefix} &c{player} can't receive teleports right now."
    - "[sound] entity.villager.no 1.0"
  world-denied:
    - "{prefix} &cYou don't have permission to enter world &f{world}&c."
    - "[sound] entity.villager.no 0.9"
  loading:
    - "{prefix} &cYour teleport data is still loading. Try again shortly."
    - "[sound] block.note_block.hat 0.9"
  storage-failed:
    - "{prefix} &cTeleport data could not be saved. Try again shortly."
    - "[sound] block.note_block.bass 0.7"
  unsafe:
    - "{prefix} &cNo safe destination was found. Nothing was teleported."
    - "[sound] item.shield.break 0.95"
  top-none:
    - "{prefix} &cThere is no safe place to stand above you."
    - "[sound] block.note_block.bass 0.8"
  bottom-none:
    - "{prefix} &cThere is no safe place to stand below you."
    - "[sound] block.note_block.bass 0.8"
  busy:
    - "{prefix} &cA teleport is already pending. Try again shortly."
    - "[sound] block.note_block.hat 0.85"
  self:
    - "{prefix} &cYou can't request a teleport to yourself."
    - "[sound] block.note_block.bass 0.8"
  toggle-on:
    - "{prefix} &a{player} now accepts teleport requests."
    - "[sound] block.note_block.pling 1.4"
  toggle-off:
    - "{prefix} &c{player} no longer accepts teleport requests. Incoming requests cancelled."
    - "[sound] block.note_block.bass 0.85"
  tpaall-sent:
    - "{prefix} &aSent teleport-here requests for &f{target} &ato &f{count} &aplayer(s)."
    - "[sound] block.note_block.pling 1.3"
  tpaall-none:
    - "{prefix} &7No eligible online players were found for teleport requests."
    - "[sound] block.note_block.hat 0.9"
  auto-on:
    - "{prefix} &aAuto-accept teleport requests enabled for &f{player}&a."
    - "[sound] block.note_block.pling 1.4"
  auto-off:
    - "{prefix} &7Auto-accept teleport requests disabled for &f{player}&7."
    - "[sound] block.note_block.bass 0.85"
  auto-accepted:
    - "{prefix} &aAutomatically accepted teleport request from &f{player}&a."
    - "[sound] block.note_block.pling 1.5"
  jump-none:
    - "{prefix} &cNo block in sight to jump to."
    - "[sound] block.note_block.bass 0.8"
  all:
    - "{prefix} &aTeleported &f{count} &aplayer(s) to &f{player}&a."
    - "[sound] entity.enderman.teleport 1.1"
  all-none:
    - "{prefix} &7No other online players to teleport."
    - "[sound] block.note_block.bass 0.85"
  entity-limit-exceeded:
    - "{prefix} &cSelection matched &f{count} &centities, which exceeds the maximum limit of &f{limit}&c."
    - "[sound] block.note_block.bass 0.75"
  selector-confirm:
    - "{prefix} &eTargeted &f{count} &e{label}. Run &f{command} &eagain within &f{seconds}s &eto confirm the teleport."
    - "[sound] block.note_block.bell 1.0"
  entities-moved:
    - "{prefix} &aTeleported &f{count} &a{label}."
    - "[sound] entity.enderman.teleport 1.05"
  arrival-pvp-target:
    - "{prefix} &c{player} &eis briefly protected from PvP after teleporting."
    - "[sound] item.shield.block 1.1"
  arrival-pvp-self:
    - "{prefix} &eYou are briefly protected from PvP after teleporting."
    - "[sound] item.shield.block 1.1"
  world-list:
    - "{prefix} &fAvailable worlds: &d{worlds}"
    - "[sound] ui.button.click 1.1"
  world-success:
    - "{prefix} &aTeleported to world &f{world}&a."
    - "[sound] entity.enderman.teleport 1.05"
spawnmob:
  list:
    - "{prefix} &6Available mobs: &f{mobs}"
    - "[sound] ui.button.click 1.2"
  spawned:
    - "{prefix} &aSpawned &f{count} &a{mob}&a."
    - "[sound] entity.experience_orb.pickup 1.1"
  limit:
    - "{prefix} &eAmount reduced to the server spawn limit (&f{limit}&e)."
    - "[sound] block.note_block.hat 0.9"
  invalid-mob:
    - "{prefix} &cUnknown or unspawnable mob: &f{mob}&c."
    - "[sound] block.note_block.bass 0.75"
  no-perm-mob:
    - "{prefix} &cYou don't have permission to spawn &f{mob}&c."
    - "[sound] entity.villager.no 0.9"
  no-stack:
    - "{prefix} &cYou don't have permission to stack mobs."
    - "[sound] entity.villager.no 0.9"
  invalid-amount:
    - "{prefix} &cAmount must be a positive whole number."
    - "[sound] block.note_block.bass 0.75"
  unable:
    - "{prefix} &cUnable to spawn that mob here."
    - "[sound] block.note_block.bass 0.75"
  data-list:
    - "{prefix} &7Available data for &f{mob}&7: &f{data}"
    - "[sound] ui.button.click 1.2"
travel:
  loading:
    - "{prefix} &cTravel data is loading. Try again shortly."
    - "[sound] block.note_block.hat 0.9"
  busy:
    - "{prefix} &cTravel storage is busy. Try again shortly."
    - "[sound] block.note_block.hat 0.85"
  storage-failed:
    - "{prefix} &cTravel data could not be saved. Try again shortly."
    - "[sound] block.note_block.bass 0.7"
  name-invalid:
    - "{prefix} &cUse 1-32 letters, digits, underscores or hyphens for the name."
    - "[sound] block.note_block.bass 0.8"
  confirm:
    - "{prefix} &eThis name already exists. Run &f{command} &eto confirm the captured location."
    - "[sound] block.note_block.bell 1.1"
  confirm-expired:
    - "{prefix} &cNo current overwrite confirmation. Run the set command again."
    - "[sound] block.note_block.bass 0.75"
  changed:
    - "{prefix} &cThis destination changed. Run the command again."
    - "[sound] block.note_block.bass 0.8"
  limit:
    - "{prefix} &cYou have reached your home limit ({limit})."
    - "[sound] entity.villager.no 0.95"
home:
  set:
    - "{prefix} &aHome &f{name} &aset."
    - "[sound] block.note_block.chime 1.3"
  deleted:
    - "{prefix} &aHome &f{name} &adeleted."
    - "[sound] item.book.page_turn 0.9"
  not-found:
    - "{prefix} &cHome &f{name} &cnot found."
    - "[sound] block.note_block.bass 0.8"
  limit-reached:
    - "{prefix} &cYou have reached your home limit (&f{limit}&c)."
    - "[sound] entity.villager.no 0.95"
  list:
    - "{prefix} &fHomes: &d{homes}"
    - "[sound] item.book.page_turn 1.1"
  none:
    - "{prefix} &cYou have no homes set."
    - "[sound] block.note_block.hat 0.9"
  bed-entry:
    - "&dbed"
  bed-missing-entry:
    - "&7&mbed"
  bed-missing:
    - "{prefix} &cYou have no bed or charged respawn anchor, or it is blocked."
    - "[sound] block.note_block.bass 0.8"
  bed-reserved:
    - "{prefix} &cThe name &fbed &cis taken by your bed; pick another name for this home."
    - "[sound] block.note_block.bass 0.8"
  list-other:
    - "{prefix} &f{player}'s homes: &d{homes}"
    - "[sound] item.book.page_turn 1.1"
  none-other:
    - "{prefix} &f{player} &chas no homes set."
    - "[sound] block.note_block.hat 0.9"
  not-found-other:
    - "{prefix} &f{player} &chas no home called &f{name}&c."
    - "[sound] block.note_block.bass 0.8"
  deleted-other:
    - "{prefix} &aDeleted &f{player}&a's home &f{name}&a."
    - "[sound] item.book.page_turn 0.9"
  bed-missing-other:
    - "{prefix} &f{player} &chas no bed or charged respawn anchor, or it is blocked."
    - "[sound] block.note_block.bass 0.8"
  bed-set:
    - "{prefix} &aYour bed home has been updated."
    - "[sound] block.note_block.chime 1.3"
  renamed:
    - "{prefix} &aRenamed home &f{old} &ato &f{name}&a."
    - "[sound] block.note_block.chime 1.25"
  renamed-other:
    - "{prefix} &aRenamed &f{player}&a's home &f{old} &ato &f{name}&a."
    - "[sound] block.note_block.chime 1.25"
  exists:
    - "{prefix} &cA home called &f{name} &calready exists."
    - "[sound] block.note_block.bass 0.8"
  limit-info:
    - "{prefix} &6Max homes for &e{player}&6: &e{effective} &7(permissions: &f{permissions}&7, override: &f{override}&7, set: &f{count}&7)."
    - "[sound] item.book.page_turn 1.1"
  limit-set:
    - "{prefix} &aSet max homes override for &f{player} &ato &e{override}&a (effective: &e{effective}&a)."
    - "[sound] block.note_block.pling 1.3"
  limit-cleared:
    - "{prefix} &aCleared max homes override for &f{player}&a (effective: &e{effective}&a)."
    - "[sound] block.note_block.chime 1.2"
  limit-unlimited-relative:
    - "{prefix} &c{player} already has unlimited homes; set an explicit number or -1."
    - "[sound] block.note_block.bass 0.8"
  limit-invalid:
    - "{prefix} &cInvalid home limit. Use 0-1000, -1 to clear, or +N/-N."
    - "[sound] block.note_block.bass 0.8"
customtext:
  missing:
    - "{prefix} &cThere is no custom text called &f{section}&c."
    - "[sound] block.note_block.bass 0.8"
  failed:
    - "{prefix} &f{file} &ccould not be read. Check the console."
    - "[sound] block.note_block.bass 0.8"
  empty:
    - "{prefix} &f{file} &7has nothing to show yet."
    - "[sound] block.note_block.hat 0.95"
  sections:
    - "{prefix} &7Sections of &f/{command}&7: {sections}"
    - "[sound] item.book.page_turn 1.1"
motd:
  missing:
    - "{prefix} &cThere is no MOTD section called &f{section}&c."
    - "[sound] block.note_block.bass 0.8"
rules:
  missing:
    - "{prefix} &cThere is no rules chapter called &f{section}&c."
    - "[sound] block.note_block.bass 0.8"
info-pages:
  missing:
    - "{prefix} &cThere is no info chapter called &f{section}&c."
    - "[sound] block.note_block.bass 0.8"
  inform-sent:
    - "{prefix} &7Showed &f{player} &7their info pages."
    - "[sound] item.book.page_turn 1.1"
  inform-sent-chapter:
    - "{prefix} &7Showed &f{player} &7the info chapter &f{section}&7."
    - "[sound] item.book.page_turn 1.1"
broadcasts:
  status:
    - "{prefix} &7Timed broadcasts are {state}&7: every &f{interval}s&7, &f{order}&7, with at least &f{minimum} &7online. Broadcasts: &f{broadcasts}"
    - "[sound] item.book.page_turn 1.1"
  "on":
    - "&aon"
  "off":
    - "&coff"
  sent:
    - "{prefix} &aSent the broadcast &f{name}&a."
    - "[sound] block.note_block.chime 1.2"
  unknown:
    - "{prefix} &cThere is no broadcast called &f{name}&c."
    - "[sound] block.note_block.bass 0.8"
warp:
  set:
    - "{prefix} &aWarp &f{name} &aset."
    - "[sound] block.enchantment_table.use 1.25"
  deleted:
    - "{prefix} &aWarp &f{name} &adeleted."
    - "[sound] item.book.page_turn 0.9"
  not-found:
    - "{prefix} &cWarp &f{name} &cnot found."
    - "[sound] block.note_block.bass 0.8"
  list:
    - "{prefix} &fWarps: &d{warps}"
    - "[sound] item.book.page_turn 1.1"
  none:
    - "{prefix} &cNo warps available."
    - "[sound] block.note_block.hat 0.9"
  info:
    - "{prefix} &6Warp &e{name}&6: &f{world} &7(&f{x}, {y}, {z}&7) &7yaw=&f{yaw} &7pitch=&f{pitch} &7perm=&f{permission}"
    - "[sound] item.book.page_turn 1.1"
  other:
    - "{prefix} &aWarped &f{player} &ato &e{name}&a."
    - "[sound] entity.enderman.teleport 1.1"
spawn:
  group-set:
    - "{prefix} &aSpawn point set for &f{group}&a."

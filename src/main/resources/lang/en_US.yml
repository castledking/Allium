# Allium language: text lines plus optional "[sound] id [pitch] [volume]".
# Volume omitted below: use the configured server default.

prefix: "&7[&dAllium&7]"
core:
  reload-success:
    - "{prefix} &aConfiguration reloaded."
    - "[sound] block.note_block.chime 1.35"
  reload-failed:
    - "{prefix} &cReload failed. Check console for details."
    - "[sound] block.note_block.bass 0.75"
  version:
    - "{prefix} &fRunning Allium &dv{version}&f."
    - "[sound] ui.button.click 1.25"
  import:
    lang-no-source:
      - "{prefix} &cNo pre-recode lang file at &f{file}&c."
      - "[sound] block.note_block.bass 0.8"
    lang-report:
      - "{prefix} &7{mode}: &f{write} &7to write, &f{same} &7already imported, &f{kept} &7kept (customized), &f{unmapped} &7not portable yet. Details are in the console."
      - "[sound] item.book.page_turn 1.0"
    lang-applied:
      - "{prefix} &aImported &f{write} &amessage(s) into &f{file}&a; the old file is backed up as &f{backup}&a."
      - "[sound] entity.player.levelup 1.35"
    lang-nothing:
      - "{prefix} &aNothing to import; &f{file} &ais up to date."
      - "[sound] block.note_block.hat 1.15"
    lang-failed:
      - "{prefix} &cThe lang import failed: &f{reason}"
      - "[sound] block.note_block.bass 0.75"
  adopt-window:
    opened:
      - "{prefix} &ePre-recode privileged tools are adopted on first use for the next &f{duration}&e. Every adoption is logged. Close it early with &f/allium adopt-window off&e."
      - "[sound] block.beacon.activate 1.25"
    closed:
      - "{prefix} &aThe adoption window is closed."
      - "[sound] block.beacon.deactivate 1.0"
    status:
      - "{prefix} &7The adoption window is &f{state}&7."
      - "[sound] ui.button.click 1.1"
error:
  no-permission:
    - "{prefix} &cYou don't have permission to do that."
    - "[sound] entity.villager.no 1.0"
  player-only:
    - "{prefix} &cThis command can only be used by players."
  console-only:
    - "{prefix} &cThis command can only be used from the console."
    - "[sound] entity.villager.no 0.95"
  invalid-args:
    - "{prefix} &cUsage: &f{usage}"
    - "[sound] ui.button.click 0.75"
  player-not-found:
    - "{prefix} &cPlayer &f{player} &cnot found."
    - "[sound] block.note_block.bass 0.8"
  number-invalid:
    - "{prefix} &c'{input}' is not a valid number."
    - "[sound] block.note_block.bass 0.8"
  world-not-found:
    - "{prefix} &cWorld &f{world} &cnot found."
    - "[sound] block.note_block.bass 0.8"
  cooldown-active:
    - "{prefix} &cPlease wait &f{time} &cbefore using this again."
    - "[sound] block.note_block.hat 0.85"
  module-disabled:
    - "{prefix} &cThis feature is currently disabled."
    - "[sound] entity.villager.no 0.9"
teleport:
  success:
    - "{prefix} &aTeleported to &f{target}&a."
    - "[sound] entity.enderman.teleport 1.15"
  request-sent:
    - "{prefix} &aTeleport request sent to &f{player}&a."
    - "[sound] block.note_block.pling 1.35"
  request-received:
    - "{prefix} &f{player} &awants to teleport to you. &f/tpaccept &aor &f/tpdeny"
    - "[sound] block.note_block.bell 1.25"
  accepted:
    - "{prefix} &aTeleport request accepted."
    - "[sound] block.note_block.pling 1.5"
  denied:
    - "{prefix} &cTeleport request denied."
    - "[sound] block.note_block.bass 0.8"
  cancelled:
    - "{prefix} &cTeleport request expired."
    - "[sound] block.note_block.bass 0.75"
  back:
    - "{prefix} &aReturned to your previous location."
    - "[sound] entity.enderman.teleport 0.95"
  no-back:
    - "{prefix} &cNo previous location to return to."
    - "[sound] block.note_block.bass 0.8"
  no-pending:
    - "{prefix} &cYou have no pending teleport requests."
    - "[sound] block.note_block.bass 0.85"
  here-received:
    - "{prefix} &f{player} &awants you to teleport to them. &f/tpaccept &aor &f/tpdeny"
    - "[sound] block.note_block.bell 1.15"
  request-cancelled:
    - "{prefix} &cTeleport request cancelled."
    - "[sound] block.note_block.hat 0.8"
  warmup:
    - "{prefix} &eTeleporting in {time}s. Stay still and avoid damage."
    - "[sound] block.note_block.chime 1.0"
  interrupted:
    - "{prefix} &cTeleport cancelled: {reason}."
    - "[sound] item.shield.break 1.15"
  refused:
    - "{prefix} &c{player} can't receive teleports right now."
    - "[sound] entity.villager.no 1.0"
  loading:
    - "{prefix} &cYour teleport data is still loading. Try again shortly."
    - "[sound] block.note_block.hat 0.9"
  storage-failed:
    - "{prefix} &cTeleport data could not be saved. Try again shortly."
    - "[sound] block.note_block.bass 0.7"
  unsafe:
    - "{prefix} &cNo safe destination was found. Nothing was teleported."
    - "[sound] item.shield.break 0.95"
  busy:
    - "{prefix} &cA teleport is already pending. Try again shortly."
    - "[sound] block.note_block.hat 0.85"
  self:
    - "{prefix} &cYou can't request a teleport to yourself."
    - "[sound] block.note_block.bass 0.8"
  toggle-on:
    - "{prefix} &a{player} now accepts teleport requests."
    - "[sound] block.note_block.pling 1.4"
  toggle-off:
    - "{prefix} &c{player} no longer accepts teleport requests. Incoming requests cancelled."
    - "[sound] block.note_block.bass 0.85"
travel:
  loading:
    - "{prefix} &cTravel data is loading. Try again shortly."
    - "[sound] block.note_block.hat 0.9"
  busy:
    - "{prefix} &cTravel storage is busy. Try again shortly."
    - "[sound] block.note_block.hat 0.85"
  storage-failed:
    - "{prefix} &cTravel data could not be saved. Try again shortly."
    - "[sound] block.note_block.bass 0.7"
  name-invalid:
    - "{prefix} &cUse 1-32 letters, digits, underscores or hyphens for the name."
    - "[sound] block.note_block.bass 0.8"
  confirm:
    - "{prefix} &eThis name already exists. Run &f{command} &eto confirm the captured location."
    - "[sound] block.note_block.bell 1.1"
  confirm-expired:
    - "{prefix} &cNo current overwrite confirmation. Run the set command again."
    - "[sound] block.note_block.bass 0.75"
  changed:
    - "{prefix} &cThis destination changed. Run the command again."
    - "[sound] block.note_block.bass 0.8"
  limit:
    - "{prefix} &cYou have reached your home limit ({limit})."
    - "[sound] entity.villager.no 0.95"
home:
  set:
    - "{prefix} &aHome &f{name} &aset."
    - "[sound] block.note_block.chime 1.3"
  deleted:
    - "{prefix} &aHome &f{name} &adeleted."
    - "[sound] item.book.page_turn 0.9"
  not-found:
    - "{prefix} &cHome &f{name} &cnot found."
    - "[sound] block.note_block.bass 0.8"
  limit-reached:
    - "{prefix} &cYou have reached your home limit (&f{limit}&c)."
    - "[sound] entity.villager.no 0.95"
  list:
    - "{prefix} &fHomes: &d{homes}"
    - "[sound] item.book.page_turn 1.1"
  none:
    - "{prefix} &cYou have no homes set."
    - "[sound] block.note_block.hat 0.9"
warp:
  set:
    - "{prefix} &aWarp &f{name} &aset."
    - "[sound] block.enchantment_table.use 1.25"
  deleted:
    - "{prefix} &aWarp &f{name} &adeleted."
    - "[sound] item.book.page_turn 0.9"
  not-found:
    - "{prefix} &cWarp &f{name} &cnot found."
    - "[sound] block.note_block.bass 0.8"
  list:
    - "{prefix} &fWarps: &d{warps}"
    - "[sound] item.book.page_turn 1.1"
  none:
    - "{prefix} &cNo warps available."
    - "[sound] block.note_block.hat 0.9"
spawn:
  set:
    - "{prefix} &aSpawn point set."
    - "[sound] block.beacon.activate 1.2"
  teleport:
    - "{prefix} &aTeleported to spawn."
    - "[sound] entity.enderman.teleport 1.25"
  not-set:
    - "{prefix} &cSpawn has not been set."
    - "[sound] block.note_block.bass 0.8"
kit:
  received:
    - "{prefix} &aReceived kit &f{name}&a."
    - "[sound] entity.player.levelup 1.4"
  given:
    - "{prefix} &aGave kit &f{name} &ato &f{player}&a."
    - "[sound] entity.item.pickup 1.2"
  not-found:
    - "{prefix} &cKit &f{name} &cnot found."
    - "[sound] block.note_block.bass 0.8"
  no-permission:
    - "{prefix} &cYou don't have permission to claim kit &f{name}&c."
    - "[sound] entity.villager.no 1.0"
  list:
    - "{prefix} &fKits: &d{kits}"
    - "[sound] item.book.page_turn 1.1"
  none:
    - "{prefix} &cNo kits available."
    - "[sound] block.note_block.hat 0.9"
  cooldown:
    - "{prefix} &cKit &f{name} &con cooldown. Wait &f{time}&c."
    - "[sound] block.note_block.hat 0.85"
  one-time-claimed:
    - "{prefix} &cYou have already claimed one-time kit &f{name}&c."
    - "[sound] entity.villager.no 0.95"
  paid-denied:
    - "{prefix} &cKit &f{name} &chas a cost and paid kits are disabled until economy reservations exist."
    - "[sound] entity.villager.no 0.9"
  cost-refused:
    - "{prefix} &cYou cannot pay for that kit."
    - "[sound] entity.villager.no 0.9"
  full:
    - "{prefix} &cYour inventory cannot hold all items from kit &f{name}&c; nothing was given."
    - "[sound] item.shield.break 0.95"
  busy:
    - "{prefix} &cA kit or inventory operation is already in progress. Try again shortly."
    - "[sound] block.note_block.hat 0.85"
  failed:
    - "{prefix} &cKit delivery is unavailable right now; nothing was given or consumed."
    - "[sound] block.note_block.bass 0.7"
  invalid:
    - "{prefix} &cKit &f{name} &chas an invalid item definition: &f{reason}"
    - "[sound] block.note_block.bass 0.75"
  created:
    - "{prefix} &aCreated kit &f{name} &awith &f{items} &aitem stack(s)."
    - "[sound] block.anvil.use 1.25"
  deleted:
    - "{prefix} &aDeleted kit &f{name}&a."
    - "[sound] item.book.page_turn 0.85"
  already-exists:
    - "{prefix} &cKit &f{name} &calready exists. Delete it first with &f/delkit {name}&c."
    - "[sound] block.note_block.bass 0.85"
  create-empty:
    - "{prefix} &cPut at least one item in your storage inventory before running &f/createkit&c."
    - "[sound] block.note_block.bass 0.8"
  name-invalid:
    - "{prefix} &cUse 1-32 lowercase letters, digits, underscores or hyphens for the kit name."
    - "[sound] block.note_block.bass 0.8"
  capture-privileged:
    - "{prefix} &cCannot capture slot &f{slot} &c(&f{item}&c / &f{behavior}&c): capturing privileged items requires &f{permission}&c."
    - "[sound] entity.villager.no 0.95"
  capture-unsupported:
    - "{prefix} &cCannot create kit: slot &f{slot} &ccontains unsupported item data (&f{reason}&c). Remove or replace the item so the kit is not degraded."
    - "[sound] block.note_block.bass 0.75"
economy:
  balance:
    - "{prefix} &fBalance: &a{amount}"
    - "[sound] ui.button.click 1.3"
  balance-other:
    - "{prefix} &f{player}&f's balance: &a{amount}"
    - "[sound] ui.button.click 1.3"
  pay-sent:
    - "{prefix} &aSent &f{amount} &ato &f{player}&a."
    - "[sound] entity.experience_orb.pickup 0.95"
  pay-received:
    - "{prefix} &aReceived &f{amount} &afrom &f{player}&a."
    - "[sound] entity.experience_orb.pickup 1.35"
  insufficient:
    - "{prefix} &cInsufficient funds."
    - "[sound] block.note_block.bass 0.8"
  invalid-amount:
    - "{prefix} &cAmount must be greater than zero."
    - "[sound] block.note_block.bass 0.8"
chat:
  delete:
    success:
      - "{prefix} &aMessage deleted."
      - "[sound] item.book.page_turn 1.0"
    multiple:
      - "{prefix} &aMessages deleted."
      - "[sound] item.book.page_turn 1.0"
    not-found:
      - "{prefix} &cMessage not found."
    amount:
      - "{prefix} &cAmount must be 1..200."
    usage:
      - "{prefix} &cUsage: &f/delmsg <id> &cor &f/delmsg <player> <amount>"
  player-not-found:
    - "{prefix} &cPlayer not found."
  msg-format:
    - "&7[&f{sender} &7-> &f{receiver}&7] &f{message}"
  no-reply:
    - "{prefix} &cNo one to reply to."
    - "[sound] block.note_block.bass 0.85"
  socialspy-toggle:
    - "{prefix} &fSocialSpy {state}&f."
    - "[sound] ui.button.click 1.15"
  broadcast:
    - "&4[Broadcast] &c{message}"
    - "[sound] block.note_block.bell 1.05"
moderation:
  discipline:
    usage:
      - "{prefix} &cUsage: {usage}"
      - "[sound] ui.button.click 0.75"
    unavailable:
      - "{prefix} &cModeration data is unavailable. Try again shortly."
      - "[sound] block.note_block.bass 0.7"
    busy:
      - "{prefix} &cA moderation action is already pending or rate limited. Try again shortly."
      - "[sound] block.note_block.hat 0.85"
    exempt:
      - "{prefix} &cYou cannot act on this player under the moderation hierarchy."
      - "[sound] entity.villager.no 0.9"
    success:
      - "{prefix} &a{action}: {player}."
      - "[sound] block.note_block.pling 1.25"
    not-active:
      - "{prefix} &cNo matching active record for {player}."
      - "[sound] block.note_block.bass 0.85"
    ip-disabled:
      - "{prefix} &cIP bans are disabled in configuration."
      - "[sound] entity.villager.no 0.9"
    jail-not-found:
      - "{prefix} &cJail {jail} was not found."
      - "[sound] block.note_block.bass 0.8"
    unsafe-location:
      - "{prefix} &cThe jail or return location is unavailable or unsafe."
      - "[sound] item.shield.break 0.95"
    ban-denied:
      - "You are banned: {message}"
    login-unavailable:
      - "Moderation data is unavailable. Please try again shortly."
    kick-notice:
      - "You were kicked: {message}"
    warning-notice:
      - "{prefix} &eWarning: {message}"
      - "[sound] block.note_block.bell 0.9"
    list-header:
      - "{prefix} &fModeration records ({count}):"
      - "[sound] item.book.page_turn 1.0"
    list-entry:
      - "&7- {player} by {actor}: {message}"
    list-empty:
      - "{prefix} &7No moderation records found."
      - "[sound] block.note_block.hat 0.95"
  inspect:
    self:
      - "{prefix} &cYou cannot use /invsee on yourself."
      - "[sound] block.note_block.bass 0.8"
    busy:
      - "{prefix} &cThat inventory is busy right now. Try again shortly."
      - "[sound] block.note_block.hat 0.85"
    offline-required:
      - "{prefix} &cOffline inspection requires &f{permission}&c."
      - "[sound] entity.villager.no 0.95"
    offline-unavailable:
      - "{prefix} &cOffline data for &f{player} &cis unavailable right now."
      - "[sound] block.note_block.bass 0.75"
    offline-corrupt:
      - "{prefix} &cOffline data for &f{player} &ccould not be read safely; nothing was modified."
      - "[sound] item.shield.break 0.85"
    offline-newer-version:
      - "{prefix} &cOffline data for &f{player} &cwas saved by a newer Minecraft version; nothing was modified."
      - "[sound] item.shield.break 0.9"
    offline-version-rewrite:
      - "{prefix} &cOffline data for &f{player} &cuses a different Minecraft DataVersion; offline editing is refused so nothing is rewritten."
      - "[sound] item.shield.break 0.9"
    offline-hold:
      - "{prefix} &cOffline editing for &f{player} &cis refused while a pending workflow hold exists."
      - "[sound] entity.villager.no 0.9"
    offline-edit-disabled:
      - "{prefix} &cOffline playerdata editing is disabled due to a codec self-test failure."
      - "[sound] block.anvil.break 0.9"
    conflict:
      - "{prefix} &cOffline data for &f{player} &cchanged externally; inspection closed without saving."
      - "[sound] item.shield.break 0.95"
    target-online:
      - "{prefix} &e{player} &ejoined the server; offline inspection closed."
      - "[sound] block.chest.close 1.15"
    target-offline:
      - "{prefix} &e{player} &ewent offline; live inspection closed."
      - "[sound] block.chest.close 0.9"
    target-died:
      - "{prefix} &e{player} &edied; live inventory inspection closed."
      - "[sound] block.chest.close 0.8"
    unavailable:
      - "{prefix} &cInspection is unavailable right now. Try again shortly."
      - "[sound] block.note_block.bass 0.75"
  ban:
    - "{prefix} &f{player} &chas been banned. Reason: &f{reason}"
    - "[sound] block.anvil.use 0.85"
  tempban:
    - "{prefix} &f{player} &cbanned for &f{duration}&c. Reason: &f{reason}"
    - "[sound] block.anvil.use 0.95"
  kick:
    - "{prefix} &f{player} &chas been kicked. Reason: &f{reason}"
    - "[sound] entity.arrow.hit_player 0.9"
  mute:
    - "{prefix} &f{player} &chas been muted. Reason: &f{reason}"
    - "[sound] block.note_block.bass 0.75"
  tempmute:
    - "{prefix} &f{player} &cmuted for &f{duration}&c. Reason: &f{reason}"
    - "[sound] block.note_block.bass 0.8"
  unmute:
    - "{prefix} &f{player} &ahas been unmuted."
    - "[sound] block.note_block.chime 1.25"
  warn:
    - "{prefix} &f{player} &chas been warned: &f{reason}"
    - "[sound] block.note_block.bell 0.9"
  muted-chat:
    - "{prefix} &cYou are muted and cannot chat."
    - "[sound] entity.villager.no 0.9"
  vanish-on:
    - "{prefix} &aVanish enabled. You are now hidden from players without &fallium.vanish.see&a."
    - "[sound] entity.illusioner.mirror_move 1.2"
  vanish-off:
    - "{prefix} &7Vanish disabled. You are now visible."
    - "[sound] entity.illusioner.cast_spell 1.1"
  vanish-other-on:
    - "{prefix} &aEnabled vanish for &f{player}&a."
    - "[sound] entity.illusioner.mirror_move 1.2"
  vanish-other-off:
    - "{prefix} &7Disabled vanish for &f{player}&7."
    - "[sound] entity.illusioner.cast_spell 1.1"
  vanish-silent-container:
    - "{prefix} &7Opened container silently (read-only while vanished)."
    - "[sound] block.chest.open 1.3"
  mute-target-notice:
    - "{prefix} &cYou have been muted (&f{remaining}&c remaining). Reason: &f{reason}"
    - "[sound] entity.villager.no 0.85"
  unmute-target-notice:
    - "{prefix} &aYou have been unmuted."
    - "[sound] block.note_block.chime 1.3"
  unmute-not-muted:
    - "{prefix} &c{player} is not muted."
    - "[sound] block.note_block.bass 0.85"
  mute-self:
    - "{prefix} &cYou cannot mute yourself."
    - "[sound] block.note_block.bass 0.8"
  mute-blocked:
    - "{prefix} &cYou are muted (&f{remaining}&c remaining). Reason: &f{reason}"
    - "[sound] entity.villager.no 0.9"
  mutes-empty:
    - "{prefix} &7There are no active mutes."
    - "[sound] block.note_block.hat 0.95"
  mutes-header:
    - "{prefix} &fActive mutes &7({count}):"
    - "[sound] item.book.page_turn 1.0"
  mutes-entry:
    - "&7- &f{player} &7(&e{remaining}&7, by &f{actor}&7): &f{reason}"
  storage-failed:
    - "{prefix} &cModeration state could not be saved; the change was undone."
    - "[sound] block.note_block.bass 0.7"
  vanish-chat-blocked:
    - "{prefix} &cYou cannot send public chat while vanished. Use &f/vanish off &cor &f/msg&c."
    - "[sound] entity.villager.no 0.95"
  mute-unavailable:
    - "{prefix} &cYour moderation status is still loading; chat and messaging are temporarily unavailable. Try again shortly."
    - "[sound] block.note_block.hat 0.85"
info:
  list:
    empty:
      - "{prefix} &7There are &f0&7/&f{max} &7players online."
      - "[sound] item.book.page_turn 0.95"
    header:
      - "{prefix} &fOnline players &7({online}/{max}):"
      - "[sound] item.book.page_turn 1.15"
    group:
      - "&7{group} &8({count})&7: &f{players}"
  seen:
    online:
      - "{prefix} &f{player} &ais online{tags} &7(for &f{duration}&7). First joined: &f{first_join}"
      - "[sound] block.note_block.chime 1.25"
    offline:
      - "{prefix} &f{player} &7is offline (last seen &f{last_seen} &7ago, &f{last_seen_date}&7). First joined: &f{first_join}"
      - "[sound] item.book.page_turn 1.0"
    unknown:
      - "{prefix} &cNo player called &f{player} &chas played here."
      - "[sound] block.note_block.bass 0.8"
  whois:
    header:
      - "{prefix} &fWhois &e{player} &7({status}{tags}):"
      - "[sound] item.book.page_turn 1.15"
    uuid:
      - "&7UUID: &f{uuid}"
    dates:
      - "&7First joined: &f{first_join} &8| &7{seen_label}: &f{seen_value}"
    location:
      - "&7Location: &f{world} &7(&f{x}&7, &f{y}&7, &f{z}&7)"
    names:
      - "&7Known names: &f{names}"
  near:
    list:
      - "{prefix} &fNearby players &7(within &f{radius}m&7, {count}): &f{players}"
      - "[sound] block.note_block.chime 1.3"
    empty:
      - "{prefix} &7No players within &f{radius}m&7."
      - "[sound] block.note_block.hat 0.95"
    invalid-radius:
      - "{prefix} &cRadius must be a positive number."
      - "[sound] block.note_block.bass 0.8"
    too-far:
      - "{prefix} &cRadius cannot exceed &f{max}&c blocks."
      - "[sound] block.note_block.bass 0.8"
  afk:
    enter:
      - "{prefix} &7{player} is now AFK."
    enter-reason:
      - "{prefix} &7{player} is now AFK: &f{message}"
    leave:
      - "{prefix} &7{player} is no longer AFK."
    self-enter:
      - "{prefix} &7You are now AFK."
      - "[sound] ui.button.click 0.85"
    self-enter-reason:
      - "{prefix} &7You are now AFK: &f{message}"
      - "[sound] ui.button.click 0.85"
    self-leave:
      - "{prefix} &7You are no longer AFK."
      - "[sound] ui.button.click 1.2"
    kick:
      - "You were kicked for being AFK."
  player-only:
    - "{prefix} &cOnly players can use /{cmd}."
  storage-failed:
    - "{prefix} &cPlayer info could not be loaded right now; try again shortly."
    - "[sound] block.note_block.bass 0.7"
player:
  gamemode-self:
    - "{prefix} &aGamemode set to &f{mode}&a."
    - "[sound] ui.button.click 1.35"
  gamemode-other:

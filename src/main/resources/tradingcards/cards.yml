# ============================================================
#  Allium Trading Cards — mob roster
# ============================================================
# One entry per mob. Tiers are WEIGHTS, not a fixed assignment, so a
# single mob is tuned across the whole ladder and two mobs may weight
# the same tier very differently — a chicken and a wither are not the
# same proposition.
#
# Each drop is two independent rolls, both single-draws:
#
#   1. does this mob drop a card at all   (chance)
#   2. which tier                          (tiers.*.weight)
#   3. what condition                      (quality.bands in config.yml)
#
# Setting a tier's weight to 0 removes it from that mob's roll but
# leaves the entry in place, so re-enabling it needs no retyping.
#
# The nexo: items below must exist in your Nexo pack. A tier with a
# positive weight but a missing item is an ERROR and the card is
# skipped entirely: a card that drops an item nobody can hold is worse
# than no card at all.
#
# Reload with /tradingcards reload.

cards:

  # ------------------------------------------------------------
  #  The vanilla set: 36 mobs x 5 tiers = 180 cards.
  #
  #  chance 0.0015 is one card per ~667 kills, and the tier weights
  #  give roughly 60% SIMPLE / 25% ELITE / 10% ULTIMATE / 4.5%
  #  LEGENDARY / 0.5% FABLED. So a Fabled card appears about once per
  #  89,000 kills of one mob — rare enough to be a trophy, and
  #  reachable by farming any mob rather than only the rarest.
  #
  #  Every mob shares the same ladder. That is a starting point, not a
  #  finished balance: these are weights, so a single mob can be
  #  skewed by editing its five numbers without touching anything
  #  else. The design intent is that a chicken and a wither are not the
  #  same proposition, and the numbers to express that do not exist
  #  yet — they need playtesting, so they are left uniform rather
  #  than invented.
  #
  #  Only Fabled has its own art. The other four tiers share one
  #  static texture per mob and are told apart by the tier glyph in
  #  the name and lore.
  # ------------------------------------------------------------
  allay:
    mob: ALLAY
    chance: 0.0015

    tiers:
      SIMPLE:
        weight: 60.0
        item: nexo:allay_trading_card
      ELITE:
        weight: 25.0
        item: nexo:elite_allay_trading_card
      ULTIMATE:
        weight: 10.0
        item: nexo:ultimate_allay_trading_card
      LEGENDARY:
        weight: 4.5
        item: nexo:legendary_allay_trading_card
      FABLED:
        weight: 0.5
        item: nexo:fabled_allay_trading_card


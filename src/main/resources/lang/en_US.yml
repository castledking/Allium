    sound: minecraft:entity.arrow.hit_player
    volume: 0.5
    pitch: 0.9
  mute:
    text: "{prefix} &f{player} &chas been muted. Reason: &f{reason}"
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.75
  tempmute:
    text: "{prefix} &f{player} &cmuted for &f{duration}&c. Reason: &f{reason}"
    sound: minecraft:block.note_block.bass
    volume: 0.55
    pitch: 0.8
  unmute:
    text: "{prefix} &f{player} &ahas been unmuted."
    sound: minecraft:block.note_block.chime
    volume: 0.5
    pitch: 1.25
  warn:
    text: "{prefix} &f{player} &chas been warned: &f{reason}"
    sound: minecraft:block.note_block.bell
    volume: 0.55
    pitch: 0.9
  muted-chat:
    text: "{prefix} &cYou are muted and cannot chat."
    sound: minecraft:entity.villager.no
    volume: 0.5
    pitch: 0.9
  vanish-on:
    text: "{prefix} &aVanish enabled. You are now hidden from players without &fallium.vanish.see&a."

# How the Curios resource pack reaches players. Allium reads this when the server starts (restart to change).
resource-pack:
  # allium: merged into Allium's core pack, so Allium's standalone self-hosting or its rpm-export
  #         to ResourcePackManager delivers it together with Allium's items.
  # rspm:   written as its own Curios_resource_pack.zip into ResourcePackManager's mixer
  #         (the directory from Allium's resource-pack.rpm-export.mixer-directory).
  # none:   not delivered; host Curios-resource-pack.zip yourself.
  delivery: allium

# The layout of this file. Curios upgrades an older file on startup (keeping a copy beside it).
config-version: 2
# Chances are per kill or loot event (0..1). Set a chance to 0 to disable its roll.
kill-xp: 5
# true: frames, tier labels and menu backgrounds come from the Curios resource pack. Turn it off
# only when players cannot get the pack; cards and menus then fall back to plain text.
textured-menu: true
migration-directory: config/relique/entities
card-menu:
  # Legacy's action bar: the held card's title above the hotbar while a card is in the main hand.
  held-card-action-bar: true
  allow-drop: true
  drop-delivery: inventory
  lore-separator: "───────────────"
  xp-bar-width: 12
  level-curve:
    10: 25
    25: 120
    50: 600
    75: 2400
    100: 9000
  # Rolling a bonus slot costs money from Allium's economy (the "economy" module), legacy's ladder:
  # each roll of a slot costs more than the last, so rolling until satisfied is never free, and
  # the bonus menu shows the next price before the player clicks. A slot's next roll costs
  #   cost x escalation^(rolls of that slot so far) x the card tier's multiplier,
  # rounded to round-to. On a Simple card: 500, 700, 900, 1,200, 1,700, 2,200, 3,000, ...
  # Clearing a slot keeps its roll count, so it never resets the price. Set cost to 0 for free
  # rolls (no economy needed), or enabled to false to turn rolling off.
  bonus-slot-roll:
    enabled: true
    cost: 500.0
    escalation: 1.35
    round-to: 100
    tier-multipliers:
      SIMPLE: 1.0
      ELITE: 1.5
      ULTIMATE: 2.0
      LEGENDARY: 3.0
      FABLED: 5.0
  quality-bands:
    rotten:    { min: 1,   max: 5,   heads: 1, colour: dark_gray,  boost: [1, 2] }
    damaged:   { min: 6,   max: 15,  heads: 1, colour: gray,       boost: [2, 3] }
    torn:      { min: 16,  max: 25,  heads: 2, colour: dark_red,   boost: [3, 4] }
    okay:      { min: 26,  max: 45,  heads: 3, colour: white,      boost: [4, 5] }
    fine:      { min: 46,  max: 65,  heads: 5, colour: yellow,     boost: [5, 6] }
    great:     { min: 66,  max: 85,  heads: 6, colour: green,      boost: [6, 7] }
    mint:      { min: 86,  max: 99,  heads: 7, colour: aqua,       boost: [7, 9] }
    emaculate: { min: 100, max: 100, heads: 8, colour: gold,       boost: [7, 11] }
  mob-colours:
    allay: aqua
    axolotl: dark_aqua
    bee: gold
    blaze: gold
    chicken: yellow
    cow: gray
    creeper: dark_green
    dolphin: dark_aqua
    enderman: dark_purple
    fox: gold
    ghast: white
    goat: gray
    hoglin: dark_purple
    horse: gold
    husk: dark_purple
    magma_cube: gold
    mooshroom: light_purple
    ocelot: yellow
    parrot: yellow
    pig: light_purple
    piglin: light_purple
    piglin_brute: dark_purple
    pillager: gold
    pufferfish: gold
    ravager: dark_purple
    sheep: white
    skeleton: gray
    slime: green
    stray: white
    turtle: dark_green
    vex: light_purple
    villager: white
    witch: dark_purple
    wither_skeleton: dark_gray
    wolf: gray
    zombie: dark_green

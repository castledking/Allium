# The items the Allium tomato crop hands out: seeds to plant with, the fruit
# that comes off a ripe plant, and the four stage models the crop is drawn
# with.
#
# The textures are the ones the server's Nexo pack already ships
# (crops/tomato), copied into this pack so the crop looks exactly like the
# Nexo one. That art belongs to the server's resource pack, not to Allium, so
# it is not committed here — sync_art.sh copies it in.
items:
  ce:tomato_seeds:
    data:
      item_name: <!i><lang:item.ce.tomato_seeds>
    texture: ce:item/crops/tomato/tomato_seeds

  ce:tomato:
    data:
      item_name: <!i><lang:item.ce.tomato>
    texture: ce:item/crops/tomato/tomato

  ce:tomato_silver_star:
    data:
      item_name: <!i><lang:item.ce.tomato_silver_star>
    texture: ce:item/crops/tomato/tomato_silver_star

  ce:tomato_golden_star:
    data:
      item_name: <!i><lang:item.ce.tomato_golden_star>
    texture: ce:item/crops/tomato/tomato_golden_star

  ce:golden_tomato:
    data:
      item_name: <!i><lang:item.ce.golden_tomato>
    texture: ce:item/crops/tomato/golden_tomato

  ce:gigantic_tomato:
    data:
      item_name: <!i><lang:item.ce.gigantic_tomato>
    model:
      type: minecraft:model
      path: ce:item/crops/tomato/gigantic_tomato

  # The four growth stages, drawn as models rather than as blocks: Allium
  # puts them on a display entity, so 'visual' (transform, scale, y-offset)
  # applies to them the way it does to a Nexo crop.
  ce:tomato_stage_1:
    data:
      item_name: <!i><green>Tomato Sprout
    model:
      type: minecraft:model
      path: ce:item/crops/tomato/stage_1

  ce:tomato_stage_2:
    data:
      item_name: <!i><green>Tomato Plant
    model:
      type: minecraft:model
      path: ce:item/crops/tomato/stage_2

  ce:tomato_stage_3:
    data:
      item_name: <!i><yellow>Tomato Budding
    model:
      type: minecraft:model
      path: ce:item/crops/tomato/stage_3

  ce:tomato_stage_4:
    data:
      item_name: <!i><red>Tomato Ripe
    model:
      type: minecraft:model
      path: ce:item/crops/tomato/stage_4

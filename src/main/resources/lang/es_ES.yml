  limit-set:
    - "{prefix} &aAnulacion de hogares para &f{player} &afijada en &e{override}&a (efectivo: &e{effective}&a)."
    - "[sound] block.note_block.pling 1.3"
  limit-cleared:
    - "{prefix} &aSe elimino la anulacion de hogares para &f{player}&a (efectivo: &e{effective}&a)."
    - "[sound] block.note_block.chime 1.2"
  limit-unlimited-relative:
    - "{prefix} &c{player} ya tiene hogares ilimitados; usa un numero explicito o -1."
    - "[sound] block.note_block.bass 0.8"
  limit-invalid:
    - "{prefix} &cLimite de hogares invalido. Usa 0-1000, -1 para limpiar, o +N/-N."
    - "[sound] block.note_block.bass 0.8"
customtext:
  missing:
    - "{prefix} &cNo hay texto personalizado llamado &f{section}&c."
    - "[sound] block.note_block.bass 0.8"
  failed:
    - "{prefix} &f{file} &cno se pudo leer. Revisa la consola."
    - "[sound] block.note_block.bass 0.8"
  empty:
    - "{prefix} &f{file} &7aun no tiene nada que mostrar."
    - "[sound] block.note_block.hat 0.95"
  sections:
    - "{prefix} &7Secciones de &f/{command}&7: {sections}"
    - "[sound] item.book.page_turn 1.1"
motd:
  missing:
    - "{prefix} &cNo hay una seccion del MOTD llamada &f{section}&c."
    - "[sound] block.note_block.bass 0.8"
rules:
  missing:
    - "{prefix} &cNo hay un capitulo de reglas llamado &f{section}&c."

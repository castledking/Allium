  - autism-client
  - autism_client
  - baritone
  - liquidbounce
  - liquid-bounce
  - liquidbounce-fabric
  - meteor-client
  - meteor_client
  - meteorclient
  - meteor
  - wurst
  - wurst-client
  - wurstclient
  # --- CheckHacks detected clients / mods ---
  - bleachhack
  - bleach-hack
  - aristois
  - emc
  - coffee
  - coffee-client
  - freecam
  - fabric-freecam
  - fears-xray
  - xray
  - xray-fabric
  - chestesp
  - killaura
  - kill-aura
  - aura
  - autofish
  - lumina
  - autoswitch
  - autoclicker
  - autoclicker-fabric
  - antiafk
  - itemscroller
  - xaerominimap
  - xaeros-minimap
  - xaeros
  - world-downloader
  - simple-world-downloader
  - swd
  - seedcracker
  - seedcrackerx

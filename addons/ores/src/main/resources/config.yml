# Custom ores, placed as real CraftEngine blocks in stone and deepslate.
# On its first start, Ores takes these settings from legacy Allium's ore-generation and pregen
# sections (plugins/Allium/config.legacy.yml) when they exist.

# Turn ore generation on once the CraftEngine pack that defines the ore blocks is installed.
enabled: false
# Place ores in freshly generated chunks of the worlds below. Existing chunks are only processed
# by /pregen, which never starts by itself.
auto-generate: true
worlds:
- Resource

# Players with the Jade client mod see the ore's name and icon when they look at one.
# Needs PacketEvents.
jade:
  enabled: true

# /pregen pre-generates a square of chunks around a centre.
pregen:
  # Chunks loaded per step, and ticks between steps. Higher is faster and heavier.
  chunks-per-tick: 2
  delay-ticks: 1
  # Place the ores in the chunks /pregen loads.
  generate-ores: true

# Each ore: the CraftEngine block for stone and for deepslate, how many blocks a vein has, the
# heights it generates between, the chance a chunk gets this ore, and up to how many veins.
# lowland-max-height caps the height outside mountain biomes; above single-above, mountain veins
# are a single block.
ores:
  salt:
    enabled: true
    block: sf:salt_ore
    deepslate-block: sf:deepslate_salt_ore
    vein-size: 8
    min-height: 0
    max-height: 64
    chance-per-chunk: 0.35
    veins-per-chunk: 2
  silver:
    enabled: true
    block: sf:silver_ore
    deepslate-block: sf:deepslate_silver_ore
    vein-size: 8
    min-height: -56
    max-height: 118
    lowland-max-height: 56
    single-above: 59
    chance-per-chunk: 0.15
    veins-per-chunk: 2
  galena:
    enabled: true
    block: sf:galena_ore
    deepslate-block: sf:deepslate_galena_ore
    vein-size: 8
    min-height: -56
    max-height: 8
    chance-per-chunk: 0.10
    veins-per-chunk: 2

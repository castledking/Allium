# ==========================================
#     Allium Language File - English (US)
# ==========================================

prefix: "&7[&dAllium&7]"

core:
  reload-success: "{prefix} &aConfiguration reloaded."
  reload-failed: "{prefix} &cReload failed. Check console for details."
  version: "{prefix} &fRunning Allium &dv{version}&f."
  import:
    lang-no-source: "{prefix} &cNo pre-recode lang file at &f{file}&c."
    lang-report: "{prefix} &7{mode}: &f{write} &7to write, &f{same} &7already imported, &f{kept} &7kept (customized), &f{unmapped} &7not portable yet. Details are in the console."
    lang-applied: "{prefix} &aImported &f{write} &amessage(s) into &f{file}&a; the old file is backed up as &f{backup}&a."
    lang-nothing: "{prefix} &aNothing to import; &f{file} &ais up to date."
    lang-failed: "{prefix} &cThe lang import failed: &f{reason}"
  adopt-window:
    opened: "{prefix} &ePre-recode privileged tools are adopted on first use for the next &f{duration}&e. Every adoption is logged. Close it early with &f/allium adopt-window off&e."
    closed: "{prefix} &aThe adoption window is closed."
    status: "{prefix} &7The adoption window is &f{state}&7."

error:
  no-permission: "{prefix} &cYou don't have permission to do that."
  player-only: "{prefix} &cThis command can only be used by players."
  console-only: "{prefix} &cThis command can only be used from the console."
  invalid-args: "{prefix} &cUsage: &f{usage}"
  player-not-found: "{prefix} &cPlayer &f{player} &cnot found."
  number-invalid: "{prefix} &c'{input}' is not a valid number."
  world-not-found: "{prefix} &cWorld &f{world} &cnot found."
  cooldown-active: "{prefix} &cPlease wait &f{time} &cbefore using this again."
  module-disabled: "{prefix} &cThis feature is currently disabled."

teleport:
  success: "{prefix} &aTeleported to &f{target}&a."
  request-sent: "{prefix} &aTeleport request sent to &f{player}&a."
  request-received: "{prefix} &f{player} &awants to teleport to you. &f/tpaccept &aor &f/tpdeny"
  accepted: "{prefix} &aTeleport request accepted."
  denied: "{prefix} &cTeleport request denied."
  cancelled: "{prefix} &cTeleport request expired."
  back: "{prefix} &aReturned to your previous location."
  no-back: "{prefix} &cNo previous location to return to."
  no-pending: "{prefix} &cYou have no pending teleport requests."
  here-received: "{prefix} &f{player} &awants you to teleport to them. &f/tpaccept &aor &f/tpdeny"
  request-cancelled: "{prefix} &cTeleport request cancelled."
  warmup: "{prefix} &eTeleporting in {time}s. Stay still and avoid damage."
  interrupted: "{prefix} &cTeleport cancelled: {reason}."
  refused: "{prefix} &c{player} can't receive teleports right now."
  loading: "{prefix} &cYour teleport data is still loading. Try again shortly."
  storage-failed: "{prefix} &cTeleport data could not be saved. Try again shortly."
  unsafe: "{prefix} &cNo safe destination was found. Nothing was teleported."
  busy: "{prefix} &cA teleport is already pending. Try again shortly."
  self: "{prefix} &cYou can't request a teleport to yourself."
  toggle-on: "{prefix} &a{player} now accepts teleport requests."
  toggle-off: "{prefix} &c{player} no longer accepts teleport requests. Incoming requests cancelled."

home:
  set: "{prefix} &aHome &f{name} &aset."
  deleted: "{prefix} &aHome &f{name} &adeleted."
  not-found: "{prefix} &cHome &f{name} &cnot found."
  limit-reached: "{prefix} &cYou have reached your home limit (&f{limit}&c)."
  list: "{prefix} &fHomes: &d{homes}"
  none: "{prefix} &cYou have no homes set."

warp:
  set: "{prefix} &aWarp &f{name} &aset."
  deleted: "{prefix} &aWarp &f{name} &adeleted."
  not-found: "{prefix} &cWarp &f{name} &cnot found."
  list: "{prefix} &fWarps: &d{warps}"
  none: "{prefix} &cNo warps available."

spawn:
  set: "{prefix} &aSpawn point set."
  teleport: "{prefix} &aTeleported to spawn."
  not-set: "{prefix} &cSpawn has not been set."

kit:
  received: "{prefix} &aReceived kit &f{name}&a."
  given: "{prefix} &aGave kit &f{name} &ato &f{player}&a."
  not-found: "{prefix} &cKit &f{name} &cnot found."
  no-permission: "{prefix} &cYou don't have permission to claim kit &f{name}&c."
  list: "{prefix} &fKits: &d{kits}"
  none: "{prefix} &cNo kits available."
  cooldown: "{prefix} &cKit &f{name} &con cooldown. Wait &f{time}&c."
  one-time-claimed: "{prefix} &cYou have already claimed one-time kit &f{name}&c."
  paid-denied: "{prefix} &cKit &f{name} &chas a cost and paid kits are disabled until economy reservations exist."
  full: "{prefix} &cYour inventory cannot hold all items from kit &f{name}&c; nothing was given."
  busy: "{prefix} &cA kit or inventory operation is already in progress. Try again shortly."
  failed: "{prefix} &cKit delivery is unavailable right now; nothing was given or consumed."
  invalid: "{prefix} &cKit &f{name} &chas an invalid item definition: &f{reason}"
  created: "{prefix} &aCreated kit &f{name} &awith &f{items} &aitem stack(s)."
  deleted: "{prefix} &aDeleted kit &f{name}&a."
  already-exists: "{prefix} &cKit &f{name} &calready exists. Delete it first with &f/delkit {name}&c."
  create-empty: "{prefix} &cPut at least one item in your storage inventory before running &f/createkit&c."
  name-invalid: "{prefix} &cUse 1-32 lowercase letters, digits, underscores or hyphens for the kit name."
  capture-privileged: "{prefix} &cCannot capture slot &f{slot} &c(&f{item}&c / &f{behavior}&c): capturing privileged items requires &f{permission}&c."
  capture-unsupported: "{prefix} &cCannot create kit: slot &f{slot} &ccontains unsupported item data (&f{reason}&c). Remove or replace the item so the kit is not degraded."

economy:
  balance: "{prefix} &fBalance: &a{amount}"
  balance-other: "{prefix} &f{player}&f's balance: &a{amount}"
  pay-sent: "{prefix} &aSent &f{amount} &ato &f{player}&a."
  pay-received: "{prefix} &aReceived &f{amount} &afrom &f{player}&a."
  insufficient: "{prefix} &cInsufficient funds."
  invalid-amount: "{prefix} &cAmount must be greater than zero."

chat:
  msg-format: "&7[&f{sender} &7-> &f{receiver}&7] &f{message}"
  no-reply: "{prefix} &cNo one to reply to."
  socialspy-toggle: "{prefix} &fSocialSpy {state}&f."
  broadcast: "&4[Broadcast] &c{message}"

moderation:
  ban: "{prefix} &f{player} &chas been banned. Reason: &f{reason}"
  tempban: "{prefix} &f{player} &cbanned for &f{duration}&c. Reason: &f{reason}"
  kick: "{prefix} &f{player} &chas been kicked. Reason: &f{reason}"
  mute: "{prefix} &f{player} &chas been muted. Reason: &f{reason}"
  tempmute: "{prefix} &f{player} &cmuted for &f{duration}&c. Reason: &f{reason}"
  unmute: "{prefix} &f{player} &ahas been unmuted."
  warn: "{prefix} &f{player} &chas been warned: &f{reason}"
  muted-chat: "{prefix} &cYou are muted and cannot chat."
  vanish-on: "{prefix} &aVanish enabled. You are now hidden from players without &fallium.vanish.see&a."
  vanish-off: "{prefix} &7Vanish disabled. You are now visible."
  vanish-other-on: "{prefix} &aEnabled vanish for &f{player}&a."
  vanish-other-off: "{prefix} &7Disabled vanish for &f{player}&7."
  vanish-silent-container: "{prefix} &7Opened container silently (read-only while vanished)."
  mute-target-notice: "{prefix} &cYou have been muted (&f{remaining}&c remaining). Reason: &f{reason}"
  unmute-target-notice: "{prefix} &aYou have been unmuted."
  unmute-not-muted: "{prefix} &c{player} is not muted."
  mute-self: "{prefix} &cYou cannot mute yourself."
  mute-blocked: "{prefix} &cYou are muted (&f{remaining}&c remaining). Reason: &f{reason}"
  mutes-empty: "{prefix} &7There are no active mutes."
  mutes-header: "{prefix} &fActive mutes &7({count}):"
  mutes-entry: "&7- &f{player} &7(&e{remaining}&7, by &f{actor}&7): &f{reason}"
  storage-failed: "{prefix} &cModeration state could not be saved; the change was undone."
  vanish-chat-blocked: "{prefix} &cYou cannot send public chat while vanished. Use &f/vanish off &cor &f/msg&c."
  mute-unavailable: "{prefix} &cYour moderation status is still loading; chat and messaging are temporarily unavailable. Try again shortly."

player:
  gamemode-self: "{prefix} &aGamemode set to &f{mode}&a."
  gamemode-other: "{prefix} &aSet &f{player}&a's gamemode to &f{mode}&a."
  fly-toggle: "{prefix} &fFly mode {state} &ffor &d{player}&f."
  god-toggle: "{prefix} &fGod mode {state} &ffor &d{player}&f."
  heal: "{prefix} &aYou have been healed."
  heal-other: "{prefix} &aHealed &f{player}&a."
  feed: "{prefix} &aYou have been fed."
  feed-other: "{prefix} &aFed &f{player}&a."
  speed-set: "{prefix} &a{type} speed set to &f{speed}&a."
  vanish-toggle: "{prefix} &fVanish {state}&f."
  afk-toggle: "{prefix} &f{player} &7is {state} AFK."
  nick-set: "{prefix} &aNickname set to &f{nick}&a."
  nick-reset: "{prefix} &aNickname reset."

utility:
  time-set: "{prefix} &aTime set to &f{time} &ain &f{world}&a."
  weather-set: "{prefix} &aWeather set to &f{weather} &ain &f{world}&a."
  seen-online: "{prefix} &f{player} &ais currently online. Joined &f{time} &aago."
  seen-offline: "{prefix} &f{player} &cwas last seen &f{time} &cago."
  near: "{prefix} &fNearby players: &d{players}"
  near-none: "{prefix} &cNo players nearby."

tool:
  mob-disarmer:
    disarmed: "{prefix} &aDisarmed &f{target}&a: &f{removed} &aremoved, &f{dropped} &adropped. Charges: &f{charges}&7/&f{max}"
    disarmed-bypass: "{prefix} &aDisarmed &f{target}&a: &f{removed} &aremoved, &f{dropped} &adropped."
    last-charge: "{prefix} &cThat was the last charge. Fully recharged in &f{time}&c."
    broke: "{prefix} &cThe Mob Disarmer broke while in use."
    broken: "{prefix} &cThis Mob Disarmer is broken."
    recharging: "{prefix} &cThe Mob Disarmer is recharging. Ready in &f{time}&c."
    status: "{prefix} &eRight-click a mob to disarm it. &7Charges: &a{charges}&7/{max}"
    status-bypass: "{prefix} &eRight-click a mob to disarm it. &7Charges: &aunlimited"
    player-target: "{prefix} &cThe Mob Disarmer does not work on players."
    excluded: "{prefix} &cThe Mob Disarmer does not work on &f{target}&c."
    too-far: "{prefix} &cThat mob is too far away."
    protected: "{prefix} &cYou can't disarm that mob here."
    protected-reason: "{prefix} &c{reason}"
    single-item: "{prefix} &cHold a single Mob Disarmer, not a stack."
    update-failed: "{prefix} &cThe Mob Disarmer could not be updated, so nothing was used."
  phantom-obliterator:
    obliterated: "{prefix} &5Obliterated &d{count} &5unnamed phantom(s). &7Charges: &a{charges}&7/{max}"
    obliterated-bypass: "{prefix} &5Obliterated &d{count} &5unnamed phantom(s)."
    nothing-in-range: "{prefix} &7No unnamed phantoms within &d{radius} &7blocks. Charges: &a{charges}&7/{max}"
    protected: "{prefix} &cThose phantoms are protected here, so nothing was spent."
    last-charge: "{prefix} &cThat was the last charge. Fully recharged in &f{time}&c."
    broke: "{prefix} &cThe Phantom Obliterator broke while in use."
    broken: "{prefix} &cThis Phantom Obliterator is broken."
    recharging: "{prefix} &cThe Phantom Obliterator is recharging. Ready in &f{time}&c."
    single-item: "{prefix} &cHold a single Phantom Obliterator, not a stack."
    update-failed: "{prefix} &cThe Phantom Obliterator could not be updated, so nothing was used."
  lazy-axe:
    too-large: "{prefix} &cThat tree is too large to fell (over {max} blocks)."
    busy: "{prefix} &cYou are already felling a tree."
    stopped-axe: "{prefix} &cStopped felling to keep your axe from breaking."

item:
  give:
    delivered: "{prefix} &aGave &f{amount}x {item} &ato &f{player}&a."
    dropped: "{prefix} &aGave &f{given}&a of &f{amount}x {item} &ato &f{player}&a; &f{dropped} &adid not fit and dropped at their feet."
    degraded: "{prefix} &eGave &f{amount}x {item} &eto &f{player}&e, but a head was given without its skin."
    refused-unresolved: "{prefix} &cA skin for {item} could not be resolved, so nothing was given to {player}."
    partial: "{prefix} &eGave &f{given}&e of &f{amount}x {item} &eto &f{player}&e; &f{leftover} &edid not fit and were not given."
    refused: "{prefix} &c{player}'s inventory cannot hold &f{amount}x {item}&c, so nothing was given."
    offline: "{prefix} &c{player} left before the items were ready, so nothing was given."
    cancelled: "{prefix} &cAnother plugin cancelled giving {item} to {player}."
    failed: "{prefix} &cCould not give {item}: &f{reason}"
    no-target: "{prefix} &c{reason}"
    invalid: "{prefix} &cInvalid item spec: &f{reason}"
    unresolved: "{prefix} &cCould not give {item} ({status}): &f{reason}"
    privileged: "{prefix} &cGiving {item} ({behavior}) needs &f{permission}&c."
    pending: "{prefix} &7Resolving skull profiles for {player}..."
    warning: "{prefix} &eWarning: {warning}"
    received: "{prefix} &aYou received &f{amount}x {item}&a."

mail:
  sent: "{prefix} &aMail sent to &f{player}&a."
  gift-sent: "{prefix} &aGift of &f{amount} &aitem(s) sent to &f{player}&a."
  gift-delayed: "{prefix} &eYour gift to &f{player} &eis safe and will arrive shortly."
  too-long: "{prefix} &cThat is too long; mail holds at most &f{max} &ccharacters."
  cost-refused: "{prefix} &cYou cannot pay for that mail."
  failed: "{prefix} &cMail is unavailable right now. Nothing was sent or taken; try again shortly."
  busy: "{prefix} &cYour last gift is still being sent."
  gift-empty-hand: "{prefix} &cHold the item you want to send."
  gift-too-many: "{prefix} &cA gift holds at most &f{max} &citems."
  empty: "{prefix} &7You have no mail."
  header: "{prefix} &fYour mail &7({count}):"
  entry-text: "&7[&f{id}&7] &fFrom {sender} &7({age}): &f{message}"
  entry-gift: "&7[&f{id}&7] &dGift from {sender} &7({age}), {count} stack(s): &f{message} &7- &f/mail claim {id}"
  entry-claiming: "&7[&f{id}&7] &dGift from {sender} &7({age}): being claimed. &f{message}"
  deleted: "{prefix} &aMail &f{id} &adeleted."
  delete-gift: "{prefix} &cGift &f{id} &cstill holds items; claim it first."
  not-found: "{prefix} &cYou have no mail &f{id}&c."
  cleared: "{prefix} &aDeleted &f{count} &aread mail."
  no-gifts: "{prefix} &7You have no gifts to claim."
  not-a-gift: "{prefix} &cMail &f{id} &cis not a gift."
  claim-taken: "{prefix} &cGift &f{id} &cis already being claimed."
  claim-full: "{prefix} &cYour inventory is full; gift &f{id} &cstays in your mailbox."
  claimed: "{prefix} &aClaimed gift &f{id}&a: &f{given} &aitem(s)."
  claimed-part: "{prefix} &eClaimed &f{given} &eitem(s) of gift &f{id}&e; &f{kept} &edid not fit and stay in your mailbox."
  unreadable: "{prefix} &cGift &f{id} &ccannot be claimed on this server: {reason}. It stays in your mailbox."
  unread:
    text: "{prefix} &eYou have &f{count} &eunread mail. &f/mail read"
    sound: minecraft:entity.experience_orb.pickup
    volume: 0.6
  new:
    text: "{prefix} &eNew mail from &f{sender}&e. &f/mail read"
    sound: minecraft:entity.experience_orb.pickup
    volume: 0.6
  new-gift:
    text: "{prefix} &dNew gift from &f{sender}&d. &f/mail read"
    sound: minecraft:entity.experience_orb.pickup
    volume: 0.6
  unknown-player: "{prefix} &cNo player called &f{player} &chas played here."
  self: "{prefix} &cYou can't mail yourself."
  cannot-receive: "{prefix} &c{player} can't receive mail right now."
  unavailable: "{prefix} &c{player} can't receive mail right now; try again shortly."
  mailbox-full: "{prefix} &c{player}'s mailbox is full."
  rate-limited: "{prefix} &cYou can send at most &f{sends} &cmail every &f{seconds}&cs."
  disabled: "{prefix} &cMail is disabled on this server."

preferences:
  unavailable: "{prefix} &c{player}'s settings are still loading. Try again shortly."

